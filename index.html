<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бібліотека дайджестів ШІ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Unbounded:wght@500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout idea: brand header → search → equal issue cards whose previews play the deck in miniature; player opens full-window over the library. */
:root{
  --bg:#F3F4F8; --surface:#FCFCFE; --ink:#121A33; --muted:#59627A; --line:#DFE3EC; --accent:#C2410C; --accent-fill:#FF7A1A;
  --t-models:#3D5AFE; --t-business:#087563; --t-security:#C2410C; --t-practice:#6D28D9; --t-github:#1F7A35;
  --display:'Unbounded', Verdana, sans-serif; --body:'Manrope', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1020; --surface:#151B2E; --ink:#EEF1F8; --muted:#A3ACC3; --line:#283049; --accent:#FF9A55; --accent-fill:#FF7A1A;
    --t-models:#8EA0FF; --t-business:#3CC4A8; --t-security:#FB923C; --t-practice:#B39BFA; --t-github:#4AC965;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#151B2E; --ink:#EEF1F8; --muted:#A3ACC3; --line:#283049; --accent:#FF9A55; --accent-fill:#FF7A1A;
  --t-models:#8EA0FF; --t-business:#3CC4A8; --t-security:#FB923C; --t-practice:#B39BFA; --t-github:#4AC965;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body.playing{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-fill);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
.mono{width:44px;height:44px;border-radius:10px;background:#121A33;color:#FF8A3D;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none;box-shadow:inset 0 -4px 0 #FF7A1A}
.brand b{display:block;font-weight:800;letter-spacing:.06em;font-size:15px}
.brand span{display:block;color:var(--muted);font-size:13px}
.top .sp{flex:1}
.top .note{font-size:13px;color:var(--muted)}

/* search */
.toolbar{margin:28px 0 20px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:13px 0;outline:none;min-width:0}

/* results */
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:24px;overflow:hidden}
.results h3{margin:0;padding:14px 18px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.res:last-child{border-bottom:0}
.res:hover{background:color-mix(in srgb, var(--accent-fill) 7%, transparent)}
.res .t{font-weight:700}
.res .s{color:var(--muted);font-size:14px}
.res mark{background:color-mix(in srgb, var(--accent-fill) 30%, transparent);color:inherit;border-radius:3px;padding:0 2px}
.pill{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.empty{padding:18px;color:var(--muted)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:40px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pv-wrap{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border:0;padding:0;cursor:pointer;display:block;width:100%;background:#121A33}
.pv-inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none;overflow:hidden}
.pv-wrap .play{position:absolute;right:14px;bottom:16px;background:rgba(18,26,51,.85);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;transition:transform .2s}
.pv-wrap:hover .play{transform:scale(1.06)}
.pvbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#3D5AFE,#FF7A1A);transition:width .6s ease}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted);min-height:26px}
.wk{font-family:var(--display);font-weight:700;color:var(--accent);font-size:13px}
.new{background:var(--accent-fill);color:#121A33;font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px}
.card h2{margin:0;font-size:21px;line-height:1.25;text-wrap:balance}
.counts{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.btn{border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px 0 28px}
#err{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.top .note{display:none}}

/* shared slide rendering (preview + player) */
.slide,.pv{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:'Manrope',Arial,sans-serif;line-height:normal}
.slide h1,.slide h2,.slide h3,.slide p,.pv h1,.pv h2,.pv h3,.pv p{margin:0}
.slide h1,.pv h1{font-size:96px;font-weight:600;line-height:1.1}
.slide h2,.pv h2{font-size:64px;font-weight:600;line-height:1.15}
.slide h3,.pv h3{font-size:44px;font-weight:600;line-height:1.2}
.slide p,.pv p{font-size:32px;line-height:1.4}
.slide hr,.pv hr{margin:0;border:0;width:100%}
.slide .ico,.pv .ico{display:block;flex:none}
.notes{display:none}
.anim .slide{visibility:hidden}
.anim .slide.active{visibility:visible}
.anim .embed{display:block;background:transparent}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes pushInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOutL{from{transform:none}to{transform:translateX(-100%)}}
@keyframes pushInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pushOutR{from{transform:none}to{transform:translateX(100%)}}
.t-fade-in{animation:fadeIn .7s ease both;z-index:2}
.t-fade-out{animation:fadeOut .7s ease both;z-index:1}
.t-push-in-f{animation:pushInR .7s cubic-bezier(.65,0,.35,1) both;z-index:2}
.t-push-out-f{animation:pushOutL .7s cubic-bezier(.65,0,.35,1) both;z-index:1}
.t-push-in-b{animation:pushInL .7s cubic-bezier(.65,0,.35,1) both;z-index:2}
.t-push-out-b{animation:pushOutR .7s cubic-bezier(.65,0,.35,1) both;z-index:1}
@keyframes b-fade{from{opacity:0}to{opacity:1}}
@keyframes b-rise{from{opacity:0;translate:0 48px}to{opacity:1;translate:0 0}}
@keyframes b-drop{from{opacity:0;translate:0 -48px}to{opacity:1;translate:0 0}}
@keyframes b-left{from{opacity:0;translate:-90px 0}to{opacity:1;translate:0 0}}
@keyframes b-right{from{opacity:0;translate:90px 0}to{opacity:1;translate:0 0}}
@keyframes b-pop{0%{opacity:0;scale:.8}70%{opacity:1;scale:1.04}100%{opacity:1;scale:1}}
@keyframes b-scale{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.anim .slide [data-build-in]{opacity:0}
.anim .slide.built [data-build-in]{animation-duration:.75s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
/* in-slide micro animations: count-up numbers, growing bars, drawn lines, popping dots */
@property --n{syntax:'<integer>';inherits:false;initial-value:0}
.cnt{--n:var(--to);counter-reset:n var(--n)}
.cnt::before{content:counter(n)}
@keyframes cnt{from{--n:0}to{--n:var(--to)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-origin:left center}
.anim .slide.built .cnt{animation:cnt 1.6s cubic-bezier(.2,.8,.2,1) var(--d,.6s) both}
.anim .slide.built .grow{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) var(--d,.8s) both}
.anim .slide.built .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s cubic-bezier(.4,0,.2,1) var(--d,.9s) forwards}
.anim .slide.built .dot{animation:b-pop .45s ease var(--d,1s) both}
@media (prefers-reduced-motion: reduce){
  #stage .slide [data-build-in]{opacity:1}
  #stage .slide.built [data-build-in]{animation:none!important}
  #stage .slide.built .cnt,#stage .slide.built .grow,#stage .slide.built .draw,#stage .slide.built .dot{animation:none!important;stroke-dasharray:none}
  .t-fade-in,.t-fade-out,.t-push-in-f,.t-push-out-f,.t-push-in-b,.t-push-out-b{animation-duration:.01s!important}
}

/* player */
#player{position:fixed;inset:0;background:#05070D;z-index:50}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#05070D}
#stage [data-go]{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
#stage [data-go]:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(18,26,51,.18)}
.ptop{position:fixed;left:calc(14px + env(safe-area-inset-left, 0px));top:calc(12px + env(safe-area-inset-top, 0px));display:flex;gap:10px;align-items:center;z-index:60}
.pctl{position:fixed;right:calc(14px + env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:8px;align-items:center;z-index:60;opacity:.25;transition:opacity .25s}
.pctl:hover,.pctl:focus-within,.ptop:hover{opacity:1}
.pb{font:600 14px Manrope,Arial,sans-serif;color:#E6EDF3;background:rgba(20,26,40,.82);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 12px;cursor:pointer}
.ptitle{font:600 14px Manrope,Arial,sans-serif;color:#C9D1E6;background:rgba(20,26,40,.6);border-radius:9px;padding:8px 12px}
#pbar{position:fixed;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#3D5AFE,#FF7A1A);transition:width .5s ease;z-index:60}
#pnotes{position:fixed;left:16px;right:16px;bottom:62px;max-height:32vh;overflow:auto;background:rgba(10,14,24,.94);color:#E6EDF3;font:16px/1.55 Manrope,Arial,sans-serif;padding:16px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.15);z-index:61}
#phint{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top, 0px));transform:translateX(-50%);background:rgba(10,14,24,.85);color:#E6EDF3;font:14px Manrope,Arial,sans-serif;padding:8px 16px;border-radius:999px;z-index:60;transition:opacity 1s;white-space:nowrap}
@media (max-width:700px){#phint{display:none}}
</style>
</head>

та «Dictator» з власною віртуальною машиною і дозволами на кожну дію 5 провайдерів: ChatGPT, Claude, Gemini, Grok, OpenRouter Чому це важливо ШІ приходить туди, де ми й так спілкуємося з колегами та постачальниками. Офіційного анонсу Telegram поки "}, {"n": 8, "id": "b04", "topic": "business", "title": "Anthropic провела найбільше IPO в історії: $81,3 млрд на Nasdaq", "text": "Бізнес і гроші 19 листопада 04 / 12 ↩ Продовження: тиждень 45 $81,3 млрд залучила Anthropic — найбільше IPO в історії Anthropic провела найбільше IPO в історії: $81,3 млрд на Nasdaq 980 млн акцій по $83 — вище за діапазон $70–78; оцінка компанії — близько $1,5 трлн Перший день: відкриття $111,50 (+34%), закриття $97,17 (+17%); наступного дня — мінус 8,5% Більше, ніж у SpaceX ($75 млрд у червні 2026); тикер ANT, обговорюють швидке включення до Nasdaq-100 Чому це важливо Перший публічний «іспит» для оцінок ШІ-компаній: тепер ринок щодня показує, скільки коштує лабораторія фронтир-моделей. Джерел"}, {"n": 9, "id": "b05", "topic": "business", "title": "Nvidia: рекордний квартал — $115,8 млрд, удвічі більше, ніж рік тому", "text": "Бізнес і гроші 17 листопада 05 / 12 $115,8 млрд виручка Nvidia за квартал (+103% за рік) Nvidia: рекордний квартал — $115,8 млрд, удвічі більше, ніж рік тому Дата-центри — $107,6 млрд (+110%); чистий прибуток — $65,3 млрд, маржа 74,8% Почалися поставки стійок Vera Rubin NVL72 — за словами Nvidia, найшвидший запуск продукту в її історії Прогноз на наступний квартал — $130 млрд, і це без продажів дата-центрів у Китай Чому це важливо Попит на ШІ-інфраструктуру не сповільнюється — це головний індикатор того, що ШІ-бум триває. Джерело: nvidianews.nvidia.com 9"}, {"n": 10, "id": "b06", "topic": "business", "title": "Рада Nvidia повернула Дженсена Хуанга — акції злетіли на 31% за день", "text": "Бізнес і гроші 23 листопада 06 / 12 +31% акції Nvidia за день — найкращий день з 2003 року Рада Nvidia повернула Дженсена Хуанга — акції злетіли на 31% за день 11 листопада рада прийняла відставку Хуанга, а 22 листопада одноголосно проголосувала за його повернення Капіталізація зросла приблизно на $950 млрд — до ~$3,98 трлн (за даними The Motley Fool) Хуанг знову президент і CEO; незалежний комітет ради продовжує розслідування Чому це важливо Доля однієї людини за день зрушила ринок майже на трильйон: ШІ став питанням макроекономіки й політики. Джерела: nvidianews.nvidia.com, axios.com 10"}, {"n": 11, "id": "s07", "topic": "security", "title": "Атака з ШІ-інструментом ARTEX понад 10 днів паралізувала сервіси Єврокомісії", "text": "Безпека і регулювання 19 листопада 07 / 12 Атака з ШІ-інструментом ARTEX понад 10 днів паралізувала сервіси Єврокомісії Не працювали зарплати, відпустки й компенсація медвитрат; атаку виявили ще 22 жовтня CERT-EU пов’язує її з ARTEX — публічним ШІ-фреймворком для пентестів; Єврокомісія підтвердила використання ШІ ФБР попереджало: в інтернеті відкрито понад 1 600 консолей ARTEX, а частина атак отримувала доступ менш ніж за 3 години 10+ днів збою внутрішніх сервісів Чому це важливо: ШІ скорочує час від проникнення до захоплення системи. Захищатися треба навіть тим, хто сам ШІ не використовує. Дж"}, {"n": 12, "id": "s08", "topic": "security", "title": "Nvidia припинила поставки дозволених чипів H200 до Китаю", "text": "Безпека і регулювання 17–18 листопада 08 / 12 Nvidia припинила поставки дозволених чипів H200 до Китаю За квартал до Китаю відвантажили чипи Hopper на $2,4 млрд; подальших поставок не буде, заявила Колетт Кресс За даними Reuters, близько 600 тис. H200 лежать на складах у Гонконгу: Пекін не погоджує імпорт Moonshot AI, за повідомленнями, скасувала угоду на $150 млн щодо доступу до чипів Nvidia в Індонезії $2,4 млрд останні поставки чипів у Китай за квартал Чому це важливо: технологічний розрив між США і Китаєм поглиблюється, а китайські лабораторії переходять на власні чипи. Джерела: finance.ya"}, {"n": 13, "id": "s09", "topic": "security", "title": "Хто встановлює правила для ШІ: губернатори США, ООН і пропозиція OpenAI", "text": "Безпека і регулювання 22–23 листопада 09 / 12 Хто встановлює правила для ШІ: губернатори США, ООН і пропозиція OpenAI Губернатори США: національні ризики — Вашингтону, захист працівників, споживачів і дітей — штатам; плюс незалежні аудити Генсек ООН закликав до «спільного фундаменту безпеки ШІ» і глобального фонду для розвитку ШІ-спроможностей Головний науковець OpenAI запропонував не переходити певні пороги можливостей, доки немає засобів контролю 2 грудня нові вимоги EU AI Act Для бізнесу: з 2 грудня в ЄС діють заборона «нудифікаторів» і машинозчитуване маркування контенту генеративних систе"}, {"n": 14, "id": "p10", "topic": "practice", "title": "Microsoft Ignite: 50 млн ШІ-агентів і «відділ кадрів» для них", "text": "Практика 17–19 листопада 10 / 12 Microsoft Ignite: 50 млн ШІ-агентів і «відділ кадрів» для них 50 млн агентів уже працюють в Agent 365 Агентам, як і співробітникам, потрібні власник, бюджет і права доступу. Час вводити внутрішні правила. 1 Copilot Autopilot — автономний агент із власною поштою й обліковим записом у компанії 2 Новий модуль рахує витрати на ШІ та зіставляє їх із результатом роботи агентів 3 Defender захищає локальних агентів (Claude Code, Copilot CLI), а Intune знаходить «тіньових» Джерела: blogs.microsoft.com, petri.com 14"}, {"n": 15, "id": "p11", "topic": "practice", "title": "Що вже можна використовувати: нові функції ChatGPT, Gemini і Canva", "text": "Практика 18–23 листопада 11 / 12 Що вже можна використовувати: нові функції ChatGPT, Gemini і Canva Mac Gemini керує застосунками на комп’ютері Агенти, що самі працюють за комп’ютером, виходять у масові продукти. Але є й ризики: тестувальники Meta Muse бачили чужі дані. 1 ChatGPT: диктування без 10-хвилинного ліміту і Space — спільні інтерактивні сторінки й презентації (Plus) 2 Gemini керує застосунками на Mac (поки лише США, англійська, платні тарифи) і створює GIF 3 Canva додала «вимикач ШІ» для генеративних функцій — зручно для компаній із суворими правилами Джерела: theneuron.ai, releasebo"}, {"n": 16, "id": "p12", "topic": "practice", "title": "ШІ у фармі: $5 млрд для Isomorphic Labs і до −50% часу на доклініку", "text": "ШІ у фармі 17–20 листопада 12 / 12 ШІ у фармі: $5 млрд для Isomorphic Labs і до −50% часу на доклініку −50% часу на доклінічну розробку — за словами Big Pharma ШІ прискорює появу нових молекул, але схвалених «ШІ-препаратів» поки немає — реальний ефект для ринку з’явиться через роки. 1 Isomorphic Labs (Alphabet) залучила $5 млрд — через пів року після раунду на $2,1 млрд 2 19 листопада — дослідницька угода з Merck (MSD) щодо онкологічної мішені; власні програми ще на доклініці 3 Novartis, AstraZeneca, GSK і Sanofi: генеративний ШІ скорочує доклінічні строки до 50% (Reuters) Джерела: thepharmale"}, {"n": 17, "id": "repos-intro", "topic": "github", "title": "GitHub: інструменти, що вирішують задачі", "text": "Розділ 2 · Відкритий код GitHub: інструменти, що вирішують задачі Тиждень 16–23 листопада 2026 · рейтинг Trendshift за приростом зірок 17"}, {"n": 18, "id": "g-chart", "topic": "github", "title": "Нові інструменти тижня на GitHub", "text": "$ trendshift --weekly --solves-a-problem Нові інструменти тижня на GitHub EL4CTEO/fast-anything +1,4 тис. zhouxiaoka/autoclip +1,2 тис. · друге дихання pierridotite/mobile-agent-testers +1,0 тис. google-gemini/gemini-api-cli +753 shirudo-dev/shirudo +521 erkamyaman/safe-anything +496 Приріст зірок за 16–23.11.2026 · trendshift.io · без повторів з попередніх випусків і випуску колеги 18"}, {"n": 19, "id": "g01", "topic": "github", "title": "EL4CTEO/fast-anything", "text": "github.com/EL4CTEO/fast-anything №1 · 1 / 6 · новинка EL4CTEO/fast-anything Прискорює повільний код: переносить «гарячі» функції в Rust Що це: інструмент (MIT), що профілює застосунок на Python, Node чи Ruby і знаходить 5% коду, які гальмують усе Як працює: ШІ-агент переписує ці функції на Rust, а порт вмикається, лише якщо результати збіглися на всіх перевірках Кому: командам з «важкими» внутрішніми скриптами й сервісами: аналітика, обробка даних Ризики: проєкту кілька днів, версії виходять щодня; якість залежить від ШІ-агента +1,4 тис. зірок за тиждень · ~2,7 тис. загалом Чому це важливо Не "}, {"n": 20, "id": "g02", "topic": "github", "title": "zhouxiaoka/autoclip", "text": "github.com/zhouxiaoka/autoclip №2 · 2 / 6 · друге дихання zhouxiaoka/autoclip Нарізає довгі відео в короткі ролики для Reels, Shorts і TikTok Що це: застосунок (MIT): десктоп, веб-інтерфейс у Docker або MCP-сервер Як працює: ШІ читає субтитри, знаходить яскраві моменти, нарізає кліпи й додає субтитри, обкладинки та заголовки Кому: маркетингу, HR і навчанню — щоб перетворювати вебінари й лекції на короткий контент Ризики: проєкт не новий (липень 2025); хмарні моделі платні; за замовчуванням додає брендовану кінцівку +1,2 тис. зірок за тиждень · ~9,3 тис. загалом Чому це важливо Година вебінару "}, {"n": 21, "id": "g03", "topic": "github", "title": "pierridotite/mobile-agent-testers", "text": "github.com/pierridotite/mobile-agent-testers №3 · 3 / 6 · новинка pierridotite/mobile-agent-testers 20 ШІ-тестувальників перевіряють мобільний застосунок одночасно Що це: шаблон GitHub Actions (MIT), що запускає до 20 симуляторів iOS і Android на безкоштовних раннерах GitHub Як працює: кожним пристроєм керує агент Claude Code зі своєю «персоною»: мова, розмір шрифту, напрямок тексту Кому: командам із клієнтськими або B2B-застосунками, зокрема для замовлень Ризики: потрібен ключ Claude, лише емулятори; хвилини macOS безкоштовні тільки для публічних репозиторіїв +1,0 тис. зірок за тиждень · ~1,5"}, {"n": 22, "id": "g04", "topic": "github", "title": "google-gemini/gemini-api-cli", "text": "github.com/google-gemini/gemini-api-cli №4 · 4 / 6 · новинка google-gemini/gemini-api-cli Усі можливості Gemini — з командного рядка для агентів і скриптів Що це: офіційний експериментальний інструмент Google (Apache 2.0) на Go Як працює: текст, зображення, мовлення й відео, аналіз файлів, транскрипція і Deep Research — однією командою Кому: тим, хто будує автоматизацію: транскрипція нарад, обробка документів Ризики: бета-версія, інтерфейс може змінюватися; потрібен ключ GEMINI_API_KEY +753 зірок за тиждень · ~930 загалом Чому це важливо Інші агенти (Claude Code, Codex) отримують мультимодальн"}, {"n": 23, "id": "g05", "topic": "github", "title": "shirudo-dev/shirudo", "text": "github.com/shirudo-dev/shirudo №5 · 5 / 6 · новинка shirudo-dev/shirudo Тимчасовий «щит» від експлойтів у Linux — без перезавантаження Що це: проєкт (BSD-2) для захисту серверів між публікацією вразливості та встановленням патча Як працює: завантажує в ядро підписані eBPF-«щити», що блокують шлях експлойта; кожна дія пишеться в журнал аудиту Кому: ІТ-службам з Linux-серверами: ERP, склад, облікові системи Ризики: ще пре-реліз і не замінює патчі; участь OpenAI і Cisco — за повідомленнями +521 зірок за тиждень · ~570 загалом Чому це важливо Атаки з ШІ стають швидшими — «щит» дає час встановити п"}, {"n": 24, "id": "g06", "topic": "github", "title": "erkamyaman/safe-anything", "text": "github.com/erkamyaman/safe-anything №6 · 6 / 6 · новинка erkamyaman/safe-anything Сканер вразливостей коду й небезпечних налаштувань ШІ-агентів Що це: один файл на Rust (MIT) з 74 правилами; запуск однією командою npx safe-anything Як працює: шукає ін’єкції, витоки секретів, вразливі залежності й небезпечні налаштування агентів (.mcp.json, CLAUDE.md) Кому: будь-якій компанії, де співробітники почали користуватися ШІ-агентами для коду Ризики: один автор, проєкту ~3 дні, є відкриті баги; список залежностей іде на OSV.dev +496 зірок за тиждень · ~510 загалом Чому це важливо Агенти пишуть дедалі б"}, {"n": 25, "id": "final", "topic": "intro", "title": "Що це означає для нас", "text": "Підсумки тижня · 17–24 листопада Що це означає для нас 01 ШІ — трильйонний актив IPO Anthropic і стрибок Nvidia показали: ринок вкладається в ШІ всерйоз, але коливання дуже різкі. 02 Агенти всюди Агенти в Telegram, у Microsoft і на GitHub — і водночас у кібератаках. Їм потрібні власник, права й аудит. 03 Фронтир дешевшає GPT-6.2 і Gemini 4 Neon дешевші за попередників: впроваджувати ШІ в процеси стає вигідніше. Дякую! Ваші питання? Усі випуски — у бібліотеці дайджестів 25"}]}, {"id": "w45", "week": 45, "title": "Новини ШІ: 3–10 листопада 2026", "dates": "3–10 листопада 2026", "start": "2026-11-03", "file": "issues/w45.html", "slideCount": 22, "newsCount": 11, "repoCount": 5, "cover": "<section class=\"pv\" id=\"cover\" data-transition=\"fade\" style=\"background:linear-gradient(135deg, #F6F7FB 0%, #FDEFE4 100%);color:#121A33;font-family:'Manrope', Arial, sans-serif;padding:128px;display:flex;flex-direction:column\">\n\n<p data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:200px;width:880px;font-size:26px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#3D5AFE\">Дайджест · тиждень 45<\/p>\n<h1 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:260px;width:880px;font-family:'Manrope', Arial, sans-serif;font-size:104px;font-weight:800;line-height:1.05;letter-spacing:-2px;color:#121A33\">Новини штучного інтелекту<\/h1>\n<p data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:600px;width:900px;font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;color:#C2410C\">3–10 листопада 2026<\/p>\n<p data-build-in=\"fade 4 auto\" style=\"position:absolute;left:128px;top:720px;width:820px;font-size:32px;line-height:1.4;color:#4A5368\">11 головних подій тижня та 5 нових репозиторіїв GitHub, які набрали найбільше зірок<\/p>\n<aside class=\"notes\">Вітаю! Це огляд найважливішого у світі штучного інтелекту за 3–10 листопада 2026 року (дані зібрано станом на 9 листопада). Спершу 11 новин у чотирьох темах, потім — п’ять нових проєктів GitHub тижня.<\/aside>\n<\/section>\n", "slides": [{"n": 1, "id": "cover", "topic": "intro", "title": "Новини штучного інтелекту", "text": "Дайджест · тиждень 45 Новини штучного інтелекту 3–10 листопада 2026 11 головних подій тижня та 5 нових репозиторіїв GitHub, які набрали найбільше зірок"}, {"n": 2, "id": "agenda", "topic": "intro", "title": "Про що поговоримо", "text": "План огляду Про що поговоримо 01–03 Моделі та продукти Images 2.6, Cursor-застосунки, відкриття Claude 04–06 Бізнес і гроші $11 млрд OpenAI, звітність Anthropic, обвал акцій 07–09 Безпека і регулювання 948 дір у Linux, звіт METR, референдуми про ЦОДи 10–11 Практика Revolut економить 90%, ШІ і скорочення Top 5 GitHub: новинки тижня Свіжі репозиторії з найбільшим приростом зірок 2"}, {"n": 3, "id": "numbers", "topic": "intro", "title": "Тиждень у цифрах", "text": "Коротко Тиждень у цифрах $1,25 трлн оцінка OpenAI після нового раунду на $11 млрд $17 млрд виручка Anthropic за III квартал — у ~12 разів більше, ніж рік тому 948 вразливостей у ядрі Linux знайшов ШІ-конвеєр OpenAI 40 з 41 місцевих референдумів у США — за обмеження дата-центрів 3"}, {"n": 4, "id": "m01", "topic": "models", "title": "OpenAI випустила Images 2.6: GIF-анімації та генерація на 50% швидша", "text": "Моделі та продукти 4 листопада 01 / 11 OpenAI випустила Images 2.6: GIF-анімації та генерація на 50% швидша Зображення генеруються на 50% швидше; модель Flare — усього за ~6 секунд ChatGPT і Codex створюють анімовані GIF з промпту або фото, кожен кадр можна редагувати Модель Sunburst — для точних правок і експорту у векторний SVG 4 млрд зображень на тиждень генерують ChatGPT і API Чому це важливо Картинки й анімації для соцмереж, банерів і презентацій стають щоденним інструментом без дизайнерських програм. Джерела: aiweekly.co, openai.com 4"}, {"n": 5, "id": "m02", "topic": "models", "title": "Cursor тепер не лише пише код, а й запускає готовий вебзастосунок", "text": "Моделі та продукти 5 листопада 02 / 11 Cursor тепер не лише пише код, а й запускає готовий вебзастосунок Агент збирає застосунок за промптом: база Postgres, вхід через SSO, хостинг і живе посилання Перед публікацією — автоматичні перевірки безпеки, наприклад на ключі й паролі в коді Адміни команди бачать усі застосунки, затверджують публікації й можуть їх зняти 1 промпт від ідеї до робочого застосунку з посиланням Чому це важливо Внутрішні інструменти для відділу можна зібрати за години. Але потрібні правила: хто і що публікує. Джерело: cursor.com/changelog 5"}, {"n": 6, "id": "m03", "topic": "models", "title": "Claude допоміг знайти в бактеріях загадкові білкові «сховища»", "text": "Моделі та продукти 4 листопада 03 / 11 Claude допоміг знайти в бактеріях загадкові білкові «сховища» Переглянув ~15 млрд передбачених білків і знайшов родичів vault-білка у 29 типах бактерій З 15 перевірених білків 7 зібралися у «сховища»; кріоелектронна мікроскопія підтвердила 4 Очищення білка — 90 хвилин замість ~3 днів, перша 3D-модель — за 34 години 15 млрд білків переглянув Claude у пошуку кандидатів Чому це важливо ШІ стає учасником лабораторних досліджень. Звіт чесно описує й помилки Claude, які коштували команді тижні. Джерело: anthropic.com 6"}, {"n": 7, "id": "b04", "topic": "business", "title": "OpenAI залучила $11 млрд при оцінці $1,25 трлн", "text": "Бізнес і гроші 6 листопада 04 / 11 $1,25 трлн оцінка OpenAI після першої частини нового раунду OpenAI залучила $11 млрд при оцінці $1,25 трлн Це перша частина раунду, загалом він може сягнути $20 млрд (Bloomberg) За повідомленнями ЗМІ, раніше компанія цілилася у $30 млрд при оцінці $1,4 трлн 5 листопада OpenAI пообіцяла сама платити за енергію та інфраструктуру своїх кампусів Чому це важливо Інвестори й далі фінансують гонку ШІ, але обережніше: зібрано менше, ніж планувалося. Джерела: gvwire.com (Reuters / Bloomberg), siliconreport.com 7"}, {"n": 8, "id": "b05", "topic": "business", "title": "Anthropic показала звітність перед IPO: $17 млрд виручки за квартал", "text": "Бізнес і гроші 2 листопада 05 / 11 $17 млрд виручка Anthropic за III квартал 2026 Anthropic показала звітність перед IPO: $17 млрд виручки за квартал Виручка в III кварталі — майже $17 млрд, приблизно у 12 разів більше, ніж рік тому Операційний збиток $567 млн після прибутку в II кварталі — через дорогі обчислення Зобов’язання на ~$895 млрд, майже все — обчислення й інфраструктура (Broadcom, Google, Amazon) Чому це важливо IPO під тикером ANT планується на Nasdaq до кінця листопада; інвестори обговорюють оцінку $1,4–1,5 трлн. Джерело: thenextweb.com 8"}, {"n": 9, "id": "b06", "topic": "business", "title": "Найгірший день для акцій ШІ з квітня 2025: Nasdaq упав на 5,5%", "text": "Бізнес і гроші 5 листопада 06 / 11 −5,5% падіння Nasdaq Composite за один день Найгірший день для акцій ШІ з квітня 2025: Nasdaq упав на 5,5% Nvidia −9,3%, AMD −17,3%, CoreWeave −9,8%: лідирували компанії, пов’язані з будівництвом дата-центрів S&P 500 знизився на 4,4%, а Nasdaq опинився на 11,9% нижче свого рекорду — це «корекція» Причини: дорожчі кредити, страх «бульбашки» та ризик пауз у будівництві дата-центрів Чому це важливо Ринок уперше так різко засумнівався, що витрати на ШІ-інфраструктуру швидко окупляться. Джерело: wsmv.com (Associated Press) 9"}, {"n": 10, "id": "s07", "topic": "security", "title": "948 вразливостей у ядрі Linux: ШІ-конвеєр OpenAI знайшов їх і запропонував латки", "text": "Безпека і регулювання 4–5 листопада 07 / 11 948 вразливостей у ядрі Linux: ШІ-конвеєр OpenAI знайшов їх і запропонував латки Агенти шукають помилку, відтворюють її, пишуть експлойт і латку; люди перевіряють усе перед передачею розробникам Прогін коштував $1,2 млн — близько $1 279 за вразливість; 61 уже виправлено в основній гілці ядра 5 листопада OpenAI відкрила модель GPT-6 Cyber лише перевіреним клієнтам — із рейтингом ризику «критичний» 948 вразливостей з робочими експлойтами Чому це важливо: захисники отримують потужний інструмент, але й ціна атаки падає. Вчасні оновлення стають ще важливі"}, {"n": 11, "id": "s08", "topic": "security", "title": "METR: Anthropic покращує моделі вдвічі швидше — і ШІ, схоже, допомагає сам собі", "text": "Безпека і регулювання 5 листопада 08 / 11 METR: Anthropic покращує моделі вдвічі швидше — і ШІ, схоже, допомагає сам собі Незалежна організація METR вивчила 11 тижнів внутрішніх даних Anthropic і поспілкувалася з її співробітниками Висновок: прогрес на чітко поставлених задачах удвічі швидший, ніж рік тому; ймовірна причина — ШІ в дослідженнях Застереження: частину даних засекречено, а прискорення може стосуватися лише задач, які легко оцінити ×2 швидше покращуються моделі, ніж рік тому Чому це важливо: це перша незалежна оцінка «самоприскорення» ШІ. Регулятори й інвестори уважно стежитимуть з"}, {"n": 12, "id": "s09", "topic": "security", "title": "Жителі США підтримали обмеження дата-центрів у 40 з 41 місцевих голосувань", "text": "Безпека і регулювання 3 листопада 09 / 11 Жителі США підтримали обмеження дата-центрів у 40 з 41 місцевих голосувань 41 голосування в 10 штатах; 21 — в Огайо, де кілька громад повністю заборонили нові дата-центри За опитуванням CNBC, для 56% виборців дата-центри були важливим чинником під час голосування OpenAI у відповідь пообіцяла сама оплачувати електроенергію та інфраструктуру своїх кампусів 40 з 41 голосування — за обмеження Чому це важливо: головним обмеженням ШІ стають не чипи, а згода місцевих громад: енергія, вода й тарифи стають політикою. Джерела: baxtel.com (дані Ballotpedia), badg"}, {"n": 13, "id": "p10", "topic": "practice", "title": "Revolut перейшов на власні сервери з китайською моделлю GLM і зекономив до 90%", "text": "Практика 4 листопада 10 / 11 Revolut перейшов на власні сервери з китайською моделлю GLM і зекономив до 90% −90% витрат на ШІ-кодинг менш ніж за рік Відкриті моделі на власних серверах — реальна альтернатива дорогим підпискам, коли запитів дуже багато. 1 Моделі GLM від Z.ai на 56 GPU Nvidia B200: ~$0,30 за 1 млн токенів, у ~10 разів дешевше комерційних 2 Компанія повідомляє про +70% продуктивності за часом виконання й +60% за часом написання коду 3 Інші теж рахують: Apple скоротила денний ліміт на ШІ-інструменти для частини інженерів з $300 до $200 Джерела: techradar.com, mindandmachineweekly."}, {"n": 14, "id": "p11", "topic": "practice", "title": "ШІ назвали причиною лише 3% жовтневих скорочень у США — мінімум за рік", "text": "Практика 5 листопада 11 / 11 ШІ назвали причиною лише 3% жовтневих скорочень у США — мінімум за рік 1 265 скорочень через ШІ в жовтні Масової заміни людей ШІ поки не видно в статистиці: економіка важить більше. Але ШІ змінює зміст роботи. 1 З 43 994 оголошених у жовтні скорочень на ШІ припадає менше 3% 2 З початку року — 121 401 скорочення через ШІ: близько 20% усіх і вдвічі більше, ніж у 2025-му 3 Пік був у травні (38 579), тепер головна причина — ринкові та економічні умови Джерело: Challenger, Gray & Christmas (через badgoodbetter.substack.com) 14"}, {"n": 15, "id": "repos-intro", "topic": "github", "title": "GitHub: новинки тижня", "text": "Розділ 2 · Відкритий код GitHub: новинки тижня Тиждень 2–8 листопада 2026 · нові проєкти з рейтингу gittrend.io 15"}, {"n": 16, "id": "g-chart", "topic": "github", "title": "Нові ШІ-репозиторії тижня", "text": "$ git trending --since=weekly --new --topic=ai Нові ШІ-репозиторії тижня deepseek-ai/dsh-superagent-prototype +12,9 тис. vercel-labs/agent-desktop +11,9 тис. NVIDIA/auto-ontology +9,1 тис. cactus-compute/cactus +8,4 тис. heydamir/unslop +6,5 тис. Приріст зірок за 2–8.11.2026 · gittrend.io · REA (+22,2 тис.) знову №1 — див. жовтневий випуск 16"}, {"n": 17, "id": "g01", "topic": "github", "title": "deepseek-ai/dsh-superagent-prototype", "text": "github.com/deepseek-ai/dsh-superagent-prototype №1 · 1 / 5 · новинка deepseek-ai/dsh-superagent-prototype Прототип DeepSeek: рій агентів сам розбирає завдання з GitHub Що це: дослідницький прототип DeepSeek (MIT): координатор ділить завдання між агентами, що працюють паралельно Як працює: агент бачить баг у чаті чи issue, відтворює його, пробує виправити й надсилає зміну людині на перевірку Кому: командам розробки; це не офіційний продукт, частина ідей зі статті ще не реалізована +12,9 тис. зірок за тиждень · 21,1 тис. загалом Чому це важливо Вузьким місцем стає не ШІ, а увага людини: агенти б"}, {"n": 18, "id": "g02", "topic": "github", "title": "vercel-labs/agent-desktop", "text": "github.com/vercel-labs/agent-desktop №2 · 2 / 5 · новинка vercel-labs/agent-desktop Дає ШІ-агенту керувати будь-якою програмою на комп’ютері Що це: інструмент командного рядка від Vercel Labs для macOS, Windows і Linux (Apache 2.0) Як працює: читає дерево доступності ОС, як екранні читачі, і клікає по елементах без скріншотів; є MCP-сервер Кому: розробникам агентів; автори радять запускати у віртуальній машині без важливих акаунтів +11,9 тис. зірок за тиждень · 19,3 тис. загалом Чому це важливо Агенти виходять за межі браузера й можуть працювати з будь-якими настільними програмами. Джерела: fl"}, {"n": 19, "id": "g03", "topic": "github", "title": "NVIDIA/auto-ontology", "text": "github.com/NVIDIA/auto-ontology №3 · 3 / 5 · новинка NVIDIA/auto-ontology Семантичний шар, щоб ШІ-агенти правильно розуміли корпоративні дані Що це: бібліотека NVIDIA (Apache 2.0), що будує «онтологію» бізнес-термінів із метаданих баз даних Як працює: агент знаходить потрібні терміни, пише SQL, перевіряє його на базі й виправляє помилки; є MCP-сервер Кому: аналітикам і BI-командам; підтримує 10 типів баз даних і працює з правами користувача +9,1 тис. зірок за тиждень · 10,1 тис. загалом Чому це важливо Головна проблема ШІ-аналітики — неправильно зрозумілі дані. Онтологія дає агенту «словник ко"}, {"n": 20, "id": "g04", "topic": "github", "title": "cactus-compute/cactus", "text": "github.com/cactus-compute/cactus №4 · 4 / 5 · новинка cactus-compute/cactus Маленькі ШІ-моделі, що працюють прямо на пристрої Що це: Python-пакет (Apache 2.0) для локального запуску текстових, голосових і візуальних моделей Як працює: моделі Needle (виклик функцій), Whistle (розпізнавання мовлення) і Mirage (опис зображень) — без хмари Кому: розробникам застосунків для телефонів і ноутбуків, де важливі приватність і робота офлайн +8,4 тис. зірок за тиждень · 14,6 тис. загалом Чому це важливо Не кожна задача потребує великої моделі в хмарі: дрібні локальні моделі дешевші й приватніші. Джерела: "}, {"n": 21, "id": "g05", "topic": "github", "title": "heydamir/unslop", "text": "github.com/heydamir/unslop №5 · 5 / 5 · новинка heydamir/unslop Навичка для Claude Code, що прибирає «ШІ-шний» вигляд інтерфейсів Що це: skill, який виправляє типові ознаки згенерованого дизайну: фіолетові градієнти, сяйво, емодзі Як працює: аудит екрана → стиль під конкретний продукт → проходи по відступах, кольорах, шрифтах і анімації Кому: усім, хто збирає інтерфейси з ШІ; працює з React, Vue, Tailwind і HTML; ліцензія CC-BY-4.0 +6,5 тис. зірок за тиждень · 11,9 тис. загалом Чому це важливо ШІ-дизайн упізнають з першого погляду. Тренд тижня — вчити агентів робити унікальний, а не шаблонний "}, {"n": 22, "id": "final", "topic": "intro", "title": "Що це означає для нас", "text": "Підсумки тижня · 3–10 листопада Що це означає для нас 01 Гроші та скепсис водночас OpenAI і Anthropic залучають і заробляють рекордні суми, але ринок уперше різко засумнівався в окупності. 02 Безпека й темп ШІ знаходить сотні вразливостей і прискорює власний розвиток. Контроль і оновлення стають критичними. 03 Рахуйте витрати Компанії переходять на відкриті моделі й власні сервери, а громади вимагають, щоб ШІ платив за свою енергію. Дякую! Ваші питання? Усі випуски — у бібліотеці дайджестів 22"}]}, {"id": "w43", "week": 43, "title": "Новини ШІ: 20–27 жовтня 2026", "dates": "20–27 жовтня 2026", "start": "2026-10-20", "file": "issues/w43.html", "slideCount": 22, "newsCount": 11, "repoCount": 5, "cover": "<section class=\"pv\" id=\"cover\" data-transition=\"fade\" style=\"background:linear-gradient(135deg, #F6F7FB 0%, #EAEFFC 100%);color:#121A33;font-family:'Manrope', Arial, sans-serif;padding:128px;display:flex;flex-direction:column\">\n\n<p data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:200px;width:880px;font-size:26px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#3D5AFE\">Дайджест · тиждень 43<\/p>\n<h1 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:260px;width:880px;font-family:'Manrope', Arial, sans-serif;font-size:104px;font-weight:800;line-height:1.05;letter-spacing:-2px;color:#121A33\">Новини штучного інтелекту<\/h1>\n<p data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:600px;width:880px;font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;color:#C2410C\">20–27 жовтня 2026<\/p>\n<p data-build-in=\"fade 4 auto\" style=\"position:absolute;left:128px;top:720px;width:820px;font-size:32px;line-height:1.4;color:#4A5368\">10 головних подій тижня та 5 репозиторіїв GitHub, які вибухнули зірками<\/p>\n<aside class=\"notes\">Вітаю! Це короткий огляд найважливішого у світі штучного інтелекту за тиждень 20–27 жовтня 2026 року (дані зібрано станом на 26 жовтня). Спочатку — 10 новин у чотирьох темах: моделі, бізнес, безпека й регулювання, практика. Потім — п’ять проєктів на GitHub, які за тиждень набрали найбільше зірок завдяки своїй технології.<\/aside>\n<\/section>\n", "slides": [{"n": 1, "id": "cover", "topic": "intro", "title": "Новини штучного інтелекту", "text": "Дайджест · тиждень 43 Новини штучного інтелекту 20–27 жовтня 2026 10 головних подій тижня та 5 репозиторіїв GitHub, які вибухнули зірками"}, {"n": 2, "id": "agenda", "topic": "intro", "title": "Про що поговоримо", "text": "План огляду Про що поговоримо 01–03 Моделі та продукти Claude Duet, Kimi K3.1 Pro, Mistral Voxtral 3 04–06 Бізнес і угоди OpenAI у Google Cloud, Nvidia в Берліні, Orchestra Bio 07–09 Безпека і регулювання Діри в PHP, обмеження реверс-інжинірингу, правила США 10–11 Практика і відкритий код Заблоковані чати ChatGPT, DeepSeek DeepInfer Top 5 GitHub: зірки тижня Репозиторії з найбільшим приростом зірок 2"}, {"n": 3, "id": "numbers", "topic": "intro", "title": "Тиждень у цифрах", "text": "Коротко Тиждень у цифрах 6 000+ застосунків підключає новий агент Claude Duet 2,8 трлн параметрів у китайській моделі Kimi K3.1 Pro 14 днів щоб розгорнути дата-центр Nvidia DSX Pod +55,9 тис. зірок у REA — інструменту, який почали обмежувати 3"}, {"n": 4, "id": "m01", "topic": "models", "title": "Anthropic запустила Claude Duet — ШІ-агента, який працює у фоні", "text": "Моделі та продукти 21 жовтня 01 / 11 Anthropic запустила Claude Duet — ШІ-агента, який працює у фоні Щоранку надсилає бриф про головне з пошти, календаря та робочих застосунків Сам виконує завдання — від зустрічей до прогнозів продажів і дашбордів; працює на Opus 5.5 Перед оплатою, підписанням чи видаленням обов’язково питає дозволу 6 000+ застосунків можна підключити Чому це важливо Гонка персональних агентів: конкуренти — OpenAI Dots, Meta Muse і Gemini Spark. Доступ поки за листом очікування. Джерела: thurrott.com, iphoneincanada.ca 4"}, {"n": 5, "id": "m02", "topic": "models", "title": "Kimi K3.1 Pro: найсильніша модель Китаю, відкриті ваги — до 4 листопада", "text": "Моделі та продукти 23 жовтня 02 / 11 Kimi K3.1 Pro: найсильніша модель Китаю, відкриті ваги — до 4 листопада Архітектура MoE: 2,8 трлн параметрів (104 млрд активних), контекст до 1 млн токенів 55 балів в індексі Artificial Analysis — лише на 3 бали менше, ніж у Claude Opus 5.5 API на третину дешевший за K3: $2 за 1 млн вхідних і $10 за 1 млн вихідних токенів 2,8 трлн параметрів у моделі від Moonshot AI Чому це важливо Відкриті моделі з Китаю майже наздогнали флагмани США — і коштують у рази дешевше. Ліцензію ще не оголошено. Джерела: yottalabs.ai, Artificial Analysis (через willk30.substack.co"}, {"n": 6, "id": "m03", "topic": "models", "title": "Mistral Voxtral 3: голосові моделі та SDK для агентів, що розмовляють", "text": "Моделі та продукти 22 жовтня 03 / 11 Mistral Voxtral 3: голосові моделі та SDK для агентів, що розмовляють Розпізнавання мовлення 50+ мовами, синтез голосу — 35+ мовами; українська є в переліку Голосовий агент відповідає швидше ніж за секунду і замовкає, коли його перебивають Підключається до телефонії та застосунків; хостинг в ЄС або на власних серверах $0,0035 за хвилину розпізнавання мовлення Чому це важливо Європейська альтернатива для кол-центрів і голосових помічників: дані можна тримати в ЄС, що важливо для GDPR. Джерело: mistral.ai/news/voxtral-3 6"}, {"n": 7, "id": "b04", "topic": "business", "title": "Моделі OpenAI з’явилися в Google Cloud — у хмарі головного конкурента", "text": "Бізнес і угоди 21 жовтня 04 / 11 3 з 3 найбільших хмар США тепер продають моделі OpenAI Моделі OpenAI з’явилися в Google Cloud — у хмарі головного конкурента GPT-6 Astra, GPT-6.1 Sol, GPT-6 Luna та агент Codex — у приватному прев’ю Google Model Garden Тепер OpenAI є в усіх трьох найбільших хмарах США: Microsoft Azure, AWS і Google Cloud Google обіцяє: запити й відповіді клієнтів лишаються в їхньому контурі й не йдуть на навчання Чому це важливо Ексклюзивність Microsoft закінчилася. Бізнес може обирати модель, не змінюючи хмару й договори. Джерело: thenextweb.com 7"}, {"n": 8, "id": "b05", "topic": "business", "title": "Nvidia на GTC Berlin: дата-центр «під ключ» за 14 днів для Європи", "text": "Бізнес і угоди 21 жовтня 05 / 11 14 днів замість ≈6 місяців на розгортання дата-центру Nvidia на GTC Berlin: дата-центр «під ключ» за 14 днів для Європи DSX Pod — модульний ЦОД на архітектурі Vera Rubin у контейнерах; продажі з початку 2027 року За словами Дженсена Хуанга, Європа має ≈5% світових обчислень для ШІ, а США — ≈75% Партнерства з Siemens, Mercedes-Benz, Audi, Porsche; Bolt планує 25 000 авто на платформі Nvidia Чому це важливо Головне обмеження ШІ — швидкість будівництва дата-центрів. Nvidia продає вже не чипи, а цілі «фабрики ШІ». Джерела: borncity.com, baxtel.com 8"}, {"n": 9, "id": "b06", "topic": "business", "title": "OpenAI купує Orchestra Bio — ШІ-агентів для розробки ліків", "text": "Бізнес і угоди 20 жовтня 06 / 11 32 хв на аналіз даних мільйонів клітин мозку агентами GPT-Rosalind OpenAI купує Orchestra Bio — ШІ-агентів для розробки ліків Агенти стежать за клінічними дослідженнями, термінами й бюджетом і попереджають про зриви Технологію вбудують у Rosalind — набір ШІ-інструментів OpenAI для біології та фармації Сума угоди не розкривається; до покупки стартап залучив близько $20 млн інвестицій Чому це важливо Фарма — один із головних напрямів ШІ-угод. За повідомленнями, Anthropic раніше купила Coefficient Bio за ~$400 млн. Джерела: techstrong.ai, willk30.substack.com 9"}, {"n": 10, "id": "s07", "topic": "security", "title": "«Чорний жовтень»: ШІ знайшов критичні діри в PHP — мові ≈70% сайтів", "text": "Безпека і регулювання 21 жовтня 07 / 11 «Чорний жовтень»: ШІ знайшов критичні діри в PHP — мові ≈70% сайтів Calif з моделлю GPT-5.6 Sol і компанія Wiz знайшли дві вразливості для віддаленого запуску коду Патч вийшов того ж дня, але спроби атак зросли до мільйонів; ФБР і АНБ радили відключати сервери Того ж тижня: шкідлива версія LiteLLM, зломи Railway та OpenCode — хвиля крадіжок API-ключів ≈70% сайтів у світі працюють на PHP Чому це важливо: ШІ знаходить вразливості швидше за людей — і для захисту, і для атак. Вчасно оновлюйте ПЗ і змінюйте ключі доступу. Джерела: ppc.land, willk30.substack.c"}, {"n": 11, "id": "s08", "topic": "security", "title": "Claude і ChatGPT почали обмежувати реверс-інжиніринг через REA", "text": "Безпека і регулювання 23–25 жовтня 08 / 11 Claude і ChatGPT почали обмежувати реверс-інжиніринг через REA Користувачі повідомляють: Claude відмовляється працювати з REA — найпопулярнішим інструментом тижня на GitHub Дослідник log4j розібрав телевізор Samsung, знайшов код збору даних — і отримав бан в OpenAI за «кіберзловживання» Офіційних заяв немає. Нова політика Anthropic з 12 листопада прямо дозволяє дослідження безпеки власних систем 1 млн+ переглядів постів про «смерть REA» Чому це важливо: межа між захистом і атакою розмита. Компанії страхуються ширшими блокуваннями, а дослідники переход"}, {"n": 12, "id": "s09", "topic": "security", "title": "США: нові правила для ШІ в держзакупівлях набули чинності", "text": "Безпека і регулювання 19 жовтня 09 / 11 США: нові правила для ШІ в держзакупівлях набули чинності Пункт GSAR 552.239-7001 діє для чат-ботів, LLM та агентних систем, які купує уряд США Модель має бути налаштована на точність і об’єктивність; держава може тестувати її на упередженість Інциденти з держданими — обов’язково повідомляти; вимоги поширюються й на субпідрядників 19.10 2026 — дата набуття чинності Чому це важливо: держзакупівлі ШІ отримують власні правила. Схожий підхід і в AI Act ЄС: прозорість, захист даних, відповідальність постачальника. Джерело: winvale.com (огляд правила GSA) 12"}, {"n": 13, "id": "p10", "topic": "practice", "title": "ChatGPT дозволив ховати приватні чати за PIN-кодом або біометрією", "text": "Практика і відкритий код 20–21 жовтня 10 / 11 ChatGPT дозволив ховати приватні чати за PIN-кодом або біометрією 4 цифри PIN-код для доступу до прихованих чатів Це захист від чужих очей, а не шифрування: правила зберігання даних не змінюються. Для таємниць — тимчасовий чат. 1 Заблоковані чати зникають з історії та пошуку й відкриваються лише PIN-кодом або Face ID 2 Доступно на всіх тарифах — від Free до Enterprise; функція вмикається поступово 3 Забули PIN — заблоковані чати видаляються назавжди, підтримка OpenAI їх не відновить Джерело: businesstoday.in 13"}, {"n": 14, "id": "p11", "topic": "practice", "title": "DeepSeek відкрила DeepInfer — свій рушій для чипів Nvidia і Huawei", "text": "Практика і відкритий код 20 жовтня 11 / 11 DeepSeek відкрила DeepInfer — свій рушій для чипів Nvidia і Huawei +8,8 тис. зірок на GitHub за тиждень 19–25 жовтня Китай зменшує залежність від Nvidia: моделі DeepSeek можна запускати на власних серверах, зокрема на чипах Huawei Ascend. 1 Той самий фреймворк, на якому працюють сервіси DeepSeek, тепер у відкритому доступі 2 Розподілений запуск, спекулятивне декодування, структурований вивід; поки — DeepSeek-V4.1-Flash 3 Репозиторій увійшов у топ-10 GitHub тижня: 21,9 тис. зірок загалом Джерела: technode.com, gittrend.io 14"}, {"n": 15, "id": "repos-intro", "topic": "github", "title": "GitHub: репозиторії, що вибухнули зірками", "text": "Розділ 2 · Відкритий код GitHub: репозиторії, що вибухнули зірками Тиждень 19–25 жовтня 2026 · рейтинг gittrend.io за приростом зірок 15"}, {"n": 16, "id": "g-chart", "topic": "github", "title": "Найгарячіші ШІ-репозиторії тижня", "text": "$ git trending --since=weekly --topic=ai Найгарячіші ШІ-репозиторії тижня cloudflare/security-audit-skill +13,5 тис. ai-job-search +11,5 тис. DietrichGebert/ponytail +8,5 тис. xerj-org/xerj +6,8 тис. · новинка tangency-labs/solidcraft +4,3 тис. · новинка Приріст зірок за 19–25.10.2026 · gittrend.io · REA (+55,9 тис.) — у новині 08, DeepInfer (+8,8 тис.) — у новині 11 16"}, {"n": 17, "id": "g01", "topic": "github", "title": "cloudflare/security-audit-skill", "text": "github.com/cloudflare/security-audit-skill №1 · 1 / 5 cloudflare/security-audit-skill Навичка для ШІ-агентів: аудит безпеки коду від Cloudflare Що це: відкрита (MIT) версія підходу, яким Cloudflare постійно перевіряє 128 власних репозиторіїв Як працює: 6 етапів — розвідка, агенти-«мисливці» шукають баги, свіжий агент намагається їх спростувати, повторна перевірка, звіт Кому: командам розробки; у Cloudflare репозиторій на 30 тис. рядків дає ~80 багів за 3 години +13,5 тис. зірок за тиждень · 44,7 тис. загалом Чому це важливо Агенти перевіряють один одного — це відсіює хибні тривоги. Але знахідк"}, {"n": 18, "id": "g03", "topic": "github", "title": "ai-job-search", "text": "github.com/ai-job-search-dev/ai-job-search №2 · 2 / 5 ai-job-search Локальний помічник для пошуку роботи на базі Claude Code Що це: відкритий фреймворк, що перетворює агента-кодера на персонального кар’єрного асистента Як працює: оцінює вакансії за вашими критеріями, адаптує резюме, пише супровідні листи, готує до співбесід Кому: шукачам роботи та HR-фахівцям; усі дані лишаються на вашому комп’ютері +11,5 тис. зірок за тиждень · 64,9 тис. загалом Чому це важливо Агенти-кодери стають універсальними асистентами: той самий Claude Code веде пошук роботи, а не лише пише програми. Джерела: aitoolly."}, {"n": 19, "id": "g04", "topic": "github", "title": "DietrichGebert/ponytail", "text": "github.com/DietrichGebert/ponytail №3 · 3 / 5 DietrichGebert/ponytail «Лінивий сеньйор»: правила, що вчать агентів писати менше коду Що це: набір правил для агентів-кодерів — найменше правильне рішення без шкоди для безпеки й перевірок Як працює: 7 сходинок — чи потрібна функція, чи вона вже є в коді, бібліотеці, платформі — і лише потім новий код Кому: розробникам на Claude Code, Codex та інших; у тесті автора — на 54% менше коду й на 20% дешевше +8,5 тис. зірок за тиждень · 175,6 тис. загалом Чому це важливо Більше коду — більше багів і витрат. Тренд тижня: вчити агентів робити менше, але кр"}, {"n": 20, "id": "g06", "topic": "github", "title": "xerj-org/xerj", "text": "github.com/xerj-org/xerj №4 · 4 / 5 · новинка xerj-org/xerj Локальний пошуковик і «пам’ять» для ШІ-агентів в одному файлі Що це: пошуковий рушій на Rust і MCP-сервер, що індексує код, документи, логи, таблиці та PDF Як працює: поєднує класичний повнотекстовий пошук (BM25) і векторний за змістом — гібридний пошук без хмари Кому: командам, які дають агентам доступ до власних документів (RAG); API сумісний з Elasticsearch +6,8 тис. зірок за тиждень · 15,3 тис. загалом Чому це важливо Агентам потрібна пам’ять про ваші дані. xerj дає її локально — без передачі документів у хмару. Джерела: skillsllm"}, {"n": 21, "id": "g07", "topic": "github", "title": "tangency-labs/solidcraft", "text": "github.com/tangency-labs/solidcraft №5 · 5 / 5 · новинка tangency-labs/solidcraft 3D-CAD, яким може керувати ШІ-агент Що це: відкрита параметрична CAD-система на Rust: ескізи, тверді тіла, обмеження, історія побудови Як працює: кожна дія — це команда з JSON-параметрами, тому через MCP-сервер агент «креслить» деталь сам Кому: інженерам і мейкерам; працює на десктопі, у браузері та з командного рядка; проєкт ще ранній +4,3 тис. зірок за тиждень · 10,1 тис. загалом Чому це важливо ШІ виходить за межі тексту й коду: агенти починають проєктувати фізичні деталі «словами». Джерела: hackaday.com, gitt"}, {"n": 22, "id": "final", "topic": "intro", "title": "Що це означає для нас", "text": "Підсумки тижня · 20–27 жовтня Що це означає для нас 01 Агенти стають «колегами» Claude Duet і конкуренти працюють у фоні: самі збирають інформацію й виконують доручення, питаючи дозволу на важливе. 02 Безпека — пріоритет №1 ШІ знаходить вразливості швидше за людей, а компанії посилюють обмеження. Оновлення й захист ключів — обов’язкові. 03 Більше вибору, нижчі ціни OpenAI — у всіх великих хмарах, Kimi та DeepSeek відкривають моделі, а GitHub щотижня дає нові інструменти. Дякую! Ваші питання? Наступний дайджест — через тиждень 22"}]}]}, "frags": {"issues/w47.html": "<section class=\"slide\" id=\"cover\" data-transition=\"fade\" style=\"background:linear-gradient(135deg, #F6F7FB 0%, #E2F3EE 100%);color:#121A33;font-family:'Manrope', Arial, sans-serif;padding:128px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:1040px;top:128px;width:752px;height:824px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;);let W,H,R=window.devicePixelRatio||1;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst N=44,P=[];for(let i=0;i&lt;N;i++)P.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0009,vy:(Math.random()-.5)*.0009,o:Math.random()&lt;.18,ph:Math.random()*6});\nfunction f(t){x.clearRect(0,0,W,H);const s=Math.min(W,H), 00px;font-size:24px;color:#5F6660\">Джерело: nvidianews.nvidia.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#5F6660\">9<\/p>\n<aside class=\"notes\">Nvidia звітувала за III квартал 2027 фінансового року (завершився 25 жовтня): виручка $115,8 млрд — +20% за квартал і +103% за рік, прогноз був $108 млрд. Дата-центри — $107,6 млрд (+110%), чистий прибуток за GAAP — $65,3 млрд, валова маржа 74,8%. Почалися поставки стійок Vera Rubin NVL72. Прогноз на IV квартал — $130 млрд ±3% без урахування дата-центрів у Китаї. Джерело: https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-third-quarter-fiscal-2027<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"b06\" data-transition=\"fade\" style=\"background:#F7F4EC;color:#14211E;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<div data-build-in=\"left 1 auto\" style=\"position:absolute;left:0px;top:0px;width:720px;height:1080px;background:linear-gradient(160deg, #0B6B5C 0%, #064E43 100%)\"><\/div>\n<div data-build-in=\"fade 2 auto\" style=\"position:absolute;left:128px;top:128px;width:520px;display:flex;align-items:center;gap:16px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1B1A16;background:#F2C14E;padding:8px 20px;border-radius:999px\">Бізнес і гроші<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#CFEDE6\">23 листопада<\/p>\n<\/div>\n<p data-build-in=\"fade 2 auto\" style=\"position:absolute;left:128px;top:204px;width:400px;font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#9FD8CB\">06 / 12<\/p>\n\n<svg data-build-in=\"pop 3 auto\" class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:absolute;left:128px;top:340px;width:112px;height:112px;color:#F2C14E\"><path d=\"M16 21v-2a4 4 0 0 0px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">10+ днів<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">збою внутрішніх сервісів<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> ШІ скорочує час від проникнення до захоплення системи. Захищатися треба навіть тим, хто сам ШІ не використовує.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#A8A39B\">Джерела: theregister.com, infosecurity-magazine.com, techrepublic.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">11<\/p>\n<aside class=\"notes\">19 листопада Європейська комісія підтвердила, що внутрішні сервіси (нарахування зарплат, відпустки, компенсація медичних витрат) були порушені понад 10 днів. Атаку виявили 22 жовтня; CERT-EU пов’язує її з ARTEX — публічно доступним ШІ-фреймворком для тестування на проникнення. Речник Тома Реньє підтвердив використання ШІ-інструментів. Даних про масштабний витік щодо ~33 000 співробітників поки немає. 13 листопада ФБР попереджало про понад 1 600 відкритих консолей ARTEX. Попередження ФБР про ARTEX було у випуску колеги за 10–16 листопада; тут — нова подія. Джерела: https://www.theregister.com/cyber-crime/2026/11/19/european-commission-scrambles-to-contain-ai-assisted-cyberattack/5311103 ; https://www.infosecurity-magazine.com/news/commission-ai-attack-systems/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s08\" data-transition=\"push\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html& r:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9\"/><path d=\"M13 17V5\"/><path d=\"M8 17v-3\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">За квартал до Китаю відвантажили чипи Hopper на $2,4 млрд; подальших поставок не буде, заявила Колетт Кресс<\/p>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:693px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M2 12h20\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">За даними Reuters, близько 600 тис. H200 лежать на складах у Гонконгу: Пекін не погоджує імпорт<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1258px;top:380px;width:534px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Moonshot AI, за повідомленнями, скасувала угоду на $150 млн щодо доступу до чипів Nvidia в Індонезії<\/p>\n<\/div>\n<div data-build-in=\"left 6 auto\" style=\"position:absolute;left:128px;top:736px;width:1664px;display:flex;align-items:center;gap:40px;background:#2A1C14;border-left:8px solid #FB923C;border-radius:16px;padding:28px 40px\">\n<div style=\"width:340px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">$2,4 млрд<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">останні поставки чипів у Китай за квартал<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> технологічний розрив між США і Китаєм поглиблюється, а китайські лабораторії переходять на власні чипи.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#A8A39B\">Джерела: finance.yahoo.com, gulfbusiness.com, Reuters (5.11.2026)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">12<\/p>\n<aside class=\"notes\">Під час звіту Nvidia тодішня тимчасова CEO Колетт Кресс повідомила: за квартал до Китаю відвантажили чипи Hopper на $2,4 млрд, подальших поставок немає. За ексклюзивом Reuters від 5 листопада, близько 600 000 H200 лежать на складах у Гонконгу, бо Пекін не погоджує імпорт. Moonshot AI, за повідомленнями, скасувала угоду на $150 млн щодо віддаленого доступу до чипів Nvidia в Індонезії через нові правила США. Джерела: https://finance.yahoo.com/news/nvidia-stops-shipping-us-approved-091655496.html ; https://gulfbusiness.com/en/2026/news/nvidia-stops-shipping-us-approved-ai-chips-to-china/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s09\" data-transition=\"fade\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title style=\"position:absolute;left:128px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Губернатори США: національні ризики — Вашингтону, захист працівників, споживачів і дітей — штатам; плюс незалежні аудити<\/p>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:693px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M2 12h20\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Генсек ООН закликав до «спільного фундаменту безпеки ШІ» і глобального фонду для розвитку ШІ-спроможностей<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1258px;top:380px;width:534px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"M4 19.5A2.5 к уже у 2027 році. Нагадування: з 2 грудня 2026 року за EU AI Act діють заборона «нудифікаторів» і обов’язкове машинозчитуване маркування контенту для генеративних систем, виведених на ринок до серпня 2026; правила для систем високого ризику перенесено на 2027–2028 роки. Джерела: https://www.pymnts.com/news/artificial-intelligence/2026/governors-want-states-to-have-a-voice-in-regulating-ai/ ; https://news.un.org/en/story/2026/11/1168861 ; https://insurancejournal.com/news/national/2026/11/23/893408.htm ; https://www.technology.org/2026/10/13/eu-ai-act-deadlines-after-the-digital-omnibus-what-applies-from-december-2026-to-august-2028/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"p10\" data-transition=\"push\" style=\"background:#F5F2FC;color:#1E1438;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:1080px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst B=[[.12,.18,&#x27;124,58,237&#x27;],[.88,.22,&#x27;236,72,153&#x27;],[.72,.88,&#x27;124,58,237&#x27;],[.18,.9,&#x27;59,130,246&#x27;],[.5,.5,&#x27;167,139,250&#x27;]].map((b,i)=&gt;({x:b[0],y:b[1],c:b[2],p:i*1.3}));\nfunction f(t){x.clearRect(0,0,W,H);for(const b of B){const X=(b.x+.07*Math.sin(t/3500+b.p))*W,Y=(b.y+.07*Math.cos(t/4500+b.p))*H,rr=Math.min(W,H)*.42,g=x.createRadialGradient(X,Y,0,X,Y,rr);g.addColorStop(0,&#x27;rgba(&#x27;+b.c+&#x27;,.17)&#x27;);g.addColorSto round:#FCFBFF;border:1px solid #E2DAF5;border-radius:20px;padding:28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#6D28D9;border-radius:50%\"><p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:26px;font-weight:700;color:#FBF9FF\">1<\/p><\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#2E2645\">Copilot Autopilot — автономний агент із власною поштою й обліковим записом у компанії<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:693px;top:630px;width:533px;display:flex;gap:20px;align-items:start;background:#FCFBFF;border:1px solid #E2DAF5;border-radius:20px;padding:28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#6D28D9;border-radius:50%\"><p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:26px;font-weight:700;color:#FBF9FF\">2<\/p><\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#2E2645\">Новий модуль рахує витрати на ШІ та зіставляє їх із результатом роботи агентів<\/p>\n<\/div>\n<div data-build-in=\"rise 6 auto\" style=\"position:absolute;left:1258px;top:630px;width:534px;display:flex;gap:20px;align-items:start;background:#FCFBFF;border:1px solid #E2DAF5;border-radius:20px;padding:28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#6D28D9;border-radius:50%\"><p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:26px;font-weight:700;color:#FBF9FF\">3<\/p><\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#2E2645\">Defender захищає локальних агентів (Claude Code, Copilot CLI), а Intune знаходить «тіньових»<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#635B7A\">Джерела: blogs.microsoft.com, petri.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#635B7A\">14<\/p>\n<aside class=\"notes\">На конференції Ignite 17–19 листопада Сатья Наделла повідомив, що в Agent 365 уже понад 50 млн агентів. Додано модуль Business Analytics для обліку витрат на ШІ та зіставлення з результатом. Представлено автономного агента Copilot Autopilot з власною поштою та обліковим записом Entra, сімейство моделей Code 2 для програмування; платформа агентів безпеки Microsoft Perception стала загальнодоступною. Defender тепер захищає локальних ШІ-агентів, а Intune знаходить «тіньових» агентів на корпоративних пристроях. Джерела: https://blogs.microsoft.com/blog/2026/11/17/ignite-2026-building-the-frontier-ecosystem/ ; https://petri.com/top-10-microsoft-ignite-2026-announcements/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"p11\" data-transition=\"push\" style=\"background:#F5F2FC;color:#1E1438;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:1080px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst B=[[.12,.18,&#x27;124,58,237&#x27;],[.88,.22,&#x27;236,72,153&#x27;],[.72,.88,&#x27;124,58,237&#x27;],[.18,.9,&#x27;59,130,246&#x27;],[.5,.5,&#x27;167,139,250&#x27;]].map((b,i)=&gt;({x:b[0],y:b[1],c:b[2],p:i*1.3}));\nfunction f(t){x.clearRect(0,0,W,H);for(const b of B){const X=(b.x+.07*Math.sin(t/3500+b.p))*W,Y=(b.y+.07*Math.cos(t/4500+b.p))*H,rr=Math.min(W,H)*.42,g=x.createRadialGradient(X,Y,0,X,Y,rr);g.add easebot.io, TechCrunch (19.11)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#635B7A\">15<\/p>\n<aside class=\"notes\">Що з’явилося для щоденної роботи: ChatGPT — живе диктування без ліміту в 10 хвилин (18 листопада) і функція Space для спільних інтерактивних сторінок і презентацій для Plus (20 листопада). Gemini навчився керувати застосунками на Mac (19 листопада, лише США, англійська, платні передплатники), а також генерувати GIF; до «чорної п’ятниці» — знижка 50% на AI Pro/Plus. Canva додала перемикач, що вимикає генеративні ШІ-функції. Ризики: за даними TechCrunch, співробітники, які тестували агента Meta Muse, бачили чужі особисті дані; Citi попередила клієнтів, що ризики ШІ-агентів у банкінгу несуть вони самі. Джерела: https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-friday-november-20-2026/ ; https://releasebot.io/updates/openai<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"p12\" data-transition=\"fade\" style=\"background:#F5F2FC;color:#1E1438;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:1080px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst B=[[.12,.18,&#x27;124,58,237&#x27;],[.88,.22,&#x27;236,72,153&#x27;],[.72,.88,&#x27;124,58,237&#x27;],[.18,.9,&#x27;59,130,246&#x27;],[.5,.5,&#x27;167,139,250&#x27;]].map((b,i)=&gt;({x:b[0 yle.opacity===&#x27;0&#x27;?&#x27;1&#x27;:&#x27;0&#x27;},500);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#9DA7B3\">Джерела: github.com/shirudo-dev/shirudo, trendshift.io<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:120px;font-size:24px;text-align:right;color:#9DA7B3\">23<\/p>\n<aside class=\"notes\">Shirudo (BSD-2-Clause, створено 13 жовтня) завантажує в ядро Linux підписані «щити» (постквантовий підпис ML-DSA-87) на базі eBPF, які блокують шлях експлойта. Системний виклик bpf() закритий для всіх, крім підписаних завантажувачів; усі завантаження пишуться в журнал аудиту з опорою на TPM. Чернетки «щитів» можуть готувати ШІ-агенти. За README — пре-реліз, «щити» не замінюють патчі. Повідомлення про запуск проєкту OpenAI і Cisco 23 листопада — зі сторонніх джерел. Джерело: https://github.com/shirudo-dev/shirudo<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"g06\" data-transition=\"fade\" style=\"background:#0D1117;color:#E6EDF3;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;height:792px;background:#161B22;border:1px solid #30363D;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,0.45)\"><\/div>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;height:72px;display:flex;align-items:center;gap:14px;background:#1C2129;border-bottom:1px solid #30363D;border-radius:20px 20px 0px 0px;padding:0px 28px\">\n<div style=\"width:18px;height:18px;background:#FF5F57;border-radius:50%\"><\/div>\n<div style=\"width:18px;height:18px;background:#FEBC2E;border-radius:50%\"><\/div>\n<div style=\"width:18px;height:18px;background:#28C840;border-radius:50%\"><\/div>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#9DA7B3;paddin
