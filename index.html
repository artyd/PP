  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

FFFFFF;}\n  deck-stage{background:#FFFFFF !important}\n  a{color:#B4551E;text-decoration:none}\n  a:hover{color:#8C3F12;text-decoration:underline}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}}\n  @keyframes fadeIn{from{opacity:0}}\n  @keyframes pop{from{opacity:0;transform:scale(.55)}}\n  @keyframes growX{from{transform:scaleX(0)}}\n  @keyframes typeIn{from{max-width:0}to{max-width:var(--tw,60ch)}}\n  @keyframes blinkC{0%,49%{opacity:1}50%,100%{opacity:0}}\n  @keyframes spinSlow{to{transform:rotate(360deg)}}\n  @keyframes trimBar{0%{width:2%}50%{width:89.5%}66%{width:89.5%}80%{width:34.2%}100%{width:34.2%}}\n  @media print{*{animation:none !important}[data-rail-toggle]{display:none !important}}\n<\u002Fstyle>\n<script src=\"4af7e0a4-bd35-4611-8635-ed5f4ec14a47\"><\u002Fscript>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" style=\"background:#FFFFFF\">\n\n  <section data-label=\"Титул\" data-speaker-notes=\"Привітання. Сьогодні — що таке харнес для ШІ, на пальцях. Усі приклади далі — зі справжнього прогону міні-агента, який ми зібрали для цієї доповіді.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"spinSlow 60s linear infinite\" style=\"position:absolute;right:-260px;top:-260px;width:880px;height:880px;border:3px dashed rgba(180,85,30,.45);border-radius:50%\"><\u002Fdiv>\n    <div data-anim=\"spinSlow 90s linear infinite\" style=\"position:absolute;right:-140px;top:-140px;width:640px;height:640px;border:2px dashed rgba(42,36,26,.12);border-radius:50%\"><\u002Fdiv>\n    <div data-anim=\"fadeUp .6s ease both\" style=\"display:flex;align-items:center;gap:16px;margin:0 0 40px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.14em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:8px 20px\">MINIHARNESS<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.14em;color:#6F6455\">РЕАЛЬНИЙ ПРОГІН АГЕНТА<\u002Fspan>\n    <\u002Fdiv>\n    <h1 data-anim=\"fadeUp .7s ease .15s both\" style=\"margin:0 0 28px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:var(--type-hero);line-height:1.05;letter-spacing:.01em;color:#2A241A\">ХАРНЕС<\u002Fh1>\n    <p data-anim=\"fadeUp .7s ease .3s both\" style=\"margin:0 0 64px;font-size:var(--type-subtitle);line-height:1.35;color:#5C5344;max-width:1100px\">Упряж для штучного інтелекту — пояснення на пальцях, на живому прикладі<\u002Fp>\n    <div data-anim=\"fadeUp .7s ease .45s both\" style=\"display:flex;gap:18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#B4551E;background:rgba(180,85,30,.14);border-radius:10px;padding:12px 22px\">тяглова сила<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#2A241A;background:rgba(42,36,26,.08);border-radius:10px;padding:12px 22px\">упряж<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#2E7D4F;background:rgba(46,125,79,.1);border-radius:10px;padding:12px 22px\">поле<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Метафора\" data-speaker-notes=\"Кінь — могутній, але сам не оре. Упряж спрямовує силу на роботу. LLM — так само: сила є, харнес перетворює її на виконану задачу.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">02<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ВСТУП · МЕТАФОРА<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Сила, упряж і поле<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;width:100%;margin:0 0 52px\">\n      <div data-anim=\"fadeUp .6s ease .25s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:20px;padding:44px 40px;box-shadow:0 12px 34px rgba(42,36,26,.06)\">\n        <div style=\"height:110px;display:flex;align-items:flex-end;margin:0 0 30px\"><span style=\"font-size:116px;line-height:1;color:#B4551E\">♞<\u002Fspan><\u002Fdiv>\n        <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:30px;color:#2A241A\">Кінь<\u002Fh3>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">LLM — тяглова сила: могутня, але сама не знає, куди тягти.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease .4s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:20px;padding:44px 40px;box-shadow:0 12px 34px rgba(42,36,26,.06)\">\n        <svg width=\"150\" height=\"110\" viewBox=\"0 0 150 110\" fill=\"none\" style=\"margin:0 0 30px;display:block\">\n          <ellipse cx=\"75\" cy=\"50\" rx=\"32\" ry=\"42\" stroke=\"#2A241A\" stroke-width=\"11\"><\u002Fellipse>\n          <line x1=\"52\" y1=\"82\" x2=\"16\" y2=\"107\" stroke=\"#2A241A\" stroke-width=\"7\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"98\" y1=\"82\" x2=\"134\" y2=\"107\" stroke=\"#2A241A\" stroke-width=\"7\" stroke-linecap=\"round\"><\u002Fline>\n          <circle cx=\"75\" cy=\"8\" r=\"7\" fill=\"#B4551E\"><\u002Fcircle>\n        <\u002Fsvg>\n        <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:30px;color:#2A241A\">Упряж<\u002Fh3>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">Харнес — ремені й віжки: інструменти, правила, напрям роботи.<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease .55s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:20px;padding:44px 40px;box-shadow:0 12px 34px rgba(42,36,26,.06)\">\n        <svg width=\"150\" height=\"110\" viewBox=\"0 0 150 110\" fill=\"none\" style=\"margin:0 0 30px;display:block\">\n          <circle cx=\"128\" cy=\"16\" r=\"11\" fill=\"#D9A45B\"><\u002Fcircle>\n          <line x1=\"6\" y1=\"36\" x2=\"144\" y2=\"36\" stroke=\"#2E7D4F\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"6\" y1=\"108\" x2=\"55\" y2=\"38\" stroke=\"#2E7D4F\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"41\" y1=\"108\" x2=\"65\" y2=\"38\" stroke=\"#2E7D4F\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"76\" y1=\"108\" x2=\"75\" y2=\"38\" stroke=\"#2E7D4F\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"111\" y1=\"108\" x2=\"85\" y2=\"38\" stroke=\"#2E7D4F\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n          <line x1=\"146\" y1=\"108\" x2=\"95\" y2=\"38\" stroke=\"#2E7D4F\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fline>\n        <\u002Fsvg>\n        <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:30px;color:#2A241A\">Поле<\u002Fh3>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">Задача — поле: його треба обробити від краю до краю.<\u002Fp>\n :0;font-size:24px;line-height:1.45;color:#5C5344\">ланцюжки, графи, команди агентів<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"pop .5s ease 1.7s both\" style=\"position:absolute;left:81%;top:0;width:310px\">\n        <p style=\"margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#2E7D4F\">сьогодні<\u002Fp>\n        <h3 style=\"margin:0 0 10px;font-size:30px;font-weight:700;color:#2E7D4F\">Універсальний харнес<\u002Fh3>\n        <p style=\"margin:0;font-size:24px;line-height:1.45;color:#5C5344\">одна упряж на будь-яке поле<\u002Fp>\n        <div style=\"position:absolute;left:0;top:242px;width:26px;height:26px;border-radius:50%;background:#2E7D4F;box-shadow:0 0 0 8px rgba(46,125,79,.18)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Будова\" data-speaker-notes=\"Чотири частини: цикл рішення, чотири інструменти, інструкція AGENTS.md, керування контекстом. Далі кожну побачимо в дії.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">04<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">БУДОВА<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Будова харнеса<\u002Fh2>\n    <div style=\"display:flex;gap:80px;width:100%;align-items:center\">\n ">рішення<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--gap-item);flex:1\">\n        <div data-anim=\"fadeUp .6s ease .5s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:30px 36px\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">ReAct-цикл<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">Подумав → обрав інструмент → подивився, що вийшло → вирішив: повторити чи відповісти.<\u002Fp>\n        <\u002Fdiv>\n        <div data-anim=\"fadeUp .6s ease .7s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:30px 36px\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">4 інструменти<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">Руки агента: читати, шукати, редагувати, запускати.<\u002Fp>\n        <\u002Fdiv>\n        <div data-anim=\"fadeUp .6s ease .9s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:30px 36px\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">AGENTS.md<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">Пам'ятка в кишені: що робити і за якими правилами.<\u002Fp>\n        <\u002Fdiv>\n        <div data-anim=\"fadeUp .6s ease 1.1s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:30px 36px\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">Керування контекстом<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#5C5344\">Пам'ять не безмежна: старе стискається в короткий підсумок.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Інструменти\" data-speaker-notes=\"Рівно чотири — як у справжніх харнесах на кшталт Claude Code чи Codex CLI. Виклики на картках — справжні, з логу прогону.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">05<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">БУДОВА · ІНСТРУМЕНТИ<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 18px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Чотири інструменти<\u002Fh2>\n    <p data-anim=\"fadeUp .6s ease .2s both\" style=\"margin:0 0 var(--gap-title);font-size:var(--type-small);color:#6F6455\">Як у справжніх харнесах. Виклики нижче — дослівно з логу прогону.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px;width:100%\">\n      <div data-anim=\"fadeUp .6s ease .3s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:34px 38px\">\n        <div style=\"display:flex;align-items:baseline;gap:18px;margin:0 0 10px\">\n          <h3 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:var(--type-body);font-weight:600;color:#B4551E\">read_file<\u002Fh3>\n          <span style=\"font-size:var(--type-small);color:#6F6455\">— очі<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:var(--type-small);line-height:1.45;color:#5C5344\">Прочитати файл цілком, з номерами рядків.<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#2A241A;background:#F0EADB;border-radius:10px;padding:12px 18px\">read_file {\"path\":\"AGENTS.md\"}<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease .45s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:34px 38px\">\n        <div style=\"display:flex;align-items:baseline;gap:18px;margin:0 0 10px\">\n          <h3 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:var(--type-body);font-weight:600;color:#B4551E\">search_files<\u002Fh3>\n          <span style=\"font-size:var(--type-small);color:#6F6455\">— ліхтарик<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:var(--type-small);line-height:1.45;color:#5C5344\">Знайти рядки з потрібним словом у всіх файлах.<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#2A241A;background:#F0EADB;border-radius:10px;padding:12px 18px\">search_files {\"query\":\"markDone\"}<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease .6s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:34px 38px\">\n        <div style=\"display:flex;align-items:baseline;gap:18px;margin:0 0 10px\">\n          <h3 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:var(--type-body);font-weight:600;color:#B4551E\">edit_file<\u002Fh3>\n          <span style=\"font-size:var(--type-small);color:#6F6455\">— руки<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:var(--type-small);line-height:1.45;color:#5C5344\">Створити файл або замінити фрагмент на новий.<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#2A241A;background:#F0EADB;border-radius:10px;padding:12px 18px\">edit_file {\"path\":\"tasker.js\", \"old_string\":\"…\", …}<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease .75s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:18px;padding:34px 38px\">\n        <div style=\"display:flex;align-items:baseline;gap:18px;margin:0 0 10px\">\n          <h3 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:var(--type-body);font-weight:600;color:#B4551E\">run_bash<\u002Fh3>\n          <span style=\"font-size:var(--type-small);color:#6F6455\">— майстерня<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:var(--type-small);line-height:1.45;color:#5C5344\">Виконати команду і побачити справжній вивід.<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#2A241A;background:#F0EADB;border-radius:10px;padding:12px 18px\">run_bash {\"command\":\"node tasker.test.js\"}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"AGENTS.md\" data-speaker-notes=\"Це справжній файл із робочої теки. Агент читає його найпершим кроком — побачимо це в лозі на наступних слайдах.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">06<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">БУДОВА · ІНСТРУКЦІЯ<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Інструкція AGENTS.md<\u002Fh2>\n    <div style=\"display:flex;gap:70px;width:100%;align-items:flex-start\">\n      <div data-anim=\"fadeUp .7s ease .3s both\" style=\"flex:none;width:880px;background:#FFFDF7;border:1px solid rgba(42,36,26,.15);border-radius:16px;padding:38px 44px;box-shadow:0 16px 40px rgba(42,36,26,.08)\">\n        <p style=\"margin:0 0 20px;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.1em;color:#6F6455\">workspace/AGENTS.md · справжній файл, 19 рядків<\u002Fp>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:21px;line-height:1.6;color:#2A241A;white-space:pre-wrap\"># AGENTS.md — інструкція для агента\n\nТи — агент MiniHarness. Працюєш у цій теці.\n\n## Задача\nСтвори консольний трекер завдань:\n- файл tasker.js\n- команди: add \"&lt;текст&gt;\", list, done &lt;номер&gt;\n- завдання зберігаються у tasks.json\n\n## Вимоги до якості\n- тести у tasker.test.js, запуск: node tasker.test.js\n- усі тести мають проходити\n- якщо тести падають — знайди причину і виправ\n\n## Правила роботи\n1. Спочатку прочитай цю інструкцію.\n2. Працюй маленькими кроками: одна зміна — один запуск тестів.\n3. Наприкінці дай коротку відповідь-підсумок.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--gap-item);flex:1;padding-top:30px\">\n        <div data-anim=\"fadeUp .6s ease .5s both\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">Що це<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.55;color:#5C5344\">Записка, яку господар лишає працівникові: задача, вимоги, правила.<\u002Fp>\n        <\u002Fdiv>\n        <div data-anim=\"fadeUp .6s ease .65s both\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">Хто читає<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.55;color:#5C5344\">Сам агент — найпершим кроком, до будь-якої роботи.<\u002Fp>\n        <\u002Fdiv>\n        <div data-anim=\"fadeUp .6s ease .8s both\">\n          <h3 style=\"margin:0 0 8px;font-size:var(--type-body);font-weight:700;color:#2A241A\">Чому важливо<\u002Fh3>\n          <p style=\"margin:0;font-size:var(--type-small);line-height:1.55;color:#5C5344\">Без записки сила тягне куди завгодно. Записка — це віжки.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Задача\" data-speaker-notes=\"Чесне застереження: рішення агента в демо заскриптовані, але файли, тести, помилки, diff-и і метрики — справжні результати виконання.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">07<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ЖИВИЙ ПРИКЛАД<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Задача для агента<\u002Fh2>\n    <div data-anim=\"fadeUp .6s ease .3s both\" style=\"border-left:6px solid #B4551E;padding:8px 0 8px 40px;margin:0 0 56px\">\n      <p style=\"margin:0;font-size:var(--type-subtitle);line-height:1.4;color:#2A241A;max-width:1400px\">«Створи консольний трекер завдань із тестами. Усі тести мають проходити; якщо падають — знайди причину і виправ.»<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:26px;width:100%;margin:0 0 56px\">\n      <div data-anim=\"fadeUp .5s ease .5s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:14px;padding:24px 26px\">\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#B4551E\">01<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.4;color:#2A241A\">код з'явиться з нуля<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .65s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:14px;padding:24px 26px\">\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#B4551E\">02<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.4;color:#2A241A\">тести впадуть — по-справжньому<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .8s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:14px;padding:24px 26px\">\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#B4551E\">03<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.4;color:#2A241A\">агент знайде хибу і виправить<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .95s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:14px;padding:24px 26px\">\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#2E7D4F\">04<\u002Fp>\n        <p style=\"margin:0;font-size:var(--type-small);line-height:1.4;color:#2A241A\">фінал: зелені тести й робочий застосунок<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fadeIn .6s ease 1.15s both\" style=\"margin:0;font-size:22px;line-height:1.5;color:#6F6455;max-width:1500px\">Чесно: у цьому демо рішення агента заск @ від рядка 19 @@<\u002Fdiv>\n        <div style=\"color:#5C5344\"> function markDone(tasks, id) {<\u002Fdiv>\n        <div data-anim=\"fadeIn .4s ease 1s both\" style=\"color:#B3543F;background:rgba(179,84,63,.1)\">-  const t = tasks[id];<\u002Fdiv>\n        <div data-anim=\"fadeIn .4s ease 1.6s both\" style=\"color:#2E7D4F;background:rgba(46,125,79,.1)\">+  const t = tasks[id - 1];<\u002Fdiv>\n        <div style=\"color:#5C5344\">   if (!t) throw new Error('Немає завдання #' + id);<\u002Fdiv>\n        <div style=\"color:#5C5344\">   t.done = true;<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fadeUp .6s ease 2.2s both\" style=\"margin:44px 0 0;font-size:var(--type-body);line-height:1.45;color:#2A241A\">Одна відсутня <span style=\"color:#B4551E;font-weight:700\">− 1<\u002Fspan> — чотири червоні тести.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Кроки 9–13\" data-speaker-notes=\"Після виправлення — 6 із 6. Далі агент перевіряє застосунок руками, як користувач: add, done, list. Усе — дослівні виводи.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">13<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ЖИВИЙ ПРИКЛАД · КРОКИ 9–13<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Зелені тести й ручна пе nim=\"fadeIn .25s ease 3.5s both\" style=\"color:#CBC2AC\">Виконано: Купити молоко<\u002Fdiv>\n          <div data-anim=\"fadeIn .25s ease 3.7s both\"><span style=\"color:#8FC79A\">$<\u002Fspan> <span style=\"color:#EDE6D6\">node tasker.js list<\u002Fspan><\u002Fdiv>\n          <div data-anim=\"fadeIn .25s ease 3.9s both\" style=\"color:#8FC79A\">1. [x] Купити молоко<\u002Fdiv>\n          <div data-anim=\"fadeIn .25s ease 4.05s both\" style=\"color:#CBC2AC\">2. [ ] Написати доповідь про харнеси<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"fadeUp .6s ease 4.3s both\" style=\"border-left:6px solid #2E7D4F;padding:6px 0 6px 34px\">\n      <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#2A241A;max-width:1500px\">Фінальна відповідь агента: «Готово… У першій версії була хиба зсуву індексу в markDone — тести її впіймали, виправлення: tasks[id] → tasks[id − 1]. Усі 6 тестів проходять.»<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Метрики\" data-speaker-notes=\"Смарт-зона: агент працює найкраще, поки контекст не роздувся. На кроці 7 історія перевищила ліміт 1600 і була стиснута до 685 токенів — це реальний момент із логу. Час 2 мс — бо політика скриптована; живий LLM думав би хвилини.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">14<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ЖИВИЙ ПРИКЛАД · МЕТРИКИ<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Метрики прогону і смарт-зона<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:30px;width:100%;margin:0 0 60px\">\n      <div data-anim=\"fadeUp .5s ease .3s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:16px;padding:30px 34px\">\n        <p style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:60px;line-height:1;color:#2A241A\">13<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:22px;color:#6F6455\">викликів інструментів<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .45s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:16px;padding:30px 34px\">\n        <p style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:60px;line-height:1;color:#2A241A\">11 918<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:22px;color:#6F6455\">токенів оброблено (оцінка)<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .6s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:16px;padding:30px 34px\">\n        <p style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:60px;line-height:1;color:#B4551E\">1<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:22px;color:#6F6455\">обрізання контексту<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .75s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.12);border-radius:16px;padding:30px 34px\">\n        <p style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:60px;line-height:1;color:#2E7D4F\">6/6<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:22px;color:#6F6455\">тестів наприкінці<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:100%;margin:0 0 20px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px\">\n        <p data-anim=\"fadeUp .5s ease .9s both\" style=\"margin:0;font-size:var(--type-small);font-weight:600;color:#2A241A\">Контекст основного прогону<\u002Fp>\n        <p data-anim=\"fadeUp .5s ease .9s both\" style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;color:#6F6455\">крок 7: 1791 ток. → стиснення → 685 ток.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"position:relative;width:100%;height:34px;background:#EDE5D2;border-radius:999px\">\n        <div data-anim=\"trimBar 4.5s ease-in-out 1s both\" style=\"position:absolute;left:0;top:0;bottom:0;width:34.2%;background:linear-gradient(90deg,#2E7D4F,#B4551E);border-radius:999px\"><\u002Fdiv>\n        <div style=\"position:absolute;left:80%;top:-10px;bottom:-10px;width:3px;background:#2A241A\"><\u002Fdiv>\n        <p style=\"position:absolute;left:80%;top:calc(100% + 12px);transform:translateX(-50%);margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:#2A241A\">ліміт 1600<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;margin:12px 0 0\">\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#6F6455\">0<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#2E7D4F\">смарт-зона: історія коротка — агент точний<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#6F6455\">2000<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fadeIn .6s ease 1.4s both\" style=\"margin:24px 0 0;font-size:21px;line-height:1.5;color:#6F6455;max-width:1560px\">Чесна примітка: токени — оцінка (~4 символи/токен); чистий час прогону — 2 мс, бо рішення заскриптовані. Живий LLM на кожен крок витрачав би секунди роздумів.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Ralph Loop\" data-speaker-notes=\"Ralph Loop — зовнішній цикл, який перезапускає агента маленькими кроками, поки не з'явиться файл-маркер. Лог подій — справжній: дві ітерації, третя перевірка знайшла маркер.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">15<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ПРОСУНУТІ ТРЮКИ<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Ralph Loop: цикл маленьких кроків<\u002Fh2>\n    <div style=\"display:flex;gap:56px;width:100%;align-items:flex-start\">\n      <div style=\"display:flex;flex-direction:column;gap:26px;flex:none;width:760px\">\n        <div data-anim=\"fadeUp .6s ease .3s both\" style=\"background:#F0EADB;border:1px solid rgba(42,36,26,.14);border-radius:14px;padding:26px 32px\">\n          <p style=\"margin:0 0 14px;font-family:'IBM Plex Mono',monospace;font-size:18px;color:#6F6455\">src/run_all.js · справжній зовнішній цикл<\u002Fp>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:21px;line-height:1.6;color:#2A241A\">\n            <div style=\"color:#6F6455\">// while [ ! -f DONE.md ]; do<\u002Fdiv>\n            <div style=\"color:#6F6455\">//   run_agent --small-steps; done<\u002Fdiv>\n            <div>while (true) {<\u002Fdiv>\n            <div>  const done = o.vfs.has(o.doneMarker);<\u002Fdiv>\n            <div>  if (done) break;<\u002Fdiv>\n            <div>  const run = o.MH.runAgent({ … });<\u002Fdiv>\n            <div>  if (run.status === 'exhausted') break;<\u002Fdiv>\n            <div>}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-anim=\"fadeUp .6s ease .5s both\" style=\"margin:0;font-size:var(--type-small);line-height:1.55;color:#5C5344\">Ідея проста: щоразу — свіжий контекст і кілька маленьких кроків. Файл-маркер <span style=\"font-family:'IBM Plex Mono',monospace\">DONE_STATS.md<\u002Fspan> — «прапорець» на краю поля: є прапорець — робота завершена.<\u002Fp>\n      <\u002Fdiv>\n      <div data-term=\"\" style=\"flex:1;background:#16130D;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:14px 22px;background:#211D14;border-bottom:1px solid rgba(237,230,214,.08)\">\n          <span style=\"width:13px;height:13px;border-radius:50%;background:#B3543F;display:block\"><\u002Fspan>\n          <span style=\"width:13px;height:13px;border-radius:50%;background:#D9A45B;display:block\"><\u002Fspan>\n          <span style=\"width:13px;height:13px;border-radius:50%;background:#5F8F63;display:block\"><\u002Fspan>\n          <span style=\"margin-left:12px;font-family:'IBM Plex Mono',monospace;font-size:18px;color:#8A8170\">logs/ralph_loop.json · події, дослівно<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:26px 30px;font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1.65;color:#EDE6D6\">\n          <div data-anim=\"fadeIn .3s ease .6s both\" style=\"color:#D9A45B\">перевірка DONE_STATS.md: немає — запуск агента, ітерація 1<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 1.1s both\" style=\"color:#CBC2AC\">ітерація 1: статус=yielded (бюджет ітерації), викликів інструментів=4<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 1.6s both\" style=\"color:#D9A45B\">перевірка DONE_STATS.md: немає — запуск агента, ітерація 2<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 2.1s both\" style=\"color:#CBC2AC\">ітерація 2: статус=done (фінальна відповідь), викликів інструментів=5<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 2.6s both\" style=\"color:#8FC79A\">перевірка DONE_STATS.md: існує — задача виконана, вихід із циклу<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 3.2s both\" style=\"margin-top:16px\"><span style=\"color:#8FC79A\">$<\u002Fspan> <span style=\"color:#EDE6D6\">node tasker.js stats<\u002Fspan><\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 3.5s both\" style=\"color:#8FC79A\">Всього: 2 | виконано: 1 | лишилось: 1<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Схлопування\" data-speaker-notes=\"Схлопування: агент крутиться на місці. Вартовий помітив три однакові результати тестів поспіль і зупинив покоління 1. Усі три блоки — дослівний вивід.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">16<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ПРОСУНУТІ ТРЮКИ<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 24px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">Схлопування агента<\u002Fh2>\n    <p data-anim=\"fadeUp .6s ease .2s both\" style=\"margin:0 0 44px;font-size:var(--type-small);line-height:1.5;color:#5C5344;max-width:1560px\">Нова задача — команда remove. Покоління 1 обрало хибний шлях (delete), спробувало undefined, повернуло delete… і почало крутитися на місці. Кроки 7–9 — три однакові результати:<\u002Fp>\n    <div style=\"display:flex;gap:30px;width:100%;margin:0 0 44px\">\n      <div data-anim=\"fadeUp .5s ease .4s both\" style=\"flex:1;background:#100D08;border:1px solid rgba(237,230,214,.1);border-radius:14px;padding:24px 28px\">\n        <p style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:18px;color:#8A8170\">крок 7 · node tasker.test.js<\u002Fp>\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;line-height:1.5;color:#E08A76\">✗ remove: прибирає завдання і зсуває нумерацію<\u002Fp>\n        <p style=\"margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-size:18px;line-height:1.5;color:#A89F8C\">очікувалось \"1. [ ] друге\", отримано \"\\n2. [ ] друге\"<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#D9A45B\">Разом: 7 пройшло, 1 впало<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease .8s both\" style=\"flex:1;background:#100D08;border:1px solid rgba(237,230,214,.1);border-radius:14px;padding:24px 28px\">\n        <p style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:18px;color:#8A8170\">крок 8 · node tasker.test.js<\u002Fp>\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;line-height:1.5;color:#E08A76\">✗ remove: прибирає завдання і зсуває нумерацію<\u002Fp>\n        <p style=\"margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-size:18px;line-height:1.5;color:#A89F8C\">очікувалось \"1. [ ] друге\", отримано \"\\n2. [ ] друге\"<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#D9A45B\">Разом: 7 пройшло, 1 впало<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .5s ease 1.2s both\" style=\"flex:1;background:#100D08;border:1px solid rgba(224,138,118,.35);border-radius:14px;padding:24px 28px\">\n        <p style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;font-size:18px;color:#8A8170\">крок 9 · node tasker.test.js<\u002Fp>\n        <p style=\"margin:0 0 6px;font-family:'IBM Plex Mono',monospace;font-size:19px;line-height:1.5;color:#E08A76\">✗ remove: прибирає завдання і зсуває нумерацію<\u002Fp>\n        <p style=\"margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-size:18px;line-height:1.5;color:#A89F8C\">очікувалось \"1. [ ] друге\", отримано \"\\n2. [ ] друге\"<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#D9A45B\">Разом: 7 пройшло, 1 впало<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"fadeUp .6s ease 1.7s both\" style=\"border:1px dashed rgba(179,84,63,.5);background:rgba(179,84,63,.07);border-radius:16px;padding:26px 36px;width:100%;box-sizing:border-box\">\n      <p style=\"margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.1em;color:#B3543F\">🛑 ВАРТОВИЙ · з логу<\u002Fp>\n      <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#2A241A\">«три однакові результати тестів поспіль — прогресу немає, агент „видихся“» — цикл перервано вартовим.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"MetaLoop\" data-speaker-notes=\"MetaLoop: з логів покоління 1 автоматично зібрані нотатки. Покоління 2 стартує з чистим контекстом, читає нотатки, робить splice — і 8 з 8. Всі три артефакти справжні.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 18px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">17<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ПРОСУНУТІ ТРЮКИ<\u002Fspan>\n    <\u002Fdiv>\n    <h2 data-anim=\"fadeUp .6s ease .1s both\" style=\"margin:0 0 var(--gap-title);font-family:'Unbounded',sans-serif;font-weight:600;font-size:var(--type-title);line-height:1.12;color:#2A241A\">MetaLoop: нове покоління<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;width:100%;align-items:stretch\">\n      <div data-anim=\"fadeUp .6s ease .3s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.15);border-radius:16px;padding:28px 32px\">\n        <p style=\"margin:0 0 14px;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.08em;color:#6F6455\">workspace/NOTES_GEN1.md · згенеровано з логів<\u002Fp>\n        <p style=\"margin:0 0 10px;font-size:22px;font-weight:700;color:#2A241A\">Нотатки покоління 1<\u002Fp>\n        <p style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:19px;line-height:1.55;color:#5C5344\">«delete лишає в масиві „дірку“: список починається з порожнього рядка, нумерація не зсувається… Потрібен спосіб видалення, який справді прибирає елемент і зсуває наступні.»<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease .7s both\" style=\"background:#FFFDF7;border:1px solid rgba(42,36,26,.15);border-radius:16px;padding:28px 32px\">\n        <p style=\"margin:0 0 14px;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.08em;color:#6F6455\">artifacts/diffs/017-tasker.js.diff · дослівно<\u002Fp>\n        <p style=\"margin:0 0 10px;font-size:22px;font-weight:700;color:#2A241A\">Покоління 2 виправляє<\u002Fp>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1.65\">\n          <div style=\"color:#5C5344\"> function removeTask(tasks, id) {<\u002Fdiv>\n          <div style=\"color:#B3543F;background:rgba(179,84,63,.1)\">-  delete tasks[id - 1];<\u002Fdiv>\n          <div style=\"color:#2E7D4F;background:rgba(46,125,79,.12)\">+  tasks.splice(id - 1, 1);<\u002Fdiv>\n          <div style=\"color:#5C5344\">   return tasks;<\u002Fdiv>\n          <div style=\"color:#5C5344\"> }<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-anim=\"fadeUp .6s ease 1.1s both\" data-term=\"\" style=\"background:#16130D;border-radius:16px;padding:28px 32px;box-shadow:0 24px 60px rgba(0,0,0,.3)\">\n        <p style=\"margin:0 0 14px;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.08em;color:#8A8170\">крок 4 покоління 2 · дослівно<\u002Fp>\n        <p style=\"margin:0 0 10px;font-size:22px;font-weight:700;color:#F6F1E7\">Результат<\u002Fp>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1.65\">\n          <div data-anim=\"fadeIn .3s ease 1.5s both\" style=\"color:#8FC79A\">✓ stats: рахує виконані й невиконані<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 1.7s both\" style=\"color:#8FC79A\">✓ remove: прибирає завдання і зсуває нумерацію<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 1.95s both\" style=\"color:#8FC79A;margin-top:10px;font-weight:600\">Разом: 8 пройшло, 0 впало<\u002Fdiv>\n          <div data-anim=\"fadeIn .3s ease 2.2s both\" style=\"color:#D9A45B;margin-top:10px\">створено DONE_REMOVE.md<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-anim=\"fadeUp .6s ease 2.4s both\" style=\"margin:52px 0 0;font-size:var(--type-body);line-height:1.45;color:#2A241A;max-width:1600px\">Нове покоління — це <span style=\"color:#B4551E;font-weight:600\">чистий аркуш плюс досвід<\u002Fspan>: контекст порожній, але нотатки попередника лежать у полі.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Підсумок\" data-speaker-notes=\"Висновок одним реченням. Нагадати: всі приклади — з реального прогону, артефакти лежать у теці project/.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden\">\n    <div data-anim=\"spinSlow 60s linear infinite\" style=\"position:absolute;left:-300px;bottom:-300px;width:900px;height:900px;border:3px dashed rgba(180,85,30,.35);border-radius:50%\"><\u002Fdiv>\n    <div data-anim=\"fadeUp .5s ease both\" style=\"display:flex;align-items:center;gap:14px;margin:0 0 44px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">18<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ПІДСУМОК<\u002Fspan>\n    <\u002Fdiv>\n    <p data-anim=\"fadeUp .7s ease .2s both\" style=\"margin:0 0 64px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:60px;line-height:1.25;color:#2A241A;max-width:1600px\">Модель — це сила. <span style=\"color:#B4551E\">Харнес — упряж,<\u002Fspan> що перетворює силу на зоране поле.<\u002Fp>\n    <div data-anim=\"fadeUp .6s ease .5s both\" style=\"display:flex;flex-wrap:wrap;gap:16px;margin:0 0 70px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#5C5344;border:1px solid rgba(42,36,26,.25);border-radius:999px;padding:10px 22px\">цикл рішення<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#5C5344;border:1px solid rgba(42,36,26,.25);border-radius:999px;padding:10px 22px\">4 інструменти<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#5C5344;border:1px solid rgba(42,36,26,.25);border-radius:999px;padding:10px 22px\">AGENTS.md<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#5C5344;border:1px solid rgba(42,36,26,.25);border-radius:999px;padding:10px 22px\">керування контекстом<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#5C5344;border:1px solid rgba(42,36,26,.25);border-radius:999px;padding:10px 22px\">Ralph Loop<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);color:#5C5344;border:1px solid rgba(42,36,26,.25);border-radius:999px;padding:10px 22px\">MetaLoop<\u002Fspan>\n    <\u002Fdiv>\n    <p data-anim=\"fadeIn .6s ease .8s both\" style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-size:20px;line-height:1.6;color:#6F6455\">Кожен лог, diff і вивід терміналу в цій презентації — з реального прогону MiniHarness · тека project/<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Тест\" data-speaker-notes=\"Інтерактивний тест: 10 питань одне за одним. Правильна відповідь показує пояснення внизу і кнопку далі; помилка дає ще одну спробу.\" style=\"background:#FFFFFF;color:#2A241A;font-family:'IBM Plex Sans',sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden\">\n    <div style=\"display:flex;align-items:center;gap:14px;margin:0 0 34px;width:100%;max-width:1450px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);font-weight:600;letter-spacing:.12em;color:#B4551E;border:1px solid rgba(180,85,30,.4);border-radius:999px;padding:6px 16px\">19<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.12em;color:#6F6455\">ТЕСТ · ПЕРЕВІР СЕБЕ<\u002Fspan>\n      <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:var(--type-label);letter-spacing:.1em;color:#6F6455\">{{ quizProgress }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ quizActive }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"margin:0 0 40px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:44px;line-height:1.3;color:#2A241A;max-width:1450px;min-height:118px;text-align:center\">{{ quizQuestion }}<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:18px;width:100%;max-width:1450px;margin:0 0 34px\">\n        <sc-for list=\"{{ quizOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n          <div onclick=\"{{ opt.pick }}\" style=\"{{ opt.style }}\">\n            <span style=\"{{ opt.letterStyle }}\">{{ opt.letter }}<\u002Fspan>\n            <span style=\"flex:1\">{{ opt.text }}<\u002Fspan>\n            <span style=\"font-size:30px;font-weight:700;flex:none\">{{ opt.mark }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"width:100%;max-width:1450px;min-height:170px\">\n        <sc-if value=\"{{ quizWrong }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:16px;border:1px dashed rgba(179,84,63,.5);background:rgba(179,84,63,.06);border-radius:16px;padding:26px 34px;box-sizing:border-box;width:100%\">\n            <p style=\"margin:0;font-size:var(--type-small);line-height:1.45;color:#B3543F;font-weight:600\">✗ Неправильно. Спробуй ще раз — обери іншу відповідь.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ quizCorrect }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:flex-start;gap:34px;border:1px solid rgba(46,125,79,.4);background:rgba(46,125,79,.06);border-radius:16px;padding:26px 34px;box-sizing:border-box;width:100%\">\n            <div style=\"flex:1\">\n              <p style=\"margin:0 0 10px;font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.1em;font-weight:600;color:#2E7D4F\">✓ ПРАВИЛЬНО · ЧОМУ<\u002Fp>\n              <p style=\"margin:0;font-size:var(--type-small);line-height:1.5;color:#2A241A\">{{ quizExplain }}<\u002Fp>\n            <\u002Fdiv>\n            <div onclick=\"{{ quizNext }}\" style=\"flex:none;align-self:center;background:#2A241A;color:#FFFFFF;border-radius:12px;padding:18px 34px;font-size:24px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#B4551E\">{{ quizNextLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ quizDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;text-align:center\">\n        <p style=\"margin:0 0 24px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:90px;line-height:1;color:#2E7D4F\">10 / 10<\u002Fp>\n        <p style=\"margin:0 0 56px;font-size:var(--type-subtitle);line-height:1.35;color:#2A241A;max-width:1300px\">Тест пройдено. Тепер ти знаєш, як улаштований харнес — від упряжі до MetaLoop.<\u002Fp>\n        <div onclick=\"{{ quizRestart }}\" style=\"background:#2A241A;color:#FFFFFF;border-radius:12px;padding:18px 36px;font-size:24px;font-weight:600;cursor:pointer\" style-hover=\"background:#B4551E\">Пройти ще раз<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n<\u002Fx-import>\n\n<div data-rail-toggle=\"\" onclick=\"{{ toggleRail }}\" title=\"Показати / сховати список слайдів\" style=\"position:fixed;left:14px;bottom:14px;z-index:2147483000;width:44px;height:44px;border-radius:12px;background:rgba(42,36,26,.88);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)\" style-hover=\"background:#B4551E\">\n  <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\">\n    <rect x=\"1.5\" y=\"2.5\" width=\"19\" height=\"17\" rx=\"3\" stroke=\"#FFFFFF\" stroke-width=\"2\"><\u002Frect>\n    <rect x=\"4.5\" y=\"5.5\" width=\"4\" height=\"11\" rx=\"1\" fill=\"#FFFFFF\"><\u002Frect>\n  <\u002Fsvg>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Показ&quot;},&quot;crtGlow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Показ&quot;},&quot;showRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Показ&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._played = false;\n    this._onSlide = (e) => {\n      if (this.props.animations === false) return;\n      const detail = e.detail || {};\n      const prev = detail.previousSlide;\n      const cur = detail.slide;\n      if (prev && prev !== cur) {\n        prev.querySelectorAll('[data-anim]').forEach((el) => { el.style.animation = 'none'; });\n      }\n      if (cur) {\n        cur.querySelectorAll('[data-anim]').forEach((el) => { el.style.animation = 'none'; });\n        void cur.offsetWidth;\n        cur.querySelectorAll('[data-anim]').forEach((el) => { el.style.animation = el.getAttribute('data-anim'); });\n        this._played = true;\n      }\n      this._applyGlow();\n    };\n    document.addEventListener('slidechange', this._onSlide);\n    // якщо подія init пролетіла до монтування — програти видимий слайд\n    this._poll = setInterval(() => {\n      const stage = document.querySelector('deck-stage');\n      if (!stage) return;\n      clearInterval(this._poll);\n      this._applyGlow();\n      this._applyRail();\n      setTimeout(() => {\n        if (this._played || this.props.animations === false) return;\n        const sec = Array.from(stage.querySelectorAll('section')).find((s) => {\n          const r = s.getBoundingClientRect();\n          return r.width > 0 && r.height > 0;\n        });\n        if (sec) this._onSlide({ detail: { slide: sec, previousSlide: null } });\n      }, 500);\n    }, 250);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('slidechange', this._onSlide);\n    clearInterval(this._poll);\n  }\n  componentDidUpdate() {\n    this._applyGlow();\n    this._applyRail();\n    if (this.props.animations === false) {\n      document.querySelectorAll('[data-anim]').forEach((el) => { el.style.animation = 'none'; });\n    }\n  }\n  _applyRail() {\n    const on = this._railEffective();\n    if (this._railState === on) return;\n    this._railState = on;\n    window.postMessage({ type: '__deck_rail_visible', on }, '*');\n  }\n  _applyGlow() {\n    const on = this.props.crtGlow === true;\n    document.querySelectorAll('[data-term]').forEach((el) => {\n      el.style.textShadow = on ? '0 0 9px rgba(143,199,154,.4)' : '';\n    });\n  }\n  state = { qi: 0, wrongIds: [], wrong: false, correct: false, done: false, railOn: null };\n  _railEffective() {\n    return this.state.railOn === null ? (this.props.showRail !== false) : this.state.railOn;\n  }\n  _quiz() {\n    return [\n      { q: 'Що таке harness?', correct: 1, opts: [\n          'Звичайна чат-модель, яка відповідає лише текстом',\n          'Особливий вид агента, який працює у просторі файлів і віртуальних або реальних машин',\n          'Окремий no-code-інструмент для створення сайтів'],\n        why: 'Harness — це агент, що працює з файлами, середовищем виконання та завданнями, перетворюючи LLM на універсальний інструмент дії.' },\n      { q: 'Яку роль у метафорі harness виконує сама LLM?', correct: 1, opts: [\n          'Файл AGENTS.md з інструкціями',\n          'Тяглову силу, двигун або коня',\n          'Поле, яке потрібно обробляти'],\n        why: 'LLM порівнюється з тягловою силою, а harness — з упряжжю, яка спрямовує цю силу на роботу з файлами та завданнями.' },\n      { q: 'Чому harness перетворює LLM на універсального агента?', correct: 0, opts: [\n          'Він дає моделі доступ до файлів, інструментів, середовища виконання та зворотного зв\\u02bcязку',\n          'Він повністю прибирає потребу в інструкціях і контексті',\n          'Він працює лише як звичайний текстовий чат без інструментів'],\n        why: 'Без harness LLM залишається текстовим процесором, а з harness вона може працювати з файлами, виконувати дії, отримувати зворотний зв\\u02bcязок і зберігати зміни в середовищі.' },\n      { q: 'Які чотири інструменти є практично в усіх harness?', correct: 2, opts: [\n          'Оплата рахунків, керування календарем, надсилання SMS і запуск браузера',\n          'Створення презентацій, генерація відео, переклад голосу та обробка фото',\n          'Читання файла, пошук серед файлів, редагування файла та виконання bash-команд'],\n        why: 'Чотири базові можливості harness: читання файлів, пошук, редагування та використання bash.' },\n      { q: 'У який файл зазвичай кладуть головне завдання або інструкції для harness?', correct: 0, opts: [\n          'AGENTS.md або Claude.md',\n          'package.json або pyproject.toml',\n          'README.old або debug.log'],\n        why: 'За загальною домовленістю інструкцію для harness кладуть у AGENTS.md або Claude.md.' },\n      { q: 'Який етап описано як появу найпростіших агентів із підключеними інструментами?', correct: 1, opts: [\n          'Dark Factory',\n          'ReAct',\n          'Meta Loop'],\n        why: 'ReAct-агенти працюють у циклі: модель міркує, вирішує, чи викликати інструмент, бачить результат і продовжує роботу.' },\n      { q: 'Чому harness потребує грамотного керування контекстом?', correct: 2, opts: [\n          'Контекст автоматично не впливає на якість роботи агента',\n          'Контекст потрібен лише для зміни кольору інтерфейсу',\n          'Навіть дуже великий контекст закінчується, якщо агент працює десятки або сотні хвилин'],\n        why: 'При тривалій роботі контекст неминуче вичерпується, тому harness має обрізати історію, сумаризувати або використовувати субагентів.' },\n      { q: 'Який режим дозволяє вбудовувати harness у пайплайни, CLI або bash-цикл?', correct: 0, opts: [\n          'Робота без користувача через аргументи командного рядка',\n          'Лише ручний чат із користувачем',\n          'Режим перегляду презентацій'],\n        why: 'Безінтерактивний режим через аргументи командного рядка корисний для автоматизації, CI та bash-циклів.' },\n      { q: 'Що означає backpressure у роботі harness?', correct: 2, opts: [\n          'Автоматичне стирання всіх результатів роботи',\n          'Повне вимкнення інструментів агента',\n          'Зовнішній тиск через CLI, тести й обмеження, який не дає агенту піти в неправильний бік'],\n        why: 'Backpressure утримує агента в межах потрібного напряму за допомогою тестів, команд, обмежень та інших зовнішніх перевірок.' },\n      { q: 'Для чого автор пропонує Meta Loop?', correct: 1, opts: [\n          'Щоб замінити harness звичайним чатботом',\n          'Щоб захищатися від схлопування, запускаючи нові генерації з нуля і дозволяючи агенту йти іншим шляхом',\n          'Щоб повністю заборонити агенту використовувати файли'],\n        why: 'Meta Loop потрібен для боротьби зі схлопуванням, коли агент повторює одні й ті самі ідеї; нова генерація стартує окремо й може знайти інший шлях.' }\n    ];\n  }\n  _pick(i) {\n    const q = this._quiz()[this.state.qi];\n    if (this.state.correct || this.state.done) return;\n    if (i === q.correct) {\n      this.setState({ correct: true, wrong: false });\n    } else if (this.state.wrongIds.indexOf(i) === -1) {\n      this.setState({ wrongIds: this.state.wrongIds.concat([i]), wrong: true });\n    }\n  }\n  _next() {\n    if (this.state.qi >= this._quiz().length - 1) {\n      this.setState({ done: true, correct: false, wrong: false });\n    } else {\n      this.setState({ qi: this.state.qi + 1, wrongIds: [], wrong: false, correct: false });\n    }\n  }\n  _restart() {\n    this.setState({ qi: 0, wrongIds: [], wrong: false, correct: false, done: false });\n  }\n  renderVals() {\n    const Q = this._quiz();\n    const s = this.state;\n    const q = Q[Math.min(s.qi, Q.length - 1)];\n    const options = q.opts.map((text, i) => {\n      const isRight = s.correct && i === q.correct;\n      const isWrong = s.wrongIds.indexOf(i) !== -1;\n      return {\n        text,\n        letter: ['a', 'b', 'c'][i],\n        mark: isRight ? '✓' : isWrong ? '✗' : '',\n        pick: () => this._pick(i),\n        style: {\n          display: 'flex', alignItems: 'center', gap: '24px', width: '100%', boxSizing: 'border-box',\n          padding: '20px 30px', borderRadius: '16px', fontSize: '27px', lineHeight: 1.4,\n          border: isRight ? '2px solid #2E7D4F' : isWrong ? '2px solid rgba(179,84,63,.55)' : '1px solid rgba(42,36,26,.18)',\n          background: isRight ? 'rgba(46,125,79,.07)' : isWrong ? 'rgba(179,84,63,.05)' : '#FFFFFF',\n          color: isRight ? '#2E7D4F' : isWrong ? '#B3543F' : '#2A241A',\n          cursor: (s.correct || isWrong) ? 'default' : 'pointer',\n          transition: 'all .15s ease'\n        },\n        letterStyle: {\n          flex: 'none', width: '52px', height: '52px', borderRadius: '50%',\n          display: 'flex', alignItems: 'center', justifyContent: 'center',\n          fontFamily: \"'IBM Plex Mono',monospace\", fontWeight: 600, fontSize: '24px',\n          background: isRight ? '#2E7D4F' : isWrong ? '#B3543F' : 'rgba(42,36,26,.07)',\n          color: (isRight || isWrong) ? '#FFFFFF' : '#2A241A'\n        }\n      };\n    });\n    return {\n      toggleRail: () => this.setState({ railOn: !this._railEffective() }),\n      quizActive: !s.done,\n      quizDone: s.done,\n      quizProgress: s.done ? 'ГОТОВО' : 'ПИТАННЯ ' + (s.qi + 1) + ' / ' + Q.length,\n      quizQuestion: q.q,\n      quizOptions: options,\n      quizWrong: s.wrong && !s.correct,\n      quizCorrec
