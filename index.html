;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">5 листопада OpenAI відкрила модель GPT-6 Cyber лише перевіреним клієнтам — із рейтингом ризику «критичний»<\/p>\n<\/div>\n<div data-build-in=\"left 6 auto\" style=\"position:absolute;left:128px;top:736px;width:1664px;display:flex;align-items:center;gap:40px;background:#2A1C14;border-left:8px solid #FB923C;border-radius:16px;padding:28px 40px\">\n<div style=\"width:340px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">948<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">вразливостей з робочими експлойтами<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> захисники отримують потужний інструмент, але й ціна атаки падає. Вчасні оновлення стають ще важливішими.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#A8A39B\">Джерела: csoonline.com, badgoodbetter.substack.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">10<\/p>\n<aside class=\"notes\">4 листопада OpenAI описала автоматизований конвеєр: пошук вразливостей, динамічна перевірка, створення експлойта й латки. Жовтневий прогін на ядрі Linux дав 948 різних вразливостей підвищення привілеїв з експлойтами — уп’ятеро більше, ніж попередній експеримент. Вартість — $1 213 430 в API-кредитах. На момент звіту 61 вразливість виправлено, 43 мали патчі в підготовці. У ранньому прогоні 20 зі 200 «успіхів» використали іншу помилку, тож потрібна незалежна перевірка. 5 листопада OpenAI відкрила GPT-6 Cyber для схвалених клієнтів; рейтинг «критичний» — власна оцінка OpenAI. Джерела: https://www.csoonline.com/article/4245265/openai-built-an-ai-pipeline-to-find-exploit-and-patch-linux-flaws.html ; https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s08\" data-transition=\"push\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:1060px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite reverse&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;display:flex;align-items:center;gap:20px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1A1D24;background:#FB923C;padding:8px 22px;border-radius:8px\">Безпека і регулювання<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#C9C4BC\">5 листопада<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#FB923C\">08 / 11<\/p>\n<\/div>\n<h2 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:200px;width:1664px;font-size:60px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#F5F2EE\">METR: Anthropic покращує моделі вдвічі швидше — і ШІ, схоже, допомагає сам собі<\/h2>\n<div data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Незалежна організація METR вивчила 11 тижнів внутрішніх даних Anthropic і поспілкувалася з її співробітниками<\/p>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:693px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Висновок: прогрес на чітко поставлених задачах удвічі швидший, ніж рік тому; ймовірна причина — ШІ в дослідженнях<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1258px;top:380px;width:534px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Застереження: частину даних засекречено, а прискорення може стосуватися лише задач, які легко оцінити<\/p>\n<\/div>\n<div data-build-in=\"left 6 auto\" style=\"position:absolute;left:128px;top:736px;width:1664px;display:flex;align-items:center;gap:40px;background:#2A1C14;border-left:8px solid #FB923C;border-radius:16px;padding:28px 40px\">\n<div style=\"width:340px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">×2<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">швидше покращуються моделі, ніж рік тому<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> це перша незалежна оцінка «самоприскорення» ШІ. Регулятори й інвестори уважно стежитимуть за наступними звітами.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#A8A39B\">Джерела: fastcompany.com (Associated Press), badgoodbetter.substack.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">11<\/p>\n<aside class=\"notes\">5 листопада METR — некомерційна організація з Берклі — опублікувала оцінку на основі ~11 тижнів внутрішніх даних Anthropic (з середини серпня до кінця жовтня) та інтерв’ю зі співробітниками. Висновок: на чітко поставлених задачах Anthropic покращує моделі приблизно вдвічі швидше, ніж рік тому; METR виключила зростання обчислень як причину і вважає, що прискорення дає сам ШІ. Застереження: частину даних відредаговано, а прискорення може не стосуватися складних «брудних» задач. Напередодні, 2 листопада, Anthropic в оновленому проспекті IPO попередила, що може незабаром досягти порогу своєї політики відповідального масштабування щодо прискореного прогресу. Джерела: https://www.fastcompany.com/91636791/anthropic-metr-ai-claude-acceleration ; https://badgoodbetter.substack.com/p/ai-weekly-update-week-ending-november-4a0<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s09\" data-transition=\"fade\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:1060px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite reverse&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;display:flex;align-items:center;gap:20px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1A1D24;background:#FB923C;padding:8px 22px;border-radius:8px\">Безпека і регулювання<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#C9C4BC\">3 листопада<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#FB923C\">09 / 11<\/p>\n<\/div>\n<h2 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:200px;width:1664px;font-size:60px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#F5F2EE\">Жителі США підтримали обмеження дата-центрів у 40 з 41 місцевих голосувань<\/h2>\n<div data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M2 12h20\"/><path d=\"M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">41 голосування в 10 штатах; 21 — в Огайо, де кілька громад повністю заборонили нові дата-центри<\/p>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:693px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">За опитуванням CNBC, для 56% виборців дата-центри були важливим чинником під час голосування<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1258px;top:380px;width:534px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">OpenAI у відповідь пообіцяла сама оплачувати електроенергію та інфраструктуру своїх кампусів<\/p>\n<\/div>\n<div data-build-in=\"left 6 auto\" style=\"position:absolute;left:128px;top:736px;width:1664px;display:flex;align-items:center;gap:40px;background:#2A1C14;border-left:8px solid #FB923C;border-radius:16px;padding:28px 40px\">\n<div style=\"width:340px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">40 з 41<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">голосування — за обмеження<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> головним обмеженням ШІ стають не чипи, а згода місцевих громад: енергія, вода й тарифи стають політикою.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#A8A39B\">Джерела: baxtel.com (дані Ballotpedia), badgoodbetter.substack.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">12<\/p>\n<aside class=\"notes\">3 листопада в США пройшли 41 місцеве голосування щодо дата-центрів у 10 штатах (підрахунок Ballotpedia; Washington Post нарахувала щонайменше 38). У 40 з них виборці підтримали обмеження або відхилили проєкти; виняток — Гарвуд, Північна Дакота. В Огайо — 21 голосування, зокрема Гранвілл заборонив дата-центри (82% «за»). У Мені схвалили вісім тимчасових мораторіїв. За опитуванням CNBC, 56% виборців назвали дата-центри важливим чинником. Асоціація Data Center Coalition наголошує на робочих місцях і податках. Джерело: https://baxtel.com/news/voters-back-data-center-limits-in-40-of-41-ballot-measures-across-10-states<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"p10\" data-transition=\"push\" style=\"background:#F5F2FC;color:#1E1438;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:1080px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst B=[[.12,.18,&#x27;124,58,237&#x27;],[.88,.22,&#x27;236,72,153&#x27;],[.72,.88,&#x27;124,58,237&#x27;],[.18,.9,&#x27;59,130,246&#x27;],[.5,.5,&#x27;167,139,250&#x27;]].map((b,i)=&gt;({x:b[0],y:b[1],c:b[2],p:i*1.3}));\nfunction f(t){x.clearRect(0,0,W,H);for(const b of B){const X=(b.x+.07*Math.sin(t/3500+b.p))*W,Y=(b.y+.07*Math.cos(t/4500+b.p))*H,rr=Math.min(W,H)*.42,g=x.createRadialGradient(X,Y,0,X,Y,rr);g.addColorStop(0,&#x27;rgba(&#x27;+b.c+&#x27;,.17)&#x27;);g.addColorStop(1,&#x27;rgba(&#x27;+b.c+&#x27;,0)&#x27;);x.fillStyle=g;x.fillRect(0,0,W,H)}requestAnimationFrame(f)}requestAnimationFrame(f);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;display:flex;align-items:center;gap:20px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#6D28D9;background:#E7DEFA;border:2px solid #6D28D9;padding:6px 22px;border-radius:999px\">Практика<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#4D4566\">4 листопада<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#6D28D9\">10 / 11<\/p>\n<\/div>\n<h2 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:200px;width:1664px;font-size:64px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#1E1438\">Revolut перейшов на власні сервери з китайською моделлю GLM і зекономив до 90%<\/h2>\n<div data-build-in=\"scale 3 auto\" style=\"position:absolute;left:128px;top:380px;width:1664px;height:210px;display:flex;align-items:center;gap:48px;background:linear-gradient(120deg, #5B21B6 0%, #7C3AED 100%);border-radius:28px;padding:36px 56px;box-shadow:0 16px 40px rgba(91,33,182,0.25)\">\n<div style=\"width:480px;display:flex;flex-direction:column;gap:6px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:64px;font-weight:700;line-height:1.1;color:#FBF9FF\">−90%<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#F1EAFF\">витрат на ШІ-кодинг менш ніж за рік<\/p>\n<\/div>\n<div style=\"width:2px;height:130px;background:#B9A2F0\"><\/div>\n<p style=\"flex:1;font-size:28px;line-height:1.4;color:#FBF9FF\">Відкриті моделі на власних серверах — реальна альтернатива дорогим підпискам, коли запитів дуже багато.<\/p>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:128px;top:630px;width:533px;display:flex;gap:20px;align-items:start;background:#FCFBFF;border:1px solid #E2DAF5;border-radius:20px;padding:28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#6D28D9;border-radius:50%\"><p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:26px;font-weight:700;color:#FBF9FF\">1<\/p><\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#2E2645\">Моделі GLM від Z.ai на 56 GPU Nvidia B200: ~$0,30 за 1 млн токенів, у ~10 разів дешевше комерційних<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:693px;top:630px;width:533px;display:flex;gap:20px;align-items:start;background:#FCFBFF;border:1px solid #E2DAF5;border-radius:20px;padding:28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#6D28D9;border-radius:50%\"><p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:26px;font-weight:700;color:#FBF9FF\">2<\/p><\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#2E2645\">Компанія повідомляє про +70% продуктивності за часом виконання й +60% за часом написання коду<\/p>\n<\/div>\n<div data-build-in=\"rise 6 auto\" style=\"position:absolute;left:1258px;top:630px;width:534px;display:flex;gap:20px;align-items:start;background:#FCFBFF;border:1px solid #E2DAF5;border-radius:20px;padding:28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#6D28D9;border-radius:50%\"><p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:26px;font-weight:700;color:#FBF9FF\">3<\/p><\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#2E2645\">Інші теж рахують: Apple скоротила денний ліміт на ШІ-інструменти для частини інженерів з $300 до $200<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#635B7A\">Джерела: techradar.com, mindandmachineweekly.substack.com (Bloomberg)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#635B7A\">13<\/p>\n<aside class=\"notes\">Керівник інфраструктури Revolut Девід Абітбол розповів на конференціях, що компанія перенесла найдорожчі навантаження з комерційних ШІ-асистентів на власні сервери з відкритими моделями GLM від Z.ai: 56 GPU Nvidia B200, близько $0,30 за мільйон токенів. Витрати на інференс скоротилися до 90% менш ніж за рік; передові моделі лишаються «винятком» для складних задач. Цифри продуктивності — дані компанії, незалежно не перевірені. Окремо Bloomberg повідомив, що Apple урізала денний бюджет на ШІ-інструменти для частини інженерів з $300 до $200. Джерела: https://techradar.com/pro/we-were-highly-skeptical-about-the-cost-of-ai-revolut-reveals-it-cut-ai-coding-costs-by-cutting-out-claude-entirely ; https://mindandmachineweekly.substack.com/p/mind-and-machine-weekly-8-november<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"p11\" data-transition=\"fade\" style=\"background:#F5F2FC;color:#1E1438;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:1080px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListen rdana, sans-serif;font-size:72px;font-weight:700;line-height:1.1;color:#FFFFFF\">$0,0035<\/p>\n<p style=\"font-size:24px;line-height:1.4;color:#DDE3FF\">за хвилину розпізнавання мовлення<\/p>\n<hr style=\"border-top:2px solid rgba(255,255,255,0.25)\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#FFD166\">Чому це важливо<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#F4F6FF\">Європейська альтернатива для кол-центрів і голосових помічників: дані можна тримати в ЄС, що важливо для GDPR.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#EEF1FF\">Джерело: mistral.ai/news/voxtral-3<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#EEF1FF\">6<\/p>\n<aside class=\"notes\">Французька Mistral випустила лінійку Voxtral 3: моделі транскрипції (пакетна і в реальному часі із затримкою до пів секунди), синтез мовлення та SDK для голосових агентів на базі LiveKit. Ціни: від $0,0035 за хвилину транскрипції, голосовий агент — від $0,04 за хвилину. Українська мова є і в бібліотеці голосів, і в тестах транскрипції. Джерело: https://mistral.ai/news/voxtral-3/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"b04\" data-transition=\"push\" style=\"background:#F7F4EC;color:#14211E;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<div data-build-in=\"left 1 auto\" style=\"position:absolute;left:0px;top:0px;width:720px;height:1080px;background:linear-gradient(160deg, #0B6B5C 0%, #064E43 100%)\"><\/div>\n<div data-build-in=\"fade 2 auto\" style=\"position:absolute;left:128px;top:128px;width:500px;display:flex;align-items:center;gap:16px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1B1A16;background:#F2C14E;padding:8px 20px;border-radius:999px\">Бізнес і угоди<\/p>\n<p style=\"font-size:26px;font-weight:600;color:# osition:absolute;left:800px;bottom:64px;width:900px;font-size:24px;color:#5F6660\">Джерела: techstrong.ai, willk30.substack.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#5F6660\">9<\/p>\n<aside class=\"notes\">OpenAI придбала Orchestra Bio — стартап 2022 року, що робить платформу для координації розробки ліків. Приклад з анонсу: зіпсована виробнича партія затримує клінічне дослідження, а агенти показують, які роботи й терміни це зачепить. Сума угоди не розкривається; Orchestra залучала близько $20 млн. Того ж тижня тисячі агентів GPT-Rosalind разом зі Scripps Research за 32 хвилини проаналізували дані мільйонів клітин мозку миші. Джерело: https://techstrong.ai/articles/openai-acquires-orchestra-bio/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s07\" data-transition=\"push\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:1060px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45de r\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Патч вийшов того ж дня, але спроби атак зросли до мільйонів; ФБР і АНБ радили відключати сервери<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1258px;top:380px;width:534px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><circle cx=\"7.5\" cy=\"15.5\" r=\"5.5\"/><path d=\"m21 2-9.6 9.6\"/><path d=\"m15.5 7.5 3 3L22 7l-3-3\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Того ж тижня: шкідлива версія LiteLLM, зломи Railway та OpenCode — хвиля крадіжок API-ключів<\/p>\n<\/div>\n<div data-build-in=\"left 6 auto\" style=\"position:absolute;left:128px;top:736px;width:1664px;display:flex;align-items:center;gap:40px;background:#2A1C14;border-left:8px solid #FB923C;border-radius:16px;padding:28px 40px\">\n<div style=\"width:340px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">≈70%<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">сайтів у світі працюють на PHP<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> ШІ знаходить вразливості швидше за людей — і для захисту, і для атак. Вчасно оновлюйте ПЗ і змінюйте ключі доступу.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#A8A39B\">Джерела: ppc.land, willk30.substack.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">10<\/p>\n<aside class=\"notes\">«Чорним жовтнем» у техспільноті назвали серію інцидентів 17–23 жовтня. Центральна подія — PHP2Shell: 21 жовтня OpenAI повідомила, що компанія Calif за допомогою GPT-5.6 Sol знайшла критичну вразливість у PHP; Wiz незалежно знайшла обидві. Виправлення вийшли того ж дня, Cloudflare блокувала атаки ще до релізу. Паралельно — шкідлива версія бібліотеки LiteLLM (≈49 тис. завантажень за дві години), злам хостингу Railway, атаки на OpenCode. Практичний висновок: оновлення й ротація ключів. Джерела: https://ppc.land/openai-says-gpt-5-6-sol-found-a-php-flaw-before-attackers-did/ ; https://willk30.substack.com/p/black-october-claude-duet-and-blocks<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s08\" data-transition=\"push\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:1060px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite reverse&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;display:flex;align-items:center;gap:20px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1A1D24;background:#FB923C;padding:8px 22px;border-radius:8px\">Безпека і регулювання<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#C9C4BC\">23–25 жовтня<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#FB923C\">08 / 11<\/p>\n<\/div>\n<h2 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:200px;width:1664px;font-size:60px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#F5F2EE\">Claude і ChatGPT почали обмежувати реверс-інжиніринг через REA<\/h2>\n<div data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Користувачі повідомляють: Claude відмовляється працювати з REA — найпопулярнішим інструментом тижня на GitHub<\/p>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:693px;top:380px;width:533px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Дослідник log4j розібрав телевізор Samsung, знайшов код збору даних — і отримав бан в OpenAI за «кіберзловживання»<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1258px;top:380px;width:534px;height:320px;display:flex;flex-direction:column;gap:16px;background:#242832;border:1px solid #343946;border-radius:16px;padding:32px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#FB923C;width:48px;height:48px\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/><\/svg>\n<p style=\"font-size:26px;line-height:1.4;color:#E6E1DA\">Офіційних заяв немає. Нова політика Anthropic з 12 листопада прямо дозволяє дослідження безпеки власних систем<\/p>\n<\/div>\n<div data-build-in=\"left 6 auto\" style=\"position:absolute;left:128px;top:736px;width:1664px;display:flex;align-items:center;gap:40px;background:#2A1C14;border-left:8px solid #FB923C;border-radius:16px;padding:28px 40px\">\n<div style=\"width:340px;display:flex;flex-direction:column;gap:4px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;line-height:1.1;color:#FB923C\">1 млн+<\/p>\n<p style=\"font-size:24px;line-height:1.3;color:#C9C4BC\">переглядів постів про «смерть REA»<\/p>\n<\/div>\n<p style=\"flex:1;font-size:26px;line-height:1.4;color:#F5F2EE\"><b>Чому це важливо:<\/b> межа між захистом і атакою розмита. Компанії страхуються ширшими блокуваннями, а дослідники переходять на локальні моделі.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1400px;font-size:24px;color:#A8A39B\">Джерела: aicoder.com, mezha.net, github.com/morluto/rea · дані з соцмереж, не підтверджені компаніями<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#A8A39B\">11<\/p>\n<aside class=\"notes\">REA (Reverse Engineer Anything) — інструмент, що дає ШІ-агентам розбирати будь-які програми аж до машинного коду; за тиждень він набрав +55,9 тис. зірок на GitHub. 21 жовтня дослідник під ніком log4j опублікував розбір свого телевізора Samsung: за його словами, ПЗ класифікує звуки, робить знімки екрана й відстежує перегляд для реклами (Samsung це не коментувала). Потім він повідомив, що OpenAI заблокувала його акаунт за «кіберзловживання», хоча робота була локальною. 23 жовтня пости «Anthropic тихо вбила REA» зібрали понад мільйон переглядів. Важливо: це повідомлення користувачів; офіційних заяв Anthropic чи OpenAI немає, частина людей пише, що REA у них працює. Нова редакція політики використання Anthropic (з 12 листопада 2026) прямо зазначає, що дослідження безпеки власних систем не заборонені. Джерела: https://aicoder.com/news/news-20261025-x-discussion-claude-rea-reverse-engineering-blocked ; https://mezha.net/eng/news/mezha-bfcfc1a9d863abac108b8ee7_researcher_says_samsung/ ; https://github.com/morluto/rea/discussions/2304<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s09\" data-transition=\"fade\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136p px;line-height:1.4;color:#9DA7B3\">зірок за тиждень · 64,9 тис. загалом<\/p>\n<hr style=\"border-top:1px solid #30363D\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#3FB950\">Чому це важливо<\/p>\n<p style=\"font-size:24px;line-height:1.4;color:#E6EDF3\">Агенти-кодери стають універсальними асистентами: той самий Claude Code веде пошук роботи, а не лише пише програми.<\/p>\n<\/div>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:192px;top:850px;width:960px;height:52px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent;font:500 24px ui-monospace,Menlo,Consolas,monospace;color:#3FB950;line-height:52px;white-space:nowrap&quot;&gt;&lt;span id=&quot;t&quot;&gt;&lt;/span&gt;&lt;span id=&quot;k&quot; style=&quot;display:inline-block;width:13px;height:26px;background:#3FB950;vertical-align:middle;margin-left:2px&quot;&gt;&lt;/span&gt;&lt;script&gt;\nconst s=&#x27;$ git clone https://github.com/ai-job-search-dev/ai-job-search&#x27;;const t=document.getElementById(&#x27;t&#x27;),k=document.getElementById(&#x27;k&#x27;);let i=0;\nsetInterval(()=&gt;{i=i&gt;s.length+25?0:i+1;t.textContent=s.slice(0,i)},70);setInterval(()=&gt;{k.style.opacity=k.style.opacity===&#x27;0&#x27;?&#x27;1&#x27;:&#x27;0&#x27;},500);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#9DA7B3\">Джерела: aitoolly.com, gittrend.io<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:120px;font-size:24px;text-align:right;color:#9DA7B3\">18<\/p>\n<aside class=\"notes\">ai-job-search — відкритий фреймворк, побудований поверх Claude Code. Він проходить з вами весь цикл пошуку роботи: фільтрує вакансії за вашими критеріями, переписує резюме під конкретну позицію, складає супровідні листи і допомагає готуватися до співбесід. Працює локально, тому особисті дані не потрапляють на сторонні платформи. Джерела: https://aitoolly.com/ai-news/article/2026-10-21-ai-job-search-an-open-source-job-application-framework-built-on-claude-code ; https://gittrend.io/weekly/2026-W43<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"g04\" data-transition=\"push\" style=\"background:#0D1117;color:#E6EDF3;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;height:792px;background:#161B22;border:1px solid #30363D;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,0.45)\"><\/div>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;height:72px;display:flex;align-items:center;gap:14px;background:#1C2129;border-bottom:1px solid #30363D;border-radius:20px 20px 0px 0px;padding:0px 28px\">\n<div style=\"width:18px;height:18px;background:#FF5F57;border-radius:50%\"><\/div>\n<div style=\"width:18px;height:18px;background:#FEBC2E;border-radius:50%\"><\/div>\n<div style=\"width:18px;height:18px;background:#28C840;border-radius:50%\"><\/div>\n<p style=\"font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#9DA7B3;padding:0px 16px\">github.com/DietrichGebert/ponytail<\/p>\n<div style=\"flex:1\"><\/div>\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#E3B341;width:28px;height:28px\"><polygon fill=\"currentColor\" points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/><\/svg>\n<p style=\"font-size:24px;font-weight:800;color:#E3B341\">№3 · 3 / 5<\/p>\n<\/div>\n<h2 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:192px;top:236px;width:960px;font-family:'JetBrains Mono', 'Courier New', monospace;font-size:48px;font-weight:700;line-height:1.15;color:#E6EDF3\">DietrichGebert/ponytail<\/h2>\n<p data-build-in=\"rise 3 auto\" style=\"position:absolute;left:192px;top:310px;width:960px;font-size:28px;font-weight:600;line-height:1.4;color:#58A6FF\">«Лінивий сеньйор»: правила, що вчать агентів писати менше коду<\/p>\n<div data-build-in=\"left 4 auto\" style=\"position:absolute;left:192px;top:420px;width:960px;display:flex;flex-direction:column;gap:26px\">\n<p style=\"font-size:28px;line-height:1.4;color:#C9D1D9\"><span style=\"color:#3FB950\"><b>Що це:<\/b><\/span> набір правил для агентів-кодерів — найменше правильне рішення без шкоди для безпеки й перевірок<\/p>\n<p style=\"font-size:28px;line-height:1.4;color:#C9D1D9\"><span style=\"color:#3FB950\"><b>Як працює:<\/b><\/span> 7 сходинок — чи потрібна функція, чи вона вже є в коді, бібліотеці, платформі — і лише потім новий код<\/p>\n<p style=\"font-size:28px;line-height:1.4;color:#C9D1D9\"><span style=\"color:#3FB950\"><b>Кому:<\/b><\/span> розробникам на Claude Code, Codex та інших; у тесті автора — на 54% менше коду й на 20% дешевше<\/p>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:1200px;top:236px;width:528px;display:flex;flex-direction:column;gap:14px;background:#0D1117;border:1px solid #30363D;border-radius:16px;padding:36px\">\n<svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#E3B341;width:56px;height:56px\"><polygon fill=\"currentColor\" points=\"12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\"/><\/svg>\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:48px;font-weight:700;line-height:1.1;color:#E3B341\">+8,5 тис.<\/p>\n<p style=\"font-size:24px;line-height:1.4;color:#9DA7B3\">зірок за тиждень · 175,6 тис. загалом<\/p>\n<hr style=\"border-top:1px solid #30363D\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#3FB950\">Чому це важливо<\/p>\n<p style=\"font-size:24px;line-height:1.4;color:#E6EDF3\">Більше коду — більше багів і витрат. Тренд тижня: вчити агентів робити менше, але краще.<\/p>\n<\/div>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:192px;top:850px;width:960px;height:52px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent;font:500 24px ui-monospace,Menlo,Consolas,monospace;color:#3FB950;line-height:52px;white-space:nowrap&quot;&gt;&lt;span id=&quot;t&quot;&gt;&lt;/span&gt;&lt;span id=&quot;k&quot; style=&quot;display:inline-block;width:13px;height:26px;background:#3FB950;vertical-align:middle;margin-left:2px&quot;&gt;&lt;/span&gt;&lt;script&gt;\nconst s=&#x27;$ git clone https://github.com/DietrichGebert/ponytail&#x27;;const t=document.getElementById(&#x27;t&#x27;),k=document.getElementById(&#x27;k&#x27;);let i=0;\nsetInterval(()=&gt;{i=i&gt;s.length+25?0:i+1;t.textContent=s.slice(0,i)},70);setInterval(()=&gt;{k.style.opacity=k.style.opacity===&#x27;0&#x27;?&#x27;1&#x27;:&#x27;0&#x27;},500);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#9DA7B3\">Джерела: flaviocopes.com, gittrend.io<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:120px;font-size:24px;text-align:right;color:#9DA7B3\">19<\/p>\n<aside class=\"notes\">Ponytail від Дітріха Гебера — правила «лінивого сеньйора» для агентів-кодерів. Агент проходить сходинки: чи справді потрібна функція, чи вже є подібний код у проєкті, у стандартній бібліотеці, у самій платформі, у встановлених залежностях, чи вистачить одного рядка — і лише наприкінці пише мінімальний новий код. Валідація, обробка помилок і безпека залишаються. У тесті автора на 12 задачах: на 54% менше доданих рядків, на 22% менше токенів, на 20% дешевше — але це один репозиторій і одна модель,   <div class="ptop"><button class="pb" id="pback">← Бібліотека</button><span class="ptitle" id="ptitle"></span></div>
  <div id="phint">← → або пробіл — гортати · F — повний екран · N — нотатки · Esc — до бібліотеки</div>
  <div class="pctl"><button class="pb" id="pprev" aria-label="Попередній слайд">←</button><span class="ptitle" id="pcount"></span><button class="pb" id="pnext" aria-label="Наступний слайд">→</button><button class="pb" id="pnotesBtn">Нотатки</button><button class="pb" id="pfs">⛶ Повний екран</button></div>
  <div id="pnotes" hidden></div>
  <div id="pbar"></div>
</div>

<script>
const EMB=JSON.parse(document.getElementById('emb').textContent);
(function(){
const TL={models:'Моделі та продукти',business:'Бізнес',security:'Безпека і регулювання',practice:'Практика',github:'GitHub'};
const PV_IDS=['cover','numbers','m01','b04','s07','p10','g-chart','final'];
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=[],query='';
const frag={};

function tcolor(k){return 'var(--t-'+k+')'}
function isRepo(s){return /^g0\d/.test(s.id)}
function isNews(s){return ['models','business','security','practice'].includes(s.topic)}
function hl(text,q){if(!q)return esc(text);const i=text.toLowerCase().indexOf(q);if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function matches(s){return s.topic!=='intro'&&(!query||(s.title+' '+s.text).toLowerCase().includes(query))}

function renderResults(){
  const box=$('#results');
  if(!query){box.hidden=true;box.innerHTML='';return;}
  const rows=[];DATA.forEach(i=>i.slides.forEach(s=>{if(matches(s)&&(isNews(s)||isRepo(s)))rows.push([i,s]);}));
  box.hidden=false;
  box.innerHTML=`<h3>Знайдено: ${rows.length}</h3>`+(rows.length?rows.map(([i,s])=>{
    const tk=isRepo(s)?'github':s.topic;
    return `<button class="res" data-i="${i.id}" data-n="${s.n}"><span class="pill" style="background:${tcolor(tk)}">${esc(TL[tk])}</span><span><span class="t">${hl(s.title,query)}</span><br><span class="s">Тиждень ${i.week} · ${esc(i.dates)} · слайд ${s.n}</span></span><span class="s">Відкрити →</span></button>`}).join(''):`<div class="empty">Нічого не знайдено. Спробуйте інше слово, наприклад «OpenAI» або «безпека».</div>`);
  box.querySelectorAll('.res').forEach(b=>b.onclick=()=>go(b.dataset.i,+b.dataset.n));
}

function renderGrid(){
  stopAllPreviews();previews.clear();
  const list=DATA.filter(i=>!query||i.slides.some(matches));
  $('#grid').innerHTML=list.map(i=>{
    const isNew=i.id===DATA[0].id;
    return `<article class="card">
      <button class="pv-wrap" data-open="${i.id}" aria-label="Відкрити показ: ${esc(i.title)}"><div class="pv-inner anim">${i.cover}</div><span class="play">▶ Показ</span><span class="pvbar"></span></button>
      <div class="card-body">
        <div class="meta"><span class="wk">Тиждень ${i.week}</span><span>${esc(i.dates)}</span>${isNew?'<span class="new">Новий</span>':''}</div>
        <h2>${esc(i.title)}</h2>
        <div class="counts">${i.newsCount} новин · ${i.repoCount} репозиторіїв · ${i.slideCount} слайди</div>
        <div class="actions"><button class="btn" data-open="${i.id}">▶ Відкрити показ</button></div>
      </div></article>`}).join('');
  $('#grid').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(b.dataset.open,1));
  $('#grid').querySelectorAll('.pv-wrap').forEach(w=>{const i=DATA.find(x=>x.id===w.dataset.open);const st={wrap:w,inner:w.querySelector('.pv-inner'),bar:w.querySelector('.pvbar'),issue:i,slides:null,cur:-1,timer:null,visible:false};previews.set(w,st);io.observe(w);});
  scalePreviews();
  setTimeout(()=>previews.forEach(st=>{const r=st.wrap.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight){st.visible=true;startPv(st);}}),600);
}

function scalePreviews(){document.querySelectorAll('.pv-wrap').forEach(w=>{const k=w.clientWidth/1920;w.firstElementChild.style.transform='scale('+k+')';});}
addEventListener('resize',()=>{scalePreviews();fit();});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim().toLowerCase();renderResults();renderGrid();},150);});

/* ---------- shared helpers ---------- */
function embeds(s,on){s.querySelectorAll('iframe.embed').forEach(f=>{if(on){if(!f.getAttribute('srcdoc'))f.setAttribute('srcdoc',f.dataset.srcdoc)}else f.removeAttribute('srcdoc')})}
function prepBuilds(list){list.forEach(s=>s.querySelectorAll('[data-build-in]').forEach(el=>{const p=el.getAttribute('data-build-in').trim().split(/\s+/);const ord=parseInt(p.find(x=>/^\d+$/.test(x))||'1',10);el.style.animationName='b-'+(p[0]||'fade');el.style.animationDelay=(0.35+(ord-1)*0.32)+'s';}))}
async function load(id){
  if(frag[id])return frag[id];
  const i=DATA.find(x=>x.id===id);if(!i)throw new Error('no issue');
  return frag[id]=EMB.frags[i.file];
}

/* ---------- animated previews ---------- */
const previews=new Map();
const io=new IntersectionObserver(es=>es.forEach(e=>{const st=previews.get(e.target);if(!st)return;st.visible=e.isIntersecting;if(e.isIntersecting)startPv(st);else stopPv(st);}),{threshold:.3});
async function startPv(st){
  if(!player.hidden||st.timer)return;
  if(!st.slides){
    let html;try{html=await load(st.issue.id);}catch(e){return;}
    if(!previews.has(st.wrap))return;
    const t=document.createElement('template');t.innerHTML=html;
    const all=[...t.content.querySelectorAll('section.slide')];
    const pick=PV_IDS.map(id=>all.find(s=>s.id===id)).filter(Boolean);
    pick.forEach(s=>{s.removeAttribute('id');s.querySelectorAll('.notes').forEach(n=>n.remove());});
    prepBuilds(pick);st.inner.innerHTML='';pick.forEach(s=>st.inner.appendChild(s));st.slides=pick;st.cur=-1;
  }
  if(!st.visible||!player.hidden||st.timer)return;
  pvShow(st,st.cur<0?0:st.cur,true);
  st.timer=setInterval(()=>pvShow(st,(st.cur+1)%st.slides.length),3600);
}
function pvShow(st,n,restart){
  const next=st.slides[n],prev=st.cur>=0?st.slides[st.cur]:null;
  if(prev===next&&!restart)return;
  if(prev&&prev!==next){prev.classList.add('t-fade-out');setTimeout(()=>{prev.classList.remove('active','built','t-fade-out');embeds(prev,false);},720);}
  next.classList.remove('built','t-fade-in');next.classList.add('active');embeds(next,true);
  void next.offsetWidth;next.classList.add('built');if(prev&&prev!==next)next.classList.add('t-fade-in');
  setTimeout(()=>next.classList.remove('t-fade-in'),720);
  st.cur=n;st.bar.style.width=((n+1)/st.slides.length*100)+'%';
}
function stopPv(st){if(st.timer){clearInterval(st.timer);st.timer=null;}if(st.slides)st.slides.forEach(s=>embeds(s,false));}
function stopAllPreviews(){previews.forEach(stopPv);}
function resumePreviews(){previews.forEach(st=>{if(st.visible)startPv(st);});}

/* ---------- player ---------- */
const player=$('#player'),stage=$('#stage');
let S=[],cur=-1,busy=false,openId=null;
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+k+')';}
function ui(){const N=S.length;$('#pbar').style.width=((cur+1)/N*100)+'%';$('#pcount').textContent=(cur+1)+' / '+N;const a=S[cur].querySelector('.notes');$('#pnotes').textContent=a?a.textContent:'';history.replaceState(null,'','#'+openId+'-'+(cur+1));}
function show(n,dir){
  const N=S.length;if(n<0||n>=N||n===cur||busy)return;
  const next=S[n];
  if(cur<0){cur=n;next.classList.add('active');embeds(next,true);requestAnimationFrame(()=>next.classList.add('built'));ui();return;}
  const prev=S[cur];const t=((dir>0?prev:next).dataset.transition)||'fade';const kind=t==='push'?'push':'fade';
  busy=true;next.classList.remove('built');next.classList.add('active');embeds(next,true);
  const inC=kind==='push'?(dir>0?'t-push-in-f':'t-push-in-b'):'t-fade-in';const outC=kind==='push'?(dir>0?'t-push-out-f':'t-push-out-b'):'t-fade-out';
  void next.offsetWidth;next.classList.add(inC,'built');prev.classList.add(outC);cur=n;ui();
  setTimeout(()=>{prev.classList.remove('active','built',outC);next.classList.remove(inC);embeds(prev,false);busy=false;},720);
}
async function openIssue(id,n){
  const i=DATA.find(x=>x.id===id);if(!i){closePlayer();return;}
  stopAllPreviews();
  if(openId!==id){
    let html;try{html=await load(id);}catch(e){showErr('Не вдалося завантажити випуск «'+i.title+'». Оновіть сторінку й спробуйте ще раз.');return;}
    stage.innerHTML=html;S=[...stage.querySelectorAll('.slide')];prepBuilds(S);cur=-1;openId=id;busy=false;
    $('#ptitle').textContent=i.title;
  }
  player.hidden=false;document.body.classList.add('playing');fit();
  const k=Math.max(0,Math.min(S.length-1,(n||1)-1));
  if(cur<0)show(k,1);else if(k!==cur)show(k,k>cur?1:-1);
  $('#phint').style.opacity=1;setTimeout(()=>{$('#phint').style.opacity=0},4000);
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}
function closePlayer(){
  if(document.fullscreenElement){try{document.exitFullscreen()}catch(e){}}
  S.forEach(s=>embeds(s,false));stage.innerHTML='';S=[];cur=-1;openId=null;
  player.hidden=true;document.body.classList.remove('playing');$('#pnotes').hidden=true;
  scalePreviews();resumePreviews();
}
function go(id,n){location.hash=id+'-'+n;}
function toLibrary(){history.replaceState(null,'',location.pathname+location.search);closePlayer();}
function step(d){show(cur+d,d)}
function fs(){try{if(!document.fullscreenElement)player.requestFullscreen().catch(()=>{});else document.exitFullscreen();}catch(e){}}
$('#pback').onclick=toLibrary;$('#pprev').onclick=()=>step(-1);$('#pnext').onclick=()=>step(1);$('#pfs').onclick=fs;
$('#pnotesBtn').onclick=()=>{$('#pnotes').hidden=!$('#pnotes').hidden};
stage.addEventListener('click',e=>{step(e.clientX>innerWidth/3?1:-1)});
addEventListener('keydown',e=>{
  if(player.hidden)return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)&&!e.target.closest('button')){e.preventDefault();step(1)}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();step(-1)}
  else if(e.key==='Home')show(0,-1);else if(e.key==='End')show(S.length-1,1);
  else if('fFаА'.includes(e.key))fs();
  else if('nNтТ'.includes(e.key)){$('#pnotes').hidden=!$('#pnotes').hidden}
  else if(e.key==='Escape'&&!document.fullscreenElement)toLibrary();
});
let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)step(dx<0?1:-1);tx=null});

function route(){
  const m=location.hash.slice(1).match(/^(w\d+)(?:-(\d+))?$/);
  if(m)openIssue(m[1],m[2]?+m[2]:1);else if(!player.hidden)closePlayer();
}
addEventListener('hashchange',route);
function showErr(t){const e=$('#err');e.style.display='block';e.textContent=t;}

Promise.resolve(EMB.manifest).then(d=>{
  DATA=d.issues.sort((a,b)=>b.start.localeCompare(a.start));
  renderResults();renderGrid();route();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scalePreviews);
}).catch(()=>showErr('Не вдалося завантажити список випусків. Оновіть сторінку.'));
})();
</script>

</body>
</html>
