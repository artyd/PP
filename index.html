<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бібліотека дайджестів ШІ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Unbounded:wght@500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout idea: brand header → search → equal issue cards whose previews play the deck in miniature; player opens full-window over the library. */
:root{
  --bg:#F3F4F8; --surface:#FCFCFE; --ink:#121A33; --muted:#59627A; --line:#DFE3EC; --accent:#C2410C; --accent-fill:#FF7A1A;
  --t-models:#3D5AFE; --t-business:#087563; --t-security:#C2410C; --t-practice:#6D28D9; --t-github:#1F7A35;
  --display:'Unbounded', Verdana, sans-serif; --body:'Manrope', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1020; --surface:#151B2E; --ink:#EEF1F8; --muted:#A3ACC3; --line:#283049; --accent:#FF9A55; --accent-fill:#FF7A1A;
    --t-models:#8EA0FF; --t-business:#3CC4A8; --t-security:#FB923C; --t-practice:#B39BFA; --t-github:#4AC965;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#151B2E; --ink:#EEF1F8; --muted:#A3ACC3; --line:#283049; --accent:#FF9A55; --accent-fill:#FF7A1A;
  --t-models:#8EA0FF; --t-business:#3CC4A8; --t-security:#FB923C; --t-practice:#B39BFA; --t-github:#4AC965;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body.playing{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-fill);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
.mono{width:44px;height:44px;border-radius:10px;background:#121A33;color:#FF8A3D;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;flex:none;box-shadow:inset 0 -4px 0 #FF7A1A}
.brand b{display:block;font-weight:800;letter-spacing:.06em;font-size:15px}
.brand span{display:block;color:var(--muted);font-size:13px}
.top .sp{flex:1}
.top .note{font-size:13px;color:var(--muted)}

/* search */
.toolbar{margin:28px 0 20px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:13px 0;outline:none;min-width:0}

/* results */
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:24px;overflow:hidden}
.results h3{margin:0;padding:14px 18px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700}
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.res:last-child{border-bottom:0}
.res:hover{background:color-mix(in srgb, var(--accent-fill) 7%, transparent)}
.res .t{font-weight:700}
.res .s{color:var(--muted);font-size:14px}
.res mark{background:color-mix(in srgb, var(--accent-fill) 30%, transparent);color:inherit;border-radius:3px;padding:0 2px}
.pill{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff;white-space:nowrap}
.empty{padding:18px;color:var(--muted)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pv-wrap{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border:0;padding:0;cursor:pointer;display:block;width:100%;background:#121A33}
.pv-inner{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;pointer-events:none;overflow:hidden}
.pv-wrap .play{position:absolute;right:14px;bottom:16px;background:rgba(18,26,51,.85);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;transition:transform .2s}
.pv-wrap:hover .play{transform:scale(1.06)}
.pvbar{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#3D5AFE,#FF7A1A);transition:width .6s ease}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted);min-height:26px}
.wk{font-family:var(--display);font-weight:700;color:var(--accent);font-size:13px}
.new{background:var(--accent-fill);color:#121A33;font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px}
.card h2{margin:0;font-size:21px;line-height:1.25;text-wrap:balance}
.counts{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.btn{border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px 0 28px}
#err{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:24px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.top .note{display:none}}

/* shared slide rendering (preview + player) */
.slide,.pv{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;font-family:'Manrope',Arial,sans-serif;line-height:normal}
.slide h1,.slide h2,.slide h3,.slide p,.pv h1,.pv h2,.pv h3,.pv p{margin:0}
.slide h1,.pv h1{font-size:96px;font-weight:600;line-height:1.1}
.slide h2,.pv h2{font-size:64px;font-weight:600;line-height:1.15}
.slide h3,.pv h3{font-size:44px;font-weight:600;line-height:1.2}
.slide p,.pv p{font-size:32px;line-height:1.4}
.slide hr,.pv hr{margin:0;border:0;width:100%}
.slide .ico,.pv .ico{display:block;flex:none}
.notes{display:none}
.anim .slide{visibility:hidden}
.anim .slide.active{visibility:visible}
.anim .embed{display:block;background:transparent}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes pushInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOutL{from{transform:none}to{transform:translateX(-100%)}}
@keyframes pushInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes pushOutR{from{transform:none}to{transform:translateX(100%)}}
.t-fade-in{animation:fadeIn .7s ease both;z-index:2}
.t-fade-out{animation:fadeOut .7s ease both;z-index:1}
.t-push-in-f{animation:pushInR .7s cubic-bezier(.65,0,.35,1) both;z-index:2}
.t-push-out-f{animation:pushOutL .7s cubic-bezier(.65,0,.35,1) both;z-index:1}
.t-push-in-b{animation:pushInL .7s cubic-bezier(.65,0,.35,1) both;z-index:2}
.t-push-out-b{animation:pushOutR .7s cubic-bezier(.65,0,.35,1) both;z-index:1}
@keyframes b-fade{from{opacity:0}to{opacity:1}}
@keyframes b-rise{from{opacity:0;translate:0 48px}to{opacity:1;translate:0 0}}
@keyframes b-drop{from{opacity:0;translate:0 -48px}to{opacity:1;translate:0 0}}
@keyframes b-left{from{opacity:0;translate:-90px 0}to{opacity:1;translate:0 0}}
@keyframes b-right{from{opacity:0;translate:90px 0}to{opacity:1;translate:0 0}}
@keyframes b-pop{0%{opacity:0;scale:.8}70%{opacity:1;scale:1.04}100%{opacity:1;scale:1}}
@keyframes b-scale{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.anim .slide [data-build-in]{opacity:0}
.anim .slide.built [data-build-in]{animation-duration:.75s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
@media (prefers-reduced-motion: reduce){
  #stage .slide [data-build-in]{opacity:1}
  #stage .slide.built [data-build-in]{animation:none!important}
  .t-fade-in,.t-fade-out,.t-push-in-f,.t-push-out-f,.t-push-in-b,.t-push-out-b{animation-duration:.01s!important}
}

/* player */
#player{position:fixed;inset:0;background:#05070D;z-index:50}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#05070D}
.ptop{position:fixed;left:calc(14px + env(safe-area-inset-left, 0px));top:calc(12px + env(safe-area-inset-top, 0px));display:flex;gap:10px;align-items:center;z-index:60}
.pctl{position:fixed;right:calc(14px + env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:8px;align-items:center;z-index:60;opacity:.25;transition:opacity .25s}
.pctl:hover,.pctl:focus-within,.ptop:hover{opacity:1}
.pb{font:600 14px Manrope,Arial,sans-serif;color:#E6EDF3;background:rgba(20,26,40,.82);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 12px;cursor:pointer}
.ptitle{font:600 14px Manrope,Arial,sans-serif;color:#C9D1E6;background:rgba(20,26,40,.6);border-radius:9px;padding:8px 12px}
#pbar{position:fixed;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#3D5AFE,#FF7A1A);transition:width .5s ease;z-index:60}
#pnotes{position:fixed;left:16px;right:16px;bottom:62px;max-height:32vh;overflow:auto;background:rgba(10,14,24,.94);color:#E6EDF3;font:16px/1.55 Manrope,Arial,sans-serif;padding:16px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.15);z-index:61}
#phint{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top, 0px));transform:translateX(-50%);background:rgba(10,14,24,.85);color:#E6EDF3;font:14px Manrope,Arial,sans-serif;padding:8px 16px;border-radius:999px;z-index:60;transition:opacity 1s;white-space:nowrap}
@media (max-width:700px){#phint{display:none}}
</style>
</head>

xt": "План огляду Про що поговоримо 01–03 Моделі та продукти Images 2.6, Cursor-застосунки, відкриття Claude 04–06 Бізнес і гроші $11 млрд OpenAI, звітність Anthropic, обвал акцій 07–09 Безпека і регулювання 948 дір у Linux, звіт METR, референдуми про ЦОДи 10–11 Практика Revolut економить 90%, ШІ і скорочення Top 5 GitHub: новинки тижня Свіжі репозиторії з найбільшим приростом зірок 2"}, {"n": 3, "id": "numbers", "topic": "intro", "title": "Тиждень у цифрах", "text": "Коротко Тиждень у цифрах $1,25 трлн оцінка OpenAI після нового раунду на $11 млрд $17 млрд виручка Anthropic за III квартал — у ~12 разів більше, ніж рік тому 948 вразливостей у ядрі Linux знайшов ШІ-конвеєр OpenAI 40 з 41 місцевих референдумів у США — за обмеження дата-центрів 3"}, {"n": 4, "id": "m01", "topic": "models", "title": "OpenAI випустила Images 2.6: GIF-анімації та генерація на 50% швидша", "text": "Моделі та продукти 4 листопада 01 / 11 OpenAI випустила Images 2.6: GIF-анімації та генерація на 50% швидша Зображення генеруються на 50% швидше; модель Flare — усього за ~6 секунд ChatGPT і Codex створюють анімовані GIF з промпту або фото, кожен кадр можна редагувати Модель Sunburst — для точних правок і експорту у векторний SVG 4 млрд зображень на тиждень генерують ChatGPT і API Чому це важливо Картинки й анімації для соцмереж, банерів і презентацій стають щоденним інструментом без дизайнерських програм. Джерела: aiweekly.co, openai.com 4"}, {"n": 5, "id": "m02", "topic": "models", "title": "Cursor тепер не лише пише код, а й запускає готовий вебзастосунок", "text": "Моделі та продукти 5 листопада 02 / 11 Cursor тепер не лише пише код, а й запускає готовий вебзастосунок Агент збирає застосунок за промптом: база Postgres, вхід через SSO, хостинг і живе посилання Перед публікацією — автоматичні перевірки безпеки, наприклад на ключі й паролі в коді Адміни команди бачать усі застосунки, затверджують публікації й можуть їх зняти 1 промпт від ідеї до робочого застосунку з посиланням Чому це важливо Внутрішні інструменти для відділу можна зібрати за години. Але потрібні правила: хто і що публікує. Джерело: cursor.com/changelog 5"}, {"n": 6, "id": "m03", "topic": "models", "title": "Claude допоміг знайти в бактеріях загадкові білкові «сховища»", "text": "Моделі та продукти 4 листопада 03 / 11 Claude допоміг знайти в бактеріях загадкові білкові «сховища» Переглянув ~15 млрд передбачених білків і знайшов родичів vault-білка у 29 типах бактерій З 15 перевірених білків 7 зібралися у «сховища»; кріоелектронна мікроскопія підтвердила 4 Очищення білка — 90 хвилин замість ~3 днів, перша 3D-модель — за 34 години 15 млрд білків переглянув Claude у пошуку кандидатів Чому це важливо ШІ стає учасником лабораторних досліджень. Звіт чесно описує й помилки Claude, які коштували команді тижні. Джерело: anthropic.com 6"}, {"n": 7, "id": "b04", "topic": "business", "title": "OpenAI залучила $11 млрд при оцінці $1,25 трлн", "text": "Бізнес і гроші 6 листопада 04 / 11 $1,25 трлн оцінка OpenAI після першої частини нового раунду OpenAI залучила $11 млрд при оцінці $1,25 трлн Це перша частина раунду, загалом він може сягнути $20 млрд (Bloomberg) За повідомленнями ЗМІ, раніше компанія цілилася у $30 млрд при оцінці $1,4 трлн 5 листопада OpenAI пообіцяла сама платити за енергію та інфраструктуру своїх кампусів Чому це важливо Інвестори й далі фінансують гонку ШІ, але обережніше: зібрано менше, ніж планувалося. Джерела: gvwire.com (Reuters / Bloomberg), siliconreport.com 7"}, {"n": 8, "id": "b05", "topic": "business", "title": "Anthropic показала звітність перед IPO: $17 млрд виручки за квартал", "text": "Бізнес і гроші 2 листопада 05 / 11 $17 млрд виручка Anthropic за III квартал 2026 Anthropic показала звітність перед IPO: $17 млрд виручки за квартал Виручка в III кварталі — майже $17 млрд, приблизно у 12 разів більше, ніж рік тому Операційний збиток $567 млн після прибутку в II кварталі — через дорогі обчислення Зобов’язання на ~$895 млрд, майже все — обчислення й інфраструктура (Broadcom, Google, Amazon) Чому це важливо IPO під тикером ANT планується на Nasdaq до кінця листопада; інвестори обговорюють оцінку $1,4–1,5 трлн. Джерело: thenextweb.com 8"}, {"n": 9, "id": "b06", "topic": "business", "title": "Найгірший день для акцій ШІ з квітня 2025: Nasdaq упав на 5,5%", "text": "Бізнес і гроші 5 листопада 06 / 11 −5,5% падіння Nasdaq Composite за один день Найгірший день для акцій ШІ з квітня 2025: Nasdaq упав на 5,5% Nvidia −9,3%, AMD −17,3%, CoreWeave −9,8%: лідирували компанії, пов’язані з будівництвом дата-центрів S&P 500 знизився на 4,4%, а Nasdaq опинився на 11,9% нижче свого рекорду — це «корекція» Причини: дорожчі кредити, страх «бульбашки» та ризик пауз у будівництві дата-центрів Чому це важливо Ринок уперше так різко засумнівався, що витрати на ШІ-інфраструктуру швидко окупляться. Джерело: wsmv.com (Associated Press) 9"}, {"n": 10, "id": "s07", "topic": "security", "title": "948 вразливостей у ядрі Linux: ШІ-конвеєр OpenAI знайшов їх і запропонував латки", "text": "Безпека і регулювання 4–5 листопада 07 / 11 948 вразливостей у ядрі Linux: ШІ-конвеєр OpenAI знайшов їх і запропонував латки Агенти шукають помилку, відтворюють її, пишуть експлойт і латку; люди перевіряють усе перед передачею розробникам Прогін коштував $1,2 млн — близько $1 279 за вразливість; 61 уже виправлено в основній гілці ядра 5 листопада OpenAI відкрила модель GPT-6 Cyber лише перевіреним клієнтам — із рейтингом ризику «критичний» 948 вразливостей з робочими експлойтами Чому це важливо: захисники отримують потужний інструмент, але й ціна атаки падає. Вчасні оновлення стають ще важливі"}, {"n": 11, "id": "s08", "topic": "security", "title": "METR: Anthropic покращує моделі вдвічі швидше — і ШІ, схоже, допомагає сам собі", "text": "Безпека і регулювання 5 листопада 08 / 11 METR: Anthropic покращує моделі вдвічі швидше — і ШІ, схоже, допомагає сам собі Незалежна організація METR вивчила 11 тижнів внутрішніх даних Anthropic і поспілкувалася з її співробітниками Висновок: прогрес на чітко поставлених задачах удвічі швидший, ніж рік тому; ймовірна причина — ШІ в дослідженнях Застереження: частину даних засекречено, а прискорення може стосуватися лише задач, які легко оцінити ×2 швидше покращуються моделі, ніж рік тому Чому це важливо: це перша незалежна оцінка «самоприскорення» ШІ. Регулятори й інвестори уважно стежитимуть з"}, {"n": 12, "id": "s09", "topic": "security", "title": "Жителі США підтримали обмеження дата-центрів у 40 з 41 місцевих голосувань", "text": "Безпека і регулювання 3 листопада 09 / 11 Жителі США підтримали обмеження дата-центрів у 40 з 41 місцевих голосувань 41 голосування в 10 штатах; 21 — в Огайо, де кілька громад повністю заборонили нові дата-центри За опитуванням CNBC, для 56% виборців дата-центри були важливим чинником під час голосування OpenAI у відповідь пообіцяла сама оплачувати електроенергію та інфраструктуру своїх кампусів 40 з 41 голосування — за обмеження Чому це важливо: головним обмеженням ШІ стають не чипи, а згода місцевих громад: енергія, вода й тарифи стають політикою. Джерела: baxtel.com (дані Ballotpedia), badg"}, {"n": 13, "id": "p10", "topic": "practice", "title": "Revolut перейшов на власні сервери з китайською моделлю GLM і зекономив до 90%", "text": "Практика 4 листопада 10 / 11 Revolut перейшов на власні сервери з китайською моделлю GLM і зекономив до 90% −90% витрат на ШІ-кодинг менш ніж за рік Відкриті моделі на власних серверах — реальна альтернатива дорогим підпискам, коли запитів дуже багато. 1 Моделі GLM від Z.ai на 56 GPU Nvidia B200: ~$0,30 за 1 млн токенів, у ~10 разів дешевше комерційних 2 Компанія повідомляє про +70% продуктивності за часом виконання й +60% за часом написання коду 3 Інші теж рахують: Apple скоротила денний ліміт на ШІ-інструменти для частини інженерів з $300 до $200 Джерела: techradar.com, mindandmachineweekly."}, {"n": 14, "id": "p11", "topic": "practice", "title": "ШІ назвали причиною лише 3% жовтневих скорочень у США — мінімум за рік", "text": "Практика 5 листопада 11 / 11 ШІ назвали причиною лише 3% жовтневих скорочень у США — мінімум за рік 1 265 скорочень через ШІ в жовтні Масової заміни людей ШІ поки не видно в статистиці: економіка важить більше. Але ШІ змінює зміст роботи. 1 З 43 994 оголошених у жовтні скорочень на ШІ припадає менше 3% 2 З початку року — 121 401 скорочення через ШІ: близько 20% усіх і вдвічі більше, ніж у 2025-му 3 Пік був у травні (38 579), тепер головна причина — ринкові та економічні умови Джерело: Challenger, Gray & Christmas (через badgoodbetter.substack.com) 14"}, {"n": 15, "id": "repos-intro", "topic": "github", "title": "GitHub: новинки тижня", "text": "Розділ 2 · Відкритий код GitHub: новинки тижня Тиждень 2–8 листопада 2026 · нові проєкти з рейтингу gittrend.io 15"}, {"n": 16, "id": "g-chart", "topic": "github", "title": "Нові ШІ-репозиторії тижня", "text": "$ git trending --since=weekly --new --topic=ai Нові ШІ-репозиторії тижня deepseek-ai/dsh-superagent-prototype +12,9 тис. vercel-labs/agent-desktop +11,9 тис. NVIDIA/auto-ontology +9,1 тис. cactus-compute/cactus +8,4 тис. heydamir/unslop +6,5 тис. Приріст зірок за 2–8.11.2026 · gittrend.io · REA (+22,2 тис.) знову №1 — див. жовтневий випуск 16"}, {"n": 17, "id": "g01", "topic": "github", "title": "deepseek-ai/dsh-superagent-prototype", "text": "github.com/deepseek-ai/dsh-superagent-prototype №1 · 1 / 5 · новинка deepseek-ai/dsh-superagent-prototype Прототип DeepSeek: рій агентів сам розбирає завдання з GitHub Що це: дослідницький прототип DeepSeek (MIT): координатор ділить завдання між агентами, що працюють паралельно Як працює: агент бачить баг у чаті чи issue, відтворює його, пробує виправити й надсилає зміну людині на перевірку Кому: командам розробки; це не офіційний продукт, частина ідей зі статті ще не реалізована +12,9 тис. зірок за тиждень · 21,1 тис. загалом Чому це важливо Вузьким місцем стає не ШІ, а увага людини: агенти б"}, {"n": 18, "id": "g02", "topic": "github", "title": "vercel-labs/agent-desktop", "text": "github.com/vercel-labs/agent-desktop №2 · 2 / 5 · новинка vercel-labs/agent-desktop Дає ШІ-агенту керувати будь-якою програмою на комп’ютері Що це: інструмент командного рядка від Vercel Labs для macOS, Windows і Linux (Apache 2.0) Як працює: читає дерево доступності ОС, як екранні читачі, і клікає по елементах без скріншотів; є MCP-сервер Кому: розробникам агентів; автори радять запускати у віртуальній машині без важливих акаунтів +11,9 тис. зірок за тиждень · 19,3 тис. загалом Чому це важливо Агенти виходять за межі браузера й можуть працювати з будь-якими настільними програмами. Джерела: fl"}, {"n": 19, "id": "g03", "topic": "github", "title": "NVIDIA/auto-ontology", "text": "github.com/NVIDIA/auto-ontology №3 · 3 / 5 · новинка NVIDIA/auto-ontology Семантичний шар, щоб ШІ-агенти правильно розуміли корпоративні дані Що це: бібліотека NVIDIA (Apache 2.0), що будує «онтологію» бізнес-термінів із метаданих баз даних Як працює: агент знаходить потрібні терміни, пише SQL, перевіряє його на базі й виправляє помилки; є MCP-сервер Кому: аналітикам і BI-командам; підтримує 10 типів баз даних і працює з правами користувача +9,1 тис. зірок за тиждень · 10,1 тис. загалом Чому це важливо Головна проблема ШІ-аналітики — неправильно зрозумілі дані. Онтологія дає агенту «словник ко"}, {"n": 20, "id": "g04", "topic": "github", "title": "cactus-compute/cactus", "text": "github.com/cactus-compute/cactus №4 · 4 / 5 · новинка cactus-compute/cactus Маленькі ШІ-моделі, що працюють прямо на пристрої Що це: Python-пакет (Apache 2.0) для локального запуску текстових, голосових і візуальних моделей Як працює: моделі Needle (виклик функцій), Whistle (розпізнавання мовлення) і Mirage (опис зображень) — без хмари Кому: розробникам застосунків для телефонів і ноутбуків, де важливі приватність і робота офлайн +8,4 тис. зірок за тиждень · 14,6 тис. загалом Чому це важливо Не кожна задача потребує великої моделі в хмарі: дрібні локальні моделі дешевші й приватніші. Джерела: "}, {"n": 21, "id": "g05", "topic": "github", "title": "heydamir/unslop", "text": "github.com/heydamir/unslop №5 · 5 / 5 · новинка heydamir/unslop Навичка для Claude Code, що прибирає «ШІ-шний» вигляд інтерфейсів Що це: skill, який виправляє типові ознаки згенерованого дизайну: фіолетові градієнти, сяйво, емодзі Як працює: аудит екрана → стиль під конкретний продукт → проходи по відступах, кольорах, шрифтах і анімації Кому: усім, хто збирає інтерфейси з ШІ; працює з React, Vue, Tailwind і HTML; ліцензія CC-BY-4.0 +6,5 тис. зірок за тиждень · 11,9 тис. загалом Чому це важливо ШІ-дизайн упізнають з першого погляду. Тренд тижня — вчити агентів робити унікальний, а не шаблонний "}, {"n": 22, "id": "final", "topic": "intro", "title": "Що це означає для нас", "text": "Підсумки тижня · 3–10 листопада Що це означає для нас 01 Гроші та скепсис водночас OpenAI і Anthropic залучають і заробляють рекордні суми, але ринок уперше різко засумнівався в окупності. 02 Безпека й темп ШІ знаходить сотні вразливостей і прискорює власний розвиток. Контроль і оновлення стають критичними. 03 Рахуйте витрати Компанії переходять на відкриті моделі й власні сервери, а громади вимагають, щоб ШІ платив за свою енергію. Дякую! Ваші питання? Усі випуски — у бібліотеці дайджестів 22"}]}, {"id": "w43", "week": 43, "title": "Новини ШІ: 20–27 жовтня 2026", "dates": "20–27 жовтня 2026", "start": "2026-10-20", "file": "issues/w43.html", "slideCount": 22, "newsCount": 11, "repoCount": 5, "cover": "<section class=\"pv\" id=\"cover\" data-transition=\"fade\" style=\"background:linear-gradient(135deg, #F6F7FB 0%, #EAEFFC 100%);color:#121A33;font-family:'Manrope', Arial, sans-serif;padding:128px;display:flex;flex-direction:column\">\n\n<p data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:200px;width:880px;font-size:26px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#3D5AFE\">Дайджест · тиждень 43<\/p>\n<h1 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:260px;width:880px;font-family:'Manrope', Arial, sans-serif;font-size:104px;font-weight:800;line-height:1.05;letter-spacing:-2px;color:#121A33\">Новини штучного інтелекту<\/h1>\n<p data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:600px;width:880px;font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;color:#C2410C\">20–27 жовтня 2026<\/p>\n<p data-build-in=\"fade 4 auto\" style=\"position:absolute;left:128px;top:720px;width:820px;font-size:32px;line-height:1.4;color:#4A5368\">10 головних подій тижня та 5 репозиторіїв GitHub, які вибухнули зірками<\/p>\n<aside class=\"notes\">Вітаю! Це короткий огляд найважливішого у світі штучного інтелекту за тиждень 20–27 жовтня 2026 року (дані зібрано станом на 26 жовтня). Спочатку — 10 новин у чотирьох темах: моделі, бізнес, безпека й регулювання, практика. Потім — п’ять проєктів на GitHub, які за тиждень набрали найбільше зірок завдяки своїй технології.<\/aside>\n<\/section>\n", "slides": [{"n": 1, "id": "cover", "topic": "intro", "title": "Новини штучного інтелекту", "text": "Дайджест · тиждень 43 Новини штучного інтелекту 20–27 жовтня 2026 10 головних подій тижня та 5 репозиторіїв GitHub, які вибухнули зірками"}, {"n": 2, "id": "agenda", "topic": "intro", "title": "Про що поговоримо", "text": "План огляду Про що поговоримо 01–03 Моделі та продукти Claude Duet, Kimi K3.1 Pro, Mistral Voxtral 3 04–06 Бізнес і угоди OpenAI у Google Cloud, Nvidia в Берліні, Orchestra Bio 07–09 Безпека і регулювання Діри в PHP, обмеження реверс-інжинірингу, правила США 10–11 Практика і відкритий код Заблоковані чати ChatGPT, DeepSeek DeepInfer Top 5 GitHub: зірки тижня Репозиторії з найбільшим приростом зірок 2"}, {"n": 3, "id": "numbers", "topic": "intro", "title": "Тиждень у цифрах", "text": "Коротко Тиждень у цифрах 6 000+ застосунків підключає новий агент Claude Duet 2,8 трлн параметрів у китайській моделі Kimi K3.1 Pro 14 днів щоб розгорнути дата-центр Nvidia DSX Pod +55,9 тис. зірок у REA — інструменту, який почали обмежувати 3"}, {"n": 4, "id": "m01", "topic": "models", "title": "Anthropic запустила Claude Duet — ШІ-агента, який працює у фоні", "text": "Моделі та продукти 21 жовтня 01 / 11 Anthropic запустила Claude Duet — ШІ-агента, який працює у фоні Щоранку надсилає бриф про головне з пошти, календаря та робочих застосунків Сам виконує завдання — від зустрічей до прогнозів продажів і дашбордів; працює на Opus 5.5 Перед оплатою, підписанням чи видаленням обов’язково питає дозволу 6 000+ застосунків можна підключити Чому це важливо Гонка персональних агентів: конкуренти — OpenAI Dots, Meta Muse і Gemini Spark. Доступ поки за листом очікування. Джерела: thurrott.com, iphoneincanada.ca 4"}, {"n": 5, "id": "m02", "topic": "models", "title": "Kimi K3.1 Pro: найсильніша модель Китаю, відкриті ваги — до 4 листопада", "text": "Моделі та продукти 23 жовтня 02 / 11 Kimi K3.1 Pro: найсильніша модель Китаю, відкриті ваги — до 4 листопада Архітектура MoE: 2,8 трлн параметрів (104 млрд активних), контекст до 1 млн токенів 55 балів в індексі Artificial Analysis — лише на 3 бали менше, ніж у Claude Opus 5.5 API на третину дешевший за K3: $2 за 1 млн вхідних і $10 за 1 млн вихідних токенів 2,8 трлн параметрів у моделі від Moonshot AI Чому це важливо Відкриті моделі з Китаю майже наздогнали флагмани США — і коштують у рази дешевше. Ліцензію ще не оголошено. Джерела: yottalabs.ai, Artificial Analysis (через willk30.substack.co"}, {"n": 6, "id": "m03", "topic": "models", "title": "Mistral Voxtral 3: голосові моделі та SDK для агентів, що розмовляють", "text": "Моделі та продукти 22 жовтня 03 / 11 Mistral Voxtral 3: голосові моделі та SDK для агентів, що розмовляють Розпізнавання мовлення 50+ мовами, синтез голосу — 35+ мовами; українська є в переліку Голосовий агент відповідає швидше ніж за секунду і замовкає, коли його перебивають Підключається до телефонії та застосунків; хостинг в ЄС або на власних серверах $0,0035 за хвилину розпізнавання мовлення Чому це важливо Європейська альтернатива для кол-центрів і голосових помічників: дані можна тримати в ЄС, що важливо для GDPR. Джерело: mistral.ai/news/voxtral-3 6"}, {"n": 7, "id": "b04", "topic": "business", "title": "Моделі OpenAI з’явилися в Google Cloud — у хмарі головного конкурента", "text": "Бізнес і угоди 21 жовтня 04 / 11 3 з 3 найбільших хмар США тепер продають моделі OpenAI Моделі OpenAI з’явилися в Google Cloud — у хмарі головного конкурента GPT-6 Astra, GPT-6.1 Sol, GPT-6 Luna та агент Codex — у приватному прев’ю Google Model Garden Тепер OpenAI є в усіх трьох найбільших хмарах США: Microsoft Azure, AWS і Google Cloud Google обіцяє: запити й відповіді клієнтів лишаються в їхньому контурі й не йдуть на навчання Чому це важливо Ексклюзивність Microsoft закінчилася. Бізнес може обирати модель, не змінюючи хмару й договори. Джерело: thenextweb.com 7"}, {"n": 8, "id": "b05", "topic": "business", "title": "Nvidia на GTC Berlin: дата-центр «під ключ» за 14 днів для Європи", "text": "Бізнес і угоди 21 жовтня 05 / 11 14 днів замість ≈6 місяців на розгортання дата-центру Nvidia на GTC Berlin: дата-центр «під ключ» за 14 днів для Європи DSX Pod — модульний ЦОД на архітектурі Vera Rubin у контейнерах; продажі з початку 2027 року За словами Дженсена Хуанга, Європа має ≈5% світових обчислень для ШІ, а США — ≈75% Партнерства з Siemens, Mercedes-Benz, Audi, Porsche; Bolt планує 25 000 авто на платформі Nvidia Чому це важливо Головне обмеження ШІ — швидкість будівництва дата-центрів. Nvidia продає вже не чипи, а цілі «фабрики ШІ». Джерела: borncity.com, baxtel.com 8"}, {"n": 9, "id": "b06", "topic": "business", "title": "OpenAI купує Orchestra Bio — ШІ-агентів для розробки ліків", "text": "Бізнес і угоди 20 жовтня 06 / 11 32 хв на аналіз даних мільйонів клітин мозку агентами GPT-Rosalind OpenAI купує Orchestra Bio — ШІ-агентів для розробки ліків Агенти стежать за клінічними дослідженнями, термінами й бюджетом і попереджають про зриви Технологію вбудують у Rosalind — набір ШІ-інструментів OpenAI для біології та фармації Сума угоди не розкривається; до покупки стартап залучив близько $20 млн інвестицій Чому це важливо Фарма — один із головних напрямів ШІ-угод. За повідомленнями, Anthropic раніше купила Coefficient Bio за ~$400 млн. Джерела: techstrong.ai, willk30.substack.com 9"}, {"n": 10, "id": "s07", "topic": "security", "title": "«Чорний жовтень»: ШІ знайшов критичні діри в PHP — мові ≈70% сайтів", "text": "Безпека і регулювання 21 жовтня 07 / 11 «Чорний жовтень»: ШІ знайшов критичні діри в PHP — мові ≈70% сайтів Calif з моделлю GPT-5.6 Sol і компанія Wiz знайшли дві вразливості для віддаленого запуску коду Патч вийшов того ж дня, але спроби атак зросли до мільйонів; ФБР і АНБ радили відключати сервери Того ж тижня: шкідлива версія LiteLLM, зломи Railway та OpenCode — хвиля крадіжок API-ключів ≈70% сайтів у світі працюють на PHP Чому це важливо: ШІ знаходить вразливості швидше за людей — і для захисту, і для атак. Вчасно оновлюйте ПЗ і змінюйте ключі доступу. Джерела: ppc.land, willk30.substack.c"}, {"n": 11, "id": "s08", "topic": "security", "title": "Claude і ChatGPT почали обмежувати реверс-інжиніринг через REA", "text": "Безпека і регулювання 23–25 жовтня 08 / 11 Claude і ChatGPT почали обмежувати реверс-інжиніринг через REA Користувачі повідомляють: Claude відмовляється працювати з REA — найпопулярнішим інструментом тижня на GitHub Дослідник log4j розібрав телевізор Samsung, знайшов код збору даних — і отримав бан в OpenAI за «кіберзловживання» Офіційних заяв немає. Нова політика Anthropic з 12 листопада прямо дозволяє дослідження безпеки власних систем 1 млн+ переглядів постів про «смерть REA» Чому це важливо: межа між захистом і атакою розмита. Компанії страхуються ширшими блокуваннями, а дослідники переход"}, {"n": 12, "id": "s09", "topic": "security", "title": "США: нові правила для ШІ в держзакупівлях набули чинності", "text": "Безпека і регулювання 19 жовтня 09 / 11 США: нові правила для ШІ в держзакупівлях набули чинності Пункт GSAR 552.239-7001 діє для чат-ботів, LLM та агентних систем, які купує уряд США Модель має бути налаштована на точність і об’єктивність; держава може тестувати її на упередженість Інциденти з держданими — обов’язково повідомляти; вимоги поширюються й на субпідрядників 19.10 2026 — дата набуття чинності Чому це важливо: держзакупівлі ШІ отримують власні правила. Схожий підхід і в AI Act ЄС: прозорість, захист даних, відповідальність постачальника. Джерело: winvale.com (огляд правила GSA) 12"}, {"n": 13, "id": "p10", "topic": "practice", "title": "ChatGPT дозволив ховати приватні чати за PIN-кодом або біометрією", "text": "Практика і відкритий код 20–21 жовтня 10 / 11 ChatGPT дозволив ховати приватні чати за PIN-кодом або біометрією 4 цифри PIN-код для доступу до прихованих чатів Це захист від чужих очей, а не шифрування: правила зберігання даних не змінюються. Для таємниць — тимчасовий чат. 1 Заблоковані чати зникають з історії та пошуку й відкриваються лише PIN-кодом або Face ID 2 Доступно на всіх тарифах — від Free до Enterprise; функція вмикається поступово 3 Забули PIN — заблоковані чати видаляються назавжди, підтримка OpenAI їх не відновить Джерело: businesstoday.in 13"}, {"n": 14, "id": "p11", "topic": "practice", "title": "DeepSeek відкрила DeepInfer — свій рушій для чипів Nvidia і Huawei", "text": "Практика і відкритий код 20 жовтня 11 / 11 DeepSeek відкрила DeepInfer — свій рушій для чипів Nvidia і Huawei +8,8 тис. зірок на GitHub за тиждень 19–25 жовтня Китай зменшує залежність від Nvidia: моделі DeepSeek можна запускати на власних серверах, зокрема на чипах Huawei Ascend. 1 Той самий фреймворк, на якому працюють сервіси DeepSeek, тепер у відкритому доступі 2 Розподілений запуск, спекулятивне декодування, структурований вивід; поки — DeepSeek-V4.1-Flash 3 Репозиторій увійшов у топ-10 GitHub тижня: 21,9 тис. зірок загалом Джерела: technode.com, gittrend.io 14"}, {"n": 15, "id": "repos-intro", "topic": "github", "title": "GitHub: репозиторії, що вибухнули зірками", "text": "Розділ 2 · Відкритий код GitHub: репозиторії, що вибухнули зірками Тиждень 19–25 жовтня 2026 · рейтинг gittrend.io за приростом зірок 15"}, {"n": 16, "id": "g-chart", "topic": "github", "title": "Найгарячіші ШІ-репозиторії тижня", "text": "$ git trending --since=weekly --topic=ai Найгарячіші ШІ-репозиторії тижня cloudflare/security-audit-skill +13,5 тис. ai-job-search +11,5 тис. DietrichGebert/ponytail +8,5 тис. xerj-org/xerj +6,8 тис. · новинка tangency-labs/solidcraft +4,3 тис. · новинка Приріст зірок за 19–25.10.2026 · gittrend.io · REA (+55,9 тис.) — у новині 08, DeepInfer (+8,8 тис.) — у новині 11 16"}, {"n": 17, "id": "g01", "topic": "github", "title": "cloudflare/security-audit-skill", "text": "github.com/cloudflare/security-audit-skill №1 · 1 / 5 cloudflare/security-audit-skill Навичка для ШІ-агентів: аудит безпеки коду від Cloudflare Що це: відкрита (MIT) версія підходу, яким Cloudflare постійно перевіряє 128 власних репозиторіїв Як працює: 6 етапів — розвідка, агенти-«мисливці» шукають баги, свіжий агент намагається їх спростувати, повторна перевірка, звіт Кому: командам розробки; у Cloudflare репозиторій на 30 тис. рядків дає ~80 багів за 3 години +13,5 тис. зірок за тиждень · 44,7 тис. загалом Чому це важливо Агенти перевіряють один одного — це відсіює хибні тривоги. Але знахідк"}, {"n": 18, "id": "g03", "topic": "github", "title": "ai-job-search", "text": "github.com/ai-job-search-dev/ai-job-search №2 · 2 / 5 ai-job-search Локальний помічник для пошуку роботи на базі Claude Code Що це: відкритий фреймворк, що перетворює агента-кодера на персонального кар’єрного асистента Як працює: оцінює вакансії за вашими критеріями, адаптує резюме, пише супровідні листи, готує до співбесід Кому: шукачам роботи та HR-фахівцям; усі дані лишаються на вашому комп’ютері +11,5 тис. зірок за тиждень · 64,9 тис. загалом Чому це важливо Агенти-кодери стають універсальними асистентами: той самий Claude Code веде пошук роботи, а не лише пише програми. Джерела: aitoolly."}, {"n": 19, "id": "g04", "topic": "github", "title": "DietrichGebert/ponytail", "text": "github.com/DietrichGebert/ponytail №3 · 3 / 5 DietrichGebert/ponytail «Лінивий сеньйор»: правила, що вчать агентів писати менше коду Що це: набір правил для агентів-кодерів — найменше правильне рішення без шкоди для безпеки й перевірок Як працює: 7 сходинок — чи потрібна функція, чи вона вже є в коді, бібліотеці, платформі — і лише потім новий код Кому: розробникам на Claude Code, Codex та інших; у тесті автора — на 54% менше коду й на 20% дешевше +8,5 тис. зірок за тиждень · 175,6 тис. загалом Чому це важливо Більше коду — більше багів і витрат. Тренд тижня: вчити агентів робити менше, але кр"}, {"n": 20, "id": "g06", "topic": "github", "title": "xerj-org/xerj", "text": "github.com/xerj-org/xerj №4 · 4 / 5 · новинка xerj-org/xerj Локальний пошуковик і «пам’ять» для ШІ-агентів в одному файлі Що це: пошуковий рушій на Rust і MCP-сервер, що індексує код, документи, логи, таблиці та PDF Як працює: поєднує класичний повнотекстовий пошук (BM25) і векторний за змістом — гібридний пошук без хмари Кому: командам, які дають агентам доступ до власних документів (RAG); API сумісний з Elasticsearch +6,8 тис. зірок за тиждень · 15,3 тис. загалом Чому це важливо Агентам потрібна пам’ять про ваші дані. xerj дає її локально — без передачі документів у хмару. Джерела: skillsllm"}, {"n": 21, "id": "g07", "topic": "github", "title": "tangency-labs/solidcraft", "text": "github.com/tangency-labs/solidcraft №5 · 5 / 5 · новинка tangency-labs/solidcraft 3D-CAD, яким може керувати ШІ-агент Що це: відкрита параметрична CAD-система на Rust: ескізи, тверді тіла, обмеження, історія побудови Як працює: кожна дія — це команда з JSON-параметрами, тому через MCP-сервер агент «креслить» деталь сам Кому: інженерам і мейкерам; працює на десктопі, у браузері та з командного рядка; проєкт ще ранній +4,3 тис. зірок за тиждень · 10,1 тис. загалом Чому це важливо ШІ виходить за межі тексту й коду: агенти починають проєктувати фізичні деталі «словами». Джерела: hackaday.com, gitt"}, {"n": 22, "id": "final", "topic": "intro", "title": "Що це означає для нас", "text": "Підсумки тижня · 20–27 жовтня Що це означає для нас 01 Агенти стають «колегами» Claude Duet і конкуренти працюють у фоні: самі збирають інформацію й виконують доручення, питаючи дозволу на важливе. 02 Безпека — пріоритет №1 ШІ знаходить вразливості швидше за людей, а компанії посилюють обмеження. Оновлення й захист ключів — обов’язкові. 03 Більше вибору, нижчі ціни OpenAI — у всіх великих хмарах, Kimi та DeepSeek відкривають моделі, а GitHub щотижня дає нові інструменти. Дякую! Ваші питання? Наступний дайджест — через тиждень 22"}]}]}, "frags": {"issues/w45.html": "<section class=\"slide\" id=\"cover\" data-transition=\"fade\" style=\"background:linear-gradient(135deg, #F6F7FB 0%, #FDEFE4 100%);color:#121A33;font-family:'Manrope', Arial, sans-serif;padding:128px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:1040px;top:128px;width:752px;height:824px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;);let W,H,R=window.devicePixelRatio||1;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst N=44,P=[];for(let i=0;i&lt;N;i++)P.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0009,vy:(Math.random()-.5)*.0009,o:Math.random()&lt;.18,ph:Math.random()*6});\nfunction f(t){x.clearRect(0,0,W,H);const s=Math.min(W,H),L=s*.24;\nfor(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x&lt;.02||p.x&gt;.98)p.vx*=-1;if(p.y&lt;.02||p.y&gt;.98)p.vy*=-1}\nfor(let i=0;i&lt;N;i++)for(let j=i+1;j&lt;N;j++){const a=P[i],b=P[j],dx=(a.x-b.x)*W,dy=(a.y-b.y)*H,d=Math.hypot(dx,dy);if(d&lt;L){x.strokeStyle=&#x27;rgba(61,90,254,&#x27;+((1-d/L)*.4).toFixed(3)+&#x27;)&#x27;;x.lineWidth=1.4*R;x.beginPath();x.moveTo(a.x*W,a.y*H);x.lineTo(b.x*W,b.y*H);x.stroke()}}\nfor(const p of P){const k=p.o?5+2.5*Math.sin(t/320+p.ph):3.2;if(p.o){x.fillStyle=&#x27;rgba(255,122,26,.18)&#x27;;x.beginPath();x.arc(p.x*W,p.y*H,k*3.2*R,0,7);x.fill()}x.fillStyle=p.o?&#x27;#FF7A1A&#x27;:&#x27;#3D5AFE&#x27;;x.beginPath();x.arc(p.x*W,p.y*H,k*1.5*R,0,7);x.fill()}\nrequestAnimationFrame(f)}requestAnimationFrame(f);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<p data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:200px;width:880px;font-size:26px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#3D5AFE\">Дайджест · тиждень 45<\/p>\n<h1 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:260px;width:880px;font-family:'Manrope', Arial, sans-serif;font-size:104px;font-weight:800;line-height:1.05;letter-spacing:-2px;color:#121A33\">Новини штучного інтелекту<\/h1>\n<p data-build-in=\"rise 3 auto\" style=\"position:absolute;left:128px;top:600px;width:900px;font-family:'Unbounded', Verdana, sans-serif;font-size:56px;font-weight:700;color:#C2410C\">3–10 листопада 2026<\/p>\n<p data-build-in=\"fade 4 auto\" style=\"position:absolute;left:128px;top:720px;width:820px;font-size:32px;line-height:1.4;color:#4A5368\">11 головних подій тижня та 5 нових репозиторіїв GitHub, які набрали найбільше зірок<\/p>\n<aside class=\"notes\">Вітаю! Це огляд найважливішого у світі штучного інтелекту за 3–10 листопада 2026 року (дані зібрано станом на 9 листопада). Спершу 11 новин у чотирьох темах, потім — п’ять нових проєктів GitHub тижня.<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"agenda\" data-transition=\"push\" style=\"background:#F6F7FB;color:#121A33;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<p d dius:20px;padding:22px 28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#F4F6FF;border-radius:50%\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#3D5AFE;width:30px;height:30px\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/><\/svg><\/div>\n<p style=\"flex:1;font-size:28px;line-height:1.4;color:#F4F6FF\">Адміни команди бачать усі застосунки, затверджують публікації й можуть їх зняти<\/p>\n<\/div>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:1180px;top:390px;width:612px;display:flex;flex-direction:column;gap:16px;background:rgba(10,16,70,0.38);border:1px solid rgba(255,255,255,0.22);border-radius:28px;padding:44px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:72px;font-weight:700;line-height:1.1;color:#FFFFFF\">1 промпт<\/p>\n<p style=\"font-size:24px;line-height:1.4;color:#DDE3FF\">від ідеї до робочого застосунку з посиланням<\/p>\n<hr style=\"border-top:2px solid rgba(255,255,255,0.25)\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#FFD166\">Чому це важливо<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#F4F6FF\">Внутрішні інструменти для відділу можна зібрати за години. Але потрібні правила: хто і що публікує.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#EEF1FF\">Джерело: cursor.com/changelog<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#EEF1FF\">5<\/p>\n<aside class=\"notes\">5 листопада Cursor запустив Build Live Apps: хмарні агенти створюють вебзастосунок, за потреби піднімають базу Postgres, налаштовують вхід через Cursor SSO і хостинг з власним доменом. Нічого не публікується, доки не пройдено детерміновані й агентні перевірки (зокрема на секрети у файлах) і користувач сам не натисне «опублікувати». Адміністратори бачать усі застосунки й можуть затверджувати або знімати публікації. Доступно на платних планах із хмарними агентами. Джерело: https://cursor.com/changelog/build-live-apps<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"m03\" data-transition=\"fade\" style=\"background:linear-gradient(135deg, #1E2A78 0%, #3D5AFE 100%);color:#F4F6FF;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:1080px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst N=60,P=[];for(let i=0;i&lt;N;i++)P.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0005,vy:(Math.random()-.5)*.0005,ph:Math.random()*6});\nfunction f(t){x.clearRect(0,0,W,H);const L=Math.min(W,H)*.2;\nfor(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x&lt;0||p.x&gt;1)p.vx*=-1;if(p.y&lt;0||p.y&gt;1)p.vy*=-1}\nfor(let i=0;i&lt;N;i++)for(let j=i+1;j&lt;N;j++){const a=P[i],b=P[j],d=Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);if(d&lt;L){x.strokeStyle=&#x27;rgba(255,255,255,&#x27;+((1-d/L)*.16).toFixed(3)+&#x27;)&#x27;;x.lineWidth=1.2*R;x.beginPath();x.moveTo(a.x*W,a.y*H);x.lineTo(b.x*W,b.y*H);x.stroke()}}\nfor(const p of P){x.fillStyle=&#x27;rgba(255,255,255,&#x27;+(.25+.2*Math.sin(t/500+p.ph)).toFixed(3)+&#x27;)&#x27;;x.beginPath();x.arc(p.x*W,p.y*H,3*R,0,7);x.fill()}\nrequestAnimationFrame(f)}requestAnimationFrame(f);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;display:flex;align-items:center;gap:20px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1E2A78;background:#F4F6FF;padding:8px 22px;border-radius:999px\">Моделі та продукти<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#DDE3FF\">4 листопада<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#F4F6FF\">03 / 11<\/p>\n<\/div>\n<h2 data-build-in=\"rise 2 auto\" style=\"position:absolute;left:128px;top:200px;width:1664px;font-size:64px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#FFFFFF\">Claude допоміг знайти в бактеріях загадкові білкові «сховища»<\/h2>\n<div data-build-in=\"left 3 auto\" style=\"position:absolute;left:128px;top:390px;width:1000px;display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;gap:20px;align-items:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:20px;padding:22px 28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#F4F6FF;border-radius:50%\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#3D5AFE;width:30px;height:30px\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/><\/svg><\/div>\n<p style=\"flex:1;font-size:28px;line-height:1.4;color:#F4F6FF\">Переглянув ~15 млрд передбачених білків і знайшов родичів vault-білка у 29 типах бактерій<\/p>\n<\/div>\n<div style=\"display:flex;gap:20px;align-items:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:20px;padding:22px 28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#F4F6FF;border-radius:50%\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#3D5AFE;width:30px;height:30px\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"/><\/svg><\/div>\n<p style=\"flex:1;font-size:28px;line-height:1.4;color:#F4F6FF\">З 15 перевірених білків 7 зібралися у «сховища»; кріоелектронна мікроскопія підтвердила 4<\/p>\n<\/div>\n<div style=\"display:flex;gap:20px;align-items:center;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:20px;padding:22px 28px\">\n<div style=\"width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#F4F6FF;border-radius:50%\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#3D5AFE;width:30px;height:30px\"><polygon points=\"13 2 3 14 12 14 11 22 21 10 12 10 13 2\"/><\/svg><\/div>\n<p style=\"flex:1;font-size:28px;line-height:1.4;color:#F4F6FF\">Очищення білка — 90 хвилин замість ~3 днів, перша 3D-модель — за 34 години<\/p>\n<\/div>\n<\/div>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:1180px;top:390px;width:612px;display:flex;flex-direction:column;gap:16px;background:rgba(10,16,70,0.38);border:1px solid rgba(255,255,255,0.22);border-radius:28px;padding:44px\">\n<p style=\"font-family:'Unbounded', Verdana, sans-serif;font-size:72px;font-weight:700;line-height:1.1;color:#FFFFFF\">15 млрд<\/p>\n<p style=\"font-size:24px;line-height:1.4;color:#DDE3FF\">білків переглянув Claude у пошуку кандидатів<\/p>\n<hr style=\"border-top:2px solid rgba(255,255,255,0.25)\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#FFD166\">Чому це важливо<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#F4F6FF\">ШІ стає учасником лабораторних досліджень. Звіт чесно описує й помилки Claude, які коштували команді тижні.<\/p>\n<\/div>\n<p style=\"position:absolute;left:128px;bottom:64px;width:1300px;font-size:24px;color:#EEF1FF\">Джерело: anthropic.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#EEF1FF\">6<\/p>\n<aside class=\"notes\">Vault («сховище») — великі порожнисті білкові оболонки, відомі з 1986 року в клітинах еукаріотів; їхня функція досі невідома. 4 листопада наукова команда Anthropic розповіла, як Claude шукав їхніх родичів серед ~15 млрд передбачених білків, допоміг обрати 44 кандидати, спроєктувати ДНК і обробити дані кріо-ЕМ. Розв’язано структуру фагового «сховища» L05 зі 96 копій білка (у ссавців — 78). Застереження: поки що вони отримані лише в E. coli, а помилковий протокол Claude коштував близько двох тижнів. Джерело: https://www.anthropic.com/news/investigating-vault-particles-with-claude<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"b04\" data-transition=\"push\" style=\"background:#F7F4EC;color:#14211E;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<div data-build-in=\"left 1 auto\" style=\"position:absolute;left:0px;top:0px;width:720px;height:1080px;background:linear-gradient(160deg, #0B6B5C 0%, #064E43 100%)\"><\/div>\n<div data-build-in=\"fade 2 auto\" style=\"position:absolute;left:128px;top:128px;width:500px;display:flex;align-items:center;gap:16px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1B1A16;background:#F2C14E;padding:8px 20px;border-radius:999px\">Бізнес і гроші<\/p>\n<p style=\"font-size:26px;font-weight:600;color:#CFEDE6\">6 листопада<\/p>\n<\/div>\n<p data-build-in=\"fade 2 auto\" style=\"position:absolute;left:128px;top:204px;width:400px;font-family:'Unbounded', Verdana, sans-serif;font-size:28px;font-weight:700;color:#9FD8CB\">04 / 11<\/p>\n<svg data-build-in=\"pop 3 auto\" class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:absolute;left:128px;top:340px;width:112px;height:112px;color:#F2C14E\"><path d=\"M3 3v18h18\"/><path d=\"M18 17V9\"/><path d=\"M13 17V5\"/><path d=\"M8 17v-3\"/><\/svg>\n<p data-build-in=\"scale 4 auto\" style=\"position:absolute;left:128px;top:490px;width:540px;font-family:'Unbounded', Verdana, sans-serif;font-size:64px;font-weight:700;line-height:1.1;color:#FDFBF5\">$1,25 трлн<\/p>\n<p data-build-in=\"fade 5 auto\" style=\"position:absolute;left:128px;top:620px;width:480px;font-size:30px;line-height:1.4;color:#CFEDE6\">оцінка OpenAI після першої частини нового раунду<\/p>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:128px;top:780px;width:480px;height:140px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:transparent&quot;&gt;&lt;canvas id=&quot;c&quot;&gt;&lt;/canvas&gt;&lt;script&gt;\nconst c=document.getElementById(&#x27;c&#x27;),x=c.getContext(&#x27;2d&#x27;),R=window.devicePixelRatio||1;let W,H;\nfunction r(){W=c.width=innerWidth*R;H=c.height=innerHeight*R;c.style.width=innerWidth+&#x27;px&#x27;;c.style.height=innerHeight+&#x27;px&#x27;}r();addEventListener(&#x27;resize&#x27;,r);\nconst N=12,B=[];for(let i=0;i&lt;N;i++)B.push(.2+.75*(i/(N-1))*(.7+.3*Math.random()));\nfunction f(t){x.clearRect(0,0,W,H);const p=(t%6000)/6000,k=Math.min(1,p*1.6),bw=W/N;x.globalAlpha=p&gt;.85?1-(p-.85)/.15:1;\nfor(let i=0;i&lt;N;i++){const g=Math.max(0,Math.min(1,k*N-i)),h=B[i]*H*.85*g;x.fillStyle=&#x27;rgba(159,216,203,.35)&#x27;;x.fillRect(i*bw+bw*.18,H-h,bw*.64,h)}\nconst m=Math.max(0,Math.min(N-1,Math.floor(k*N)-1));x.strokeStyle=&#x27;#F2C14E&#x27;;x.lineWidth=3*R;x.beginPath();for(let i=0;i&lt;=m;i++){const X=i*bw+bw/2,Y=H-B[i]*H*.85-6*R;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();\nx.fillStyle=&#x27;#F2C14E&#x27;;x.beginPath();x.arc(m*bw+bw/2,H-B[m]*H*.85-6*R,6*R,0,7);x.fill();x.globalAlpha=1;requestAnimationFrame(f)}requestAnimationFrame(f);\n&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<h2 data-build-in=\"rise 3 auto\" style=\"position:absolute;left:800px;top:128px;width:992px;font-size:56px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#14211E\">OpenAI залучила $11 млрд при оцінці $1,25 трлн<\/h2>\n<div data-build-in=\"rise 4 auto\" style=\"position:absolute;left:800px;top:370px;width:992px;display:flex;flex-direction:column;gap:26px\">\n<div style=\"display:flex;gap:20px;align-items:start\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#087563;width:36px;height:36px\"><polyline points=\"20 6 9 17 4 12\"/><\/svg><p style=\"flex:1;font-size:28px;line-height:1.4;color:#2B3430\">Це перша частина раунду, загалом він може сягнути $20 млрд (Bloomberg)<\/p><\/div>\n<div style=\"display:flex;gap:20px;align-items:start\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#087563;width:36px;height:36px\"><polyline points=\"20 6 9 17 4 12\"/><\/svg><p style=\"flex:1;font-size:28px;line-height:1.4;color:#2B3430\">За повідомленнями ЗМІ, раніше компанія цілилася у $30 млрд при оцінці $1,4 трлн<\/p><\/div>\n<div style=\"display:flex;gap:20px;align-items:start\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#087563;width:36px;height:36px\"><polyline points=\"20 6 9 17 4 12\"/><\/svg><p style=\"flex:1;font-size:28px;line-height:1.4;color:#2B3430\">5 листопада OpenAI пообіцяла сама платити за енергію та інфраструктуру своїх кампусів<\/p><\/div>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:800px;top:700px;width:992px;display:flex;flex-direction:column;gap:10px;background:#E6F2EE;border-left:8px solid #087563;border-radius:20px;padding:30px 36px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#087563\">Чому це важливо<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#14211E\">Інвестори й далі фінансують гонку ШІ, але обережніше: зібрано менше, ніж планувалося.<\/p>\n<\/div>\n<p style=\"position:absolute;left:800px;bottom:64px;width:900px;font-size:24px;color:#5F6660\">Джерела: gvwire.com (Reuters / Bloomberg), siliconreport.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#5F6660\">7<\/p>\n<aside class=\"notes\">6 листопада Bloomberg, а за ним Reuters повідомили: OpenAI закрила $11 млрд — першу частину раунду при оцінці $1,25 трлн; загалом раунд може сягнути $20 млрд. Раніше ЗМІ писали про ціль від $30 млрд при оцінці $1,4 трлн. Напередодні, 5 листопада, OpenAI опублікувала National Community Compact: для власних кампусів обіцяє оплачувати електроенергію й додаткову інфраструктуру та публікувати щорічні звіти. Джерела: https://gvwire.com/2026/11/06/openai-secures-11-billion-funding-at-1-25-trillion-valuation-bloomberg-news-reports/ ; https://www.siliconreport.com/openai-raises-less-than-half-of-30-billion-target<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"b05\" data-transition=\"push\" style=\"background:#F7F4EC;color:#14211E;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<div data-build-in=\"left 1 auto\" style=\"position:absolute;left:0px;top:0px;width:720px;height:1080px;background:linear-gradient(160deg, #0B6B5C 0%, #064E43 100%)\"><\/div>\n<div data-build-in=\"fade 2 auto\" style=\"position:absolute;left:128px;top:128px;width:500px;display:flex;align-items:center;gap:16p px;align-items:start\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#087563;width:36px;height:36px\"><polyline points=\"20 6 9 17 4 12\"/><\/svg><p style=\"flex:1;font-size:28px;line-height:1.4;color:#2B3430\">Зобов’язання на ~$895 млрд, майже все — обчислення й інфраструктура (Broadcom, Google, Amazon)<\/p><\/div>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:800px;top:700px;width:992px;display:flex;flex-direction:column;gap:10px;background:#E6F2EE;border-left:8px solid #087563;border-radius:20px;padding:30px 36px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#087563\">Чому це важливо<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#14211E\">IPO під тикером ANT планується на Nasdaq до кінця листопада; інвестори обговорюють оцінку $1,4–1,5 трлн.<\/p>\n<\/div>\n<p style=\"position:absolute;left:800px;bottom:64px;width:900px;font-size:24px;color:#5F6660\">Джерело: thenextweb.com<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#5F6660\">8<\/p>\n<aside class=\"notes\">2 листопада Anthropic подала оновлений проспект IPO. Виручка за III квартал — майже $17 млрд (за 9 місяців — $33,2 млрд). Операційний збиток — близько $567 млн після прибутку $974 млн у II кварталі; чистий збиток $23,3 млрд переважно через негрошову переоцінку конвертованих нот. Зобов’язання з закупівель — $895,4 млрд, з них ~$70 млрд у найближчі 12 місяців. Найбільші контрагенти — Broadcom, Google, Amazon. Reuters пише, що інвестори сумніваються, чи встигне компанія з роудшоу до кінця листопада. Джерело: https://thenextweb.com/news/anthropic-ipo-filing-17bn-revenue-commitments<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"b06\" data-transition=\"fade\" style=\"background:#F7F4EC;color:#14211E;font-family:'Manrope', Arial, sans-serif;p p:20px;align-items:start\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#087563;width:36px;height:36px\"><polyline points=\"20 6 9 17 4 12\"/><\/svg><p style=\"flex:1;font-size:28px;line-height:1.4;color:#2B3430\">S&P 500 знизився на 4,4%, а Nasdaq опинився на 11,9% нижче свого рекорду — це «корекція»<\/p><\/div>\n<div style=\"display:flex;gap:20px;align-items:start\"><svg class=\"ico\" viewBox=\"-3 -3 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"color:#087563;width:36px;height:36px\"><polyline points=\"20 6 9 17 4 12\"/><\/svg><p style=\"flex:1;font-size:28px;line-height:1.4;color:#2B3430\">Причини: дорожчі кредити, страх «бульбашки» та ризик пауз у будівництві дата-центрів<\/p><\/div>\n<\/div>\n<div data-build-in=\"rise 5 auto\" style=\"position:absolute;left:800px;top:700px;width:992px;display:flex;flex-direction:column;gap:10px;background:#E6F2EE;border-left:8px solid #087563;border-radius:20px;padding:30px 36px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#087563\">Чому це важливо<\/p>\n<p style=\"font-size:26px;line-height:1.4;color:#14211E\">Ринок уперше так різко засумнівався, що витрати на ШІ-інфраструктуру швидко окупляться.<\/p>\n<\/div>\n<p style=\"position:absolute;left:800px;bottom:64px;width:900px;font-size:24px;color:#5F6660\">Джерело: wsmv.com (Associated Press)<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;text-align:right;color:#5F6660\">9<\/p>\n<aside class=\"notes\">5 листопада S&P 500 упав на 4,4% — найгірший день з квітня 2025 року, Nasdaq Composite — на 5,5%, Dow Jones — на 3,4%. Найбільше втратили Nvidia (−9,3%), AMD (−17,3%), CoreWeave (−9,8%), GE Vernova (−7,5%). Причини, за AP: дорожчі запозичення можуть уповільнити будівництво дата-центрів, побоювання «бульбашки», а також ризик місцевих обмежень на нові дата-центри після голосувань 3 листопада. Джерело: https://www.wsmv.com/2026/11/05/brutal-sell-off-ai-stocks-sends-wall-street-reeling-sp-500-sees-worst-day-since-2025-liberation-day-tariffs/<\/aside>\n<\/section>\n\n<section class=\"slide\" id=\"s07\" data-transition=\"push\" style=\"background:#1A1D24;color:#F5F2EE;font-family:'Manrope', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column\">\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:0px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<iframe class=\"embed\" sandbox=\"allow-scripts\" title=\"анімація\" style=\"position:absolute;left:0px;top:1060px;width:1920px;height:20px;border:0\" data-srcdoc=\"&lt;!doctype html&gt;&lt;html&gt;&lt;body style=&quot;margin:0;overflow:hidden;background:#1A1D24&quot;&gt;&lt;div style=&quot;position:absolute;left:-136px;top:0;width:2200px;height:20px;background:repeating-linear-gradient(45deg,#FB923C 0 24px,#1A1D24 24px 48px);animation:m 1.2s linear infinite reverse&quot;&gt;&lt;/div&gt;&lt;style&gt;@keyframes m{to{transform:translateX(67.88px)}}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe>\n<div data-build-in=\"fade 1 auto\" style=\"position:absolute;left:128px;top:128px;width:1664px;display:flex;align-items:center;gap:20px\">\n<p style=\"font-size:24px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#1A1D24;background:#FB923C;padding:8px 22px;border-radius:8px\">Безпека і регулювання<\/
